name: Check pull request

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Titles, banned characters and internal links
        run: node scripts/check-site.mjs
      - name: Install Playwright (not saved to package.json)
        run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: No horizontal overflow at 375px
        run: |
          npx astro preview --port 4321 &
          for i in $(seq 30); do curl -sf http://localhost:4321/ >/dev/null && break; sleep 1; done
          node scripts/check-mobile.mjs
