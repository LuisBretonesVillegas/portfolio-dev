<script>
/* Lógica pura del test (sin DOM): muestreo, barajado y puntuación. Se usa en el navegador y en las pruebas de Node. */
const SSII = (() => {
  'use strict';

  // Generador pseudoaleatorio reproducible (mulberry32) para las pruebas; en la app se usa Math.random.
  function makeRng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function shuffle(arr, rnd) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function perm5(rnd) { return shuffle([0, 1, 2, 3, 4], rnd); }

  // Reparto de `total` unidades proporcional a `weights`, sin sesgo: cada parte recibe la parte entera
  // de su cuota exacta y una unidad extra con probabilidad igual a la parte fraccionaria (muestreo
  // sistemático con arranque aleatorio), de modo que la suma es siempre `total` y ningún apartado
  // pequeño queda excluido para siempre. `caps` limita cada parte.
  function apportion(weights, total, rnd, caps) {
    const W = weights.reduce((s, w) => s + w, 0);
    const n = weights.length;
    const cap = caps || weights.map(() => Infinity);
    const exact = weights.map(w => (W ? (w * total) / W : 0));
    const q = exact.map((x, i) => Math.min(Math.floor(x + 1e-9), cap[i]));
    let left = total - q.reduce((s, x) => s + x, 0);
    if (left > 0) {
      const order = shuffle([...Array(n).keys()], rnd);
      const frac = order.map(i => Math.max(0, Math.min(1, exact[i] - q[i])));
      const F = frac.reduce((s, x) => s + x, 0);
      if (F > 1e-9) {
        // Puntos u, u+1, …, u+left−1 sobre los fraccionarios reescalados a suma `left`.
        const scale = left / F, u = rnd();
        let cum = 0, m = 0;
        order.forEach((i, j) => {
          const a = cum; cum += frac[j] * scale;
          while (m < left && u + m < cum - 1e-12 && u + m >= a - 1e-12) {
            if (q[i] < cap[i]) { q[i]++; }
            m++;
          }
        });
        left = total - q.reduce((s, x) => s + x, 0);
      }
      // Ajuste final (redondeos o topes): reparte lo que falte entre las partes con hueco.
      let guard = 0;
      while (left > 0 && guard++ < 10000) {
        let progressed = false;
        for (const i of shuffle([...Array(n).keys()], rnd)) {
          if (left === 0) break;
          if (q[i] < cap[i]) { q[i]++; left--; progressed = true; }
        }
        if (!progressed) break;
      }
    }
    return q;
  }

  // Selecciona k preguntas de un tema: reparto proporcional al nº de conceptos de cada apartado,
  // como mucho una formulación por concepto.
  function sampleTema(tema, k, rnd) {
    const bySec = new Map();
    tema.qs.forEach((q, i) => {
      if (!bySec.has(q.s)) bySec.set(q.s, new Map());
      const concepts = bySec.get(q.s);
      if (!concepts.has(q.c)) concepts.set(q.c, []);
      concepts.get(q.c).push(i);
    });
    const secs = [...bySec.keys()];
    const counts = secs.map(s => bySec.get(s).size);
    const totalConcepts = counts.reduce((s, x) => s + x, 0);
    if (k > totalConcepts) throw new Error(`Tema ${tema.n}: se piden ${k} preguntas y solo hay ${totalConcepts} conceptos`);
    const quotas = apportion(counts, k, rnd, counts);
    const out = [];
    secs.forEach((s, si) => {
      const concepts = shuffle([...bySec.get(s).values()], rnd);
      for (let j = 0; j < quotas[si]; j++) {
        const forms = concepts[j];
        out.push(forms[Math.floor(rnd() * forms.length)]);
      }
    });
    return shuffle(out, rnd);
  }

  const EXAM_KINDS = {
    parcial: { label: 'Examen parcial', temas: [1, 2, 3, 4], total: 50 },
    final: { label: 'Examen final', temas: [1, 2, 3, 4], total: 50 }
  };

  // Examen: 50 preguntas equilibradas entre los temas (13/13/12/12 o 10×5), ordenadas por tema.
  function buildExam(bank, kind, rnd) {
    const def = EXAM_KINDS[kind];
    if (!def) throw new Error('Tipo de examen desconocido: ' + kind);
    const temas = def.temas.filter(t => bank[t]);
    const per = apportion(temas.map(() => 1), def.total, rnd);
    const items = [];
    temas.forEach((t, ti) => {
      for (const i of sampleTema(bank[t], per[ti], rnd)) items.push({ t, i, p: perm5(rnd) });
    });
    return { kind, temas, perTema: Object.fromEntries(temas.map((t, ti) => [t, per[ti]])), items };
  }

  // Práctica: preguntas de los temas elegidos, filtradas según las estadísticas guardadas.
  function practicePool(bank, temas, filter, stats) {
    const pool = [];
    for (const t of temas) {
      if (!bank[t]) continue;
      bank[t].qs.forEach((q, i) => {
        const st = stats && stats[qid(t, i)];
        if (filter === 'unseen' && st && st[0] > 0) return;
        if (filter === 'failed' && !(st && st[2] === 0)) return;
        pool.push({ t, i });
      });
    }
    return pool;
  }

  function buildPractice(bank, temas, opts, stats, rnd) {
    const o = Object.assign({ count: 'all', filter: 'all', order: 'random' }, opts || {});
    let pool = shuffle(practicePool(bank, temas, o.filter, stats), rnd);
    if (o.count !== 'all') pool = pool.slice(0, Math.max(0, +o.count));
    if (o.order === 'tema') pool.sort((a, b) => a.t - b.t || a.i - b.i);
    return pool.map(x => ({ t: x.t, i: x.i, p: perm5(rnd) }));
  }

  function qid(t, i) { return t + '-' + i; }

  // Puntuación: cada fallo resta un acierto; las preguntas en blanco no puntúan.
  function score(items, answers) {
    const per = {};
    let A = 0, F = 0, B = 0;
    items.forEach((it, k) => {
      const a = answers[k];
      const r = per[it.t] || (per[it.t] = { n: 0, A: 0, F: 0, B: 0 });
      r.n++;
      if (a === null || a === undefined) { B++; r.B++; }
      else if (a === 0) { A++; r.A++; }
      else { F++; r.F++; }
    });
    const N = items.length;
    const net = A - F;
    const nota = N ? Math.max(0, net) / N * 10 : 0;
    const notaBruta = N ? A / N * 10 : 0;
    for (const r of Object.values(per)) {
      r.net = r.A - r.F;
      r.nota = r.n ? Math.max(0, r.net) / r.n * 10 : 0;
    }
    return { N, A, F, B, net, nota, notaBruta, perTema: per };
  }

  return { makeRng, shuffle, perm5, apportion, sampleTema, buildExam, buildPractice, practicePool, score, qid, EXAM_KINDS };
})();
if (typeof module !== 'undefined' && module.exports) module.exports = SSII;

</script>
<script>

const BANK = {"1":{"n":1,"nombre":"Aspectos básicos de los sistemas inteligentes","secs":{"def":["Concepto de Inteligencia Artificial","Tema 1 §1.1"],"hist":["Historia y evolución de la IA","Tema 1 §1.2 y Tabla 1.1"],"fil":["¿Puede pensar una máquina? Dualismo, materialismo y funcionalismo","Tema 1 §1.3"],"turing":["Test de Turing y chatterbots","Tema 1 §1.3.1–1.3.2"],"china":["Habitación china. IA débil e IA fuerte","Tema 1 §1.3.3"],"etica":["Ética y responsabilidad en la ingeniería de IA","Tema 1 §1.3.4–1.3.5"],"agent":["Agentes inteligentes y su taxonomía","Tema 1 §1.4–1.4.1"],"entor":["Entorno de trabajo y racionalidad","Tema 1 §1.4.2"],"sbc":["Sistemas basados en conocimiento","Tema 1 §1.5"]},"qs":[{"s":"def","c":"mccarthy","q":"¿Qué definición fundacional de la IA, de carácter pragmático, atribuye el Tema 1 a <b>John McCarthy</b>?","o":["Desarrollar máquinas que se comporten de manera inteligente.","Estudiar cómo hacer que los computadores hagan cosas que, por ahora, la gente hace mejor.","Crear programas que ejecuten operaciones comparables a las de la mente humana, como el razonamiento lógico.","Construir una mente artificial con estados cognitivos subjetivos y comprensión genuina.","Calcular, mediante símbolos, la respuesta a cualquier disputa intelectual."],"e":["Es la definición pragmática y conductual con la que el tema abre §1.1.1.","Esa es la definición de Elaine Rich (frontera móvil), no la de McCarthy.","Es la definición del DRAE, que refleja la consolidación académica de la disciplina.","Es la pretensión de la IA fuerte según Searle, no una definición de la disciplina.","Evoca el «Calculemos» de Leibniz, uno de los antecedentes filosóficos."]},{"s":"def","c":"mccarthy","q":"El tema señala una debilidad de la definición pragmática de McCarthy. ¿Cuál?","o":["Juzgar la inteligencia solo por el comportamiento externo observado puede ser engañoso.","Exige que la máquina posea consciencia, algo imposible de verificar.","Deja de considerar inteligente cualquier tarea en cuanto una máquina la resuelve.","Restringe la IA a la manipulación de símbolos, excluyendo las redes neuronales.","Obliga a comparar siempre a la máquina con un juez humano en una conversación."],"e":["Los vehículos de Braitenberg muestran que una conducta aparentemente intencional puede ser puramente mecánica.","La definición de McCarthy no menciona la consciencia; se centra en el comportamiento.","Eso es el «Efecto IA», asociado a la definición de Elaine Rich.","La definición no impone ninguna técnica concreta; es puramente conductual.","Eso caracteriza al Test de Turing, no a la definición de McCarthy."]},{"s":"def","c":"braiten-conf","q":"En los vehículos de Braitenberg descritos en el tema, ¿qué configuración produce el comportamiento de <b>miedo/huida</b>?","o":["Conexiones directas: el sensor izquierdo gobierna el motor izquierdo.","Conexiones cruzadas: cada sensor gobierna el motor del lado opuesto.","Un estado interno que memoriza la última posición de la fuente de luz.","Un único sensor central conectado a ambos motores con la misma ganancia.","Una función de utilidad que penaliza la intensidad lumínica captada."],"e":["El vehículo verde, con conexiones directas, gira y se aleja de la luz.","Las conexiones cruzadas corresponden al vehículo azul (agresión/atracción), que acelera hacia la fuente.","El tema subraya que estos vehículos carecen de estado interno.","El tema describe dos sensores delanteros y dos motores independientes.","No hay deliberación ni utilidad; la conducta la fija el cableado físico."]},{"s":"def","c":"braiten-conf","q":"Un vehículo de Braitenberg con <b>conexiones cruzadas</b> entre sensores y motores, ante una fuente de luz lateral…","o":["acelera y gira hacia la fuente: comportamiento de agresión o atracción.","gira y se aleja de la fuente: comportamiento de miedo o huida.","se detiene hasta que la intensidad lumínica se iguala en ambos sensores.","memoriza la posición de la fuente y planifica una ruta para rodearla.","avanza en línea recta, pues las dos señales cruzadas se anulan entre sí."],"e":["Es el vehículo azul del tema: las conexiones cruzadas lo dirigen hacia la luz.","La huida la producen las conexiones directas (vehículo verde).","El tema no describe ese comportamiento; con conexión cruzada acelera hacia la fuente.","Los vehículos no tienen memoria ni planificación; son puramente reactivos.","Las señales no se anulan: el motor opuesto a la luz recibe más activación y el vehículo gira hacia ella."]},{"s":"def","c":"braiten-lec","q":"¿Qué conclusión de ingeniería extrae el tema de los vehículos de Braitenberg?","o":["Un comportamiento aparentemente complejo no implica un razonamiento inteligente subyacente.","Que la intencionalidad emerge necesariamente de cualquier conexión sensor–motor.","Que el comportamiento reactivo es estocástico y no puede predecirse a partir de la configuración física.","Que los agentes con memoria son innecesarios en entornos con fuentes de luz.","Que el Test de Turing es aplicable a robots físicos sin modificación."],"e":["Son sistemas mecánicos y reactivos, sin estado interno ni deliberación, aunque parezcan tener intención.","El tema afirma lo contrario: el observador atribuye intención, pero no la hay.","La configuración física determina el comportamiento de forma determinista.","El ejemplo no se usa para comparar agentes con memoria, sino para criticar el enfoque conductual.","El ejemplo no trata del Test de Turing."]},{"s":"def","c":"braiten-lec","q":"Según el tema, ¿de qué carecen los vehículos de Braitenberg pese a que un observador pueda atribuirles «emociones»?","o":["De estado interno, de representación del mundo y de deliberación.","De sensores capaces de medir la intensidad lumínica de forma continua.","De motores independientes, por lo que no pueden girar.","De un comportamiento determinista, porque reaccionan de forma aleatoria.","De conexiones entre percepción y acción, que actúan de forma desacoplada."],"e":["Son sistemas puramente mecánicos y reactivos cuya conducta fija el cableado.","Sí tienen sensores delanteros sensibles a la luz.","Tienen motores independientes; su diferencia de velocidad produce los giros.","Su comportamiento es determinista: lo fija su configuración física.","La conexión sensor–motor directa o cruzada es precisamente lo que define cada vehículo."]},{"s":"def","c":"rich-efecto","q":"La definición de Elaine Rich («cosas que, por ahora, la gente hace mejor») encapsula el llamado…","o":["Efecto IA: un problema resuelto por una máquina deja de considerarse inteligencia.","Efecto ELIZA: la tendencia humana a proyectar empatía en las interfaces.","Problema de la alineación: los objetivos deben coincidir con los humanos.","Invierno de la IA: la retirada de financiación tras promesas incumplidas.","Principio del conocimiento: separar el saber del razonar."],"e":["Es el paradigma de la frontera móvil: lo resuelto pasa a ser «simple cálculo algorítmico».","El efecto ELIZA se relaciona con los chatterbots, no con la definición de Rich.","La alineación pertenece al debate ético moderno (§1.3.4).","Los inviernos son periodos históricos de escepticismo, no un efecto ligado a la definición de Rich.","Ese principio fundamenta los SBC (§1.5)."]},{"s":"def","c":"rich-efecto","q":"¿Por qué el tema califica la definición de Elaine Rich como <b>pragmática y evolutiva</b>?","o":["Porque lo que se considera IA se desplaza conforme las máquinas resuelven más tareas.","Porque define la IA por la materia de la que está hecha la mente, sea neurona o silicio.","Porque exige que el sistema evolucione mediante operadores genéticos de cruce y mutación.","Porque coincide literalmente con la definición actual del diccionario de la RAE.","Porque se limita a imitar el comportamiento externo, como los vehículos de Braitenberg."],"e":["La frontera es móvil: «por ahora» indica que el ámbito de la IA cambia con el progreso.","Eso se acerca al funcionalismo, que precisamente niega la importancia de la materia.","«Evolutiva» no se refiere a algoritmos genéticos, sino a la evolución del propio campo.","La definición del DRAE es otra, centrada en operaciones comparables a las de la mente.","Esa limitación se atribuye al enfoque conductual de McCarthy, que Rich intenta superar."]},{"s":"def","c":"drae","q":"La definición del DRAE recogida en el tema caracteriza la IA como una disciplina científica que…","o":["crea programas que ejecutan operaciones comparables a las de la mente humana.","estudia cómo lograr que los computadores hagan lo que hoy la gente hace mejor.","desarrolla máquinas que se comportan de forma inteligente ante un observador.","demuestra que la manipulación de símbolos basta para generar significado.","reduce cualquier problema de inteligencia a una búsqueda en un espacio de estados."],"e":["Es la cita literal del DRAE, reflejo de la consolidación académica de la IA.","Esa es la definición de Elaine Rich.","Esa es la definición pragmática de McCarthy.","Es justo lo que Searle niega con la habitación china.","Es la creencia de la era del optimismo, no la definición del DRAE."]},{"s":"def","c":"drae","q":"Ordene cronológicamente, según la exposición del tema, las tres definiciones de IA comentadas en §1.1:","o":["McCarthy (conductual) → Rich (frontera móvil) → DRAE (académica).","Rich (frontera móvil) → McCarthy (conductual) → DRAE (definición actual).","DRAE (definición académica) → McCarthy (conductual) → Rich (frontera móvil).","McCarthy (enfoque conductual) → DRAE (consolidación académica) → Rich (frontera móvil).","Turing → Searle → McCarthy."],"e":["El tema las presenta como análisis temporal: albores, superación del conductismo y definición actual.","McCarthy propuso la definición fundacional en los albores; Rich llega después para superarla.","La definición del DRAE es la «definición actual» y se presenta al final.","El tema dice que «finalmente» la consolidación se refleja en el DRAE, tras Rich.","Turing y Searle no aportan definiciones de IA en §1.1; aparecen en el debate filosófico de §1.3."]},{"s":"def","c":"sintesis","q":"En la «síntesis de ingeniería» de §1.1.3, el tema sostiene que…","o":["la IA no es una mera copia de la mente, pero exige comprender cómo razonan los humanos.","la IA consiste exclusivamente en replicar de forma literal la estructura neuronal del cerebro.","las máquinas ya superan al ser humano en flexibilidad cognitiva y adaptación general.","el razonamiento humano es irrelevante, pues las máquinas solo procesan datos masivos.","las definiciones de IA de los últimos 70 años son contradictorias y deben descartarse."],"e":["Los sistemas modernos no pueden construirse sin entender el razonamiento humano, aunque la IA no sea una mera copia.","El tema dice expresamente que no debe concluirse que la IA se limita a copiar la mente.","Al contrario: el ser humano conserva una flexibilidad y adaptación que la IA aún persigue.","El tema afirma que es imprescindible comprender cómo razonan los humanos.","El tema dice que todas ellas caracterizan el esfuerzo investigador del periodo."]},{"s":"def","c":"sintesis","q":"Según el tema, ¿en qué aspecto el ser humano <b>sigue superando</b> a la IA contemporánea?","o":["En la flexibilidad cognitiva y la capacidad de adaptación al entorno general.","En la velocidad de cálculo aritmético sobre grandes volúmenes de datos.","En la capacidad de memorizar sin errores documentos desestructurados.","En la resolución de juegos de información perfecta como el ajedrez.","En la ejecución determinista de reglas lógicas codificadas manualmente."],"e":["Es lo que la IA «aún persigue modelar y replicar» según §1.1.3.","En cálculo y procesamiento masivo las máquinas nos han superado con creces.","Watson ya demostró recuperación precisa sobre millones de documentos.","Deep Blue venció al campeón mundial de ajedrez en 1997.","Ejecutar reglas codificadas es justo lo que hacen bien los sistemas expertos."]},{"s":"hist","c":"aristoteles","q":"¿Por qué el tema considera los silogismos de Aristóteles el antepasado de la IA simbólica?","o":["Porque fueron el primer sistema deductivo regido por leyes mecánicas.","Porque Aristóteles construyó una máquina de círculos concéntricos que generaba combinaciones.","Porque propusieron un lenguaje universal y un cálculo lógico para resolver disputas.","Porque modelaban matemáticamente una neurona capaz de calcular funciones lógicas.","Porque introdujeron el análisis de medios y fines para resolver acertijos."],"e":["Codificar el razonamiento como proceso reglado es el origen del enfoque de las «leyes del pensamiento».","La máquina de círculos concéntricos es de Ramón Llull (Ars Magna).","Characteristica Universalis y Calculus Ratiocinator son de Leibniz.","Eso es el modelo de McCulloch y Pitts (1943).","El análisis de medios y fines es del GPS de Newell y Simon."]},{"s":"hist","c":"aristoteles","q":"En la Tabla 1.1 del tema, ¿qué hito se asocia a <b>384 a.C.</b>?","o":["Fundamentación de la lógica formal (silogismos) por Aristóteles.","Propuesta de razonamiento mecánico en el Ars Magna por Ramón Llull.","Propuesta del Calculus Ratiocinator y del sistema binario por Leibniz.","Primer modelo matemático de una neurona artificial.","Propuesta del concepto de máquina pensante."],"e":["Es la primera fila de la cronología.","Llull y el Ars Magna corresponden a 1315.","Leibniz aparece en 1679.","McCulloch y Pitts, 1943.","Alan Turing, 1950."]},{"s":"hist","c":"llull","q":"¿Qué aportó <b>Ramón Llull</b> con su Ars Magna (1315), según el tema?","o":["Una máquina de círculos concéntricos que combinaba conceptos para validar postulados.","La primera calculadora mecánica capaz de realizar operaciones aritméticas complejas.","El primer sistema deductivo basado en silogismos con premisas.","Un programa que simulaba a un psicoterapeuta mediante reglas de palabras clave.","Una prueba experimental para decidir si una máquina puede pensar."],"e":["Al girar los diales se obtenían todas las combinaciones, sustituyendo el debate retórico por razón mecánica.","La calculadora mecánica es de Leibniz.","Los silogismos son de Aristóteles.","Eso es ELIZA, de Weizenbaum (1966).","Esa prueba es el Test de Turing (1950)."]},{"s":"hist","c":"llull","q":"La visión de la lógica de Llull que, según el tema, inspiraría siglos después a los pioneros de la computación es la de…","o":["un proceso puramente combinatorio de conceptos básicos.","un proceso estadístico que aprende patrones a partir de datos masivos.","una red de unidades simples inspiradas en las neuronas del cerebro.","una conversación textual en la que un juez distingue humano y máquina.","una cooperación entre múltiples agentes autónomos que negocian."],"e":["Llull propuso mecanizar el pensamiento combinando conceptos; esa idea inspiró a Leibniz y a la computación.","El aprendizaje estadístico pertenece a la era del Big Data, no a Llull.","Eso es la aportación de McCulloch y Pitts.","Es el planteamiento del Test de Turing.","Es la idea de la IA distribuida, de los años 80."]},{"s":"hist","c":"leibniz","q":"¿Qué premisa fundamental de la IA moderna estableció <b>Leibniz</b>, según el tema?","o":["Que el razonamiento puede entenderse y ejecutarse como un cálculo sobre símbolos.","Que la inteligencia requiere necesariamente un sustrato biológico neuronal.","Que una máquina es inteligente si es indistinguible de un humano en conversación.","Que la sintaxis no basta para generar semántica.","Que el conocimiento de dominio debe separarse del motor de inferencia."],"e":["Con su lenguaje universal, su Calculus Ratiocinator y su calculadora, cerró el puente entre filosofía e ingeniería.","Leibniz no defendió esa idea; su premisa es el cálculo simbólico.","Esa es la hipótesis conductista del Test de Turing.","Es la tesis de Searle con la habitación china.","Ese principio es propio de los SBC de los años 80."]},{"s":"hist","c":"leibniz","q":"En la cronología del tema, ¿qué corresponde a Leibniz y en qué año?","o":["El Calculus Ratiocinator y el sistema binario, 1679.","El Ars Magna y la máquina combinatoria, 1315.","La Characteristica Universalis y la conferencia de Dartmouth, 1956.","El primer modelo matemático de neurona, 1943.","La calculadora mecánica y el Test de Turing, 1950."],"e":["Tabla 1.1: 1679, G. W. Leibniz.","Eso corresponde a Ramón Llull.","Dartmouth es de 1956 y la organizaron McCarthy, Minsky, Rochester y Shannon.","Es de McCulloch y Pitts.","El Test de Turing es de 1950, pero no es de Leibniz."]},{"s":"hist","c":"mcp","q":"¿Qué demostraron <b>McCulloch y Pitts</b> en 1943?","o":["Que redes de neuronas simples podían calcular cualquier función lógica.","Que las redes neuronales profundas pueden aprender de datos no estructurados.","Que la manipulación de símbolos no produce comprensión.","Que los métodos de micromundos no escalan al mundo real.","Que un psiquiatra no distingue un programa de un paciente real."],"e":["Propusieron el primer modelo matemático de red neuronal (§1.2.2).","El aprendizaje profundo llega en la década de 2010, con GPU y Big Data.","Eso lo argumenta Searle en 1980.","Es la explosión combinatoria de finales de los 60.","Eso se refiere a PARRY (1972)."]},{"s":"hist","c":"mcp","q":"Según el tema, ¿qué dos aportaciones prepararon el terreno para la formalización del campo antes de 1956?","o":["El modelo neuronal de McCulloch y Pitts y el artículo de Turing de 1950.","El GPS de Newell y Simon y el programa ELIZA de Weizenbaum.","Los informes ALPAC y Lighthill sobre la utilidad de la IA.","Los sistemas expertos DENDRAL y MYCIN, desarrollados para dominios muy específicos.","El Ars Magna de Llull y la iniciativa RoboCup para la IA distribuida."],"e":["§1.2.2: ambas aportaciones prepararon el terreno para Dartmouth.","Ambos son posteriores a Dartmouth (era del optimismo).","Esos informes provocaron el primer invierno en los años 70.","Son sistemas expertos de la etapa 1980–2010 según el tema.","Pertenecen a épocas muy distintas (1315 y 1993)."]},{"s":"hist","c":"dartmouth","q":"Sobre la <b>Conferencia de Dartmouth</b> (verano de 1956), ¿qué afirmación es correcta según el tema?","o":["Se acuñó el término «Inteligencia Artificial» con enorme optimismo.","La organizó Alan Turing para presentar su Juego de la Imitación.","En ella se presentó XCON, el primer sistema experto comercial.","Concluyó, tras varios años de financiación, que la traducción automática había fracasado.","Marcó el inicio del primer invierno de la IA por la retirada de la financiación."],"e":["Fue el nacimiento oficial de la disciplina, con un optimismo desbordado.","La organizaron McCarthy, Minsky, Rochester y Shannon; Turing había publicado en 1950.","XCON es de la etapa de los sistemas expertos (Tabla 1.1: 1980).","Eso lo concluyó el informe ALPAC, años después.","Dartmouth inició la etapa de euforia; el invierno llegó a mediados de los 70."]},{"s":"hist","c":"dartmouth","q":"¿Quiénes organizaron la Conferencia de Dartmouth según el tema?","o":["McCarthy, Minsky, Rochester y Shannon.","Newell, Simon, Weizenbaum y Colby.","Turing, McCulloch, Pitts y Leibniz.","Searle, Asimov, Rich y McCarthy.","Russell, Norvig, Minsky y Shannon."],"e":["Los cuatro organizadores que cita §1.2.2.","Son autores de programas posteriores (GPS, ELIZA, PARRY).","Son precursores; Leibniz vivió en el siglo XVII.","Searle, Asimov y Rich no participaron en Dartmouth.","Russell y Norvig son autores contemporáneos del manual de IA citado."]},{"s":"hist","c":"gps","q":"El <b>General Problem Solver</b> (GPS) de Newell y Simon pretendía imitar los protocolos humanos de resolución mediante…","o":["el análisis de medios y fines.","el aprendizaje profundo sobre grandes bases de datos.","la cooperación entre múltiples agentes autónomos.","reglas de transformación de palabras clave.","la separación entre base de conocimiento y motor de inferencia."],"e":["Así lo describe §1.2.3.","El aprendizaje profundo es de la década de 2010.","Eso es la IA distribuida.","Es el mecanismo de ELIZA.","Es la arquitectura de los SBC de los 80."]},{"s":"hist","c":"gps","q":"¿En qué creencia se sustentaba el optimismo de la etapa 1957–1980, según el tema?","o":["En que todo problema de inteligencia se reducía a buscar en un espacio de estados.","En que el aprendizaje a partir de datos masivos haría innecesaria la lógica.","En que los sistemas expertos podían generar ahorros millonarios en la industria.","En que la inteligencia emerge de la cooperación entre agentes autónomos.","En que una máquina solo puede hacer lo que se le ordena."],"e":["§1.2.3 lo dice literalmente; la explosión combinatoria desmontó esa creencia.","Es la idea de la era del Big Data, no de la del optimismo.","Eso lo demostró XCON en la etapa de los 80.","Es la idea de la IAD a partir de 1985.","Es la objeción de Lady Lovelace, contraria al optimismo."]},{"s":"hist","c":"explosion","q":"¿Con qué problema chocaron los investigadores a finales de los años 60, según el tema?","o":["Con la explosión combinatoria de los «micromundos» al escalar al mundo real.","Con la falta de unidades GPU para el cálculo matricial en paralelo.","Con la imposibilidad práctica de separar el conocimiento del motor de inferencia.","Con la objeción de que las máquinas solo pueden simular sin comprender.","Con la regulación europea de la IA (AI Act), que limitó la investigación académica."],"e":["Funcionaban en problemas de juguete con pocas variables, pero no en la complejidad real.","Las GPU forman parte del auge de la década de 2010.","Esa separación se logró con los SBC; no fue el problema de los 60.","Esa objeción filosófica la formula Searle en 1980.","La regulación europea es contemporánea."]},{"s":"hist","c":"explosion","q":"¿Qué eran los «micromundos» mencionados en §1.2.3?","o":["Problemas de juguete con pocas variables, donde la búsqueda lógica sí funcionaba.","Entornos virtuales donde habitan los agentes software o bots.","Laboratorios de robótica como la RoboCup para probar estrategias colaborativas.","Subconjuntos de la base de conocimiento dedicados a un dominio muy específico del experto.","Conjuntos de reglas de transformación usadas por los chatterbots."],"e":["Su éxito no se trasladó a problemas reales por la explosión combinatoria.","Los agentes software habitan entornos virtuales, pero no se llaman micromundos en el tema.","La RoboCup es de 1993 y no es un micromundo en el sentido del tema.","Eso describe la especialización de los sistemas expertos.","Las reglas de palabras clave son de ELIZA."]},{"s":"hist","c":"informes","q":"¿Qué informes cita el tema como punto de inflexión que condujo al primer «invierno de la IA»?","o":["Los informes ALPAC (EE. UU.) y Lighthill (1973, Reino Unido).","Los informes de DEC sobre los ahorros de XCON en la configuración de VAX.","El informe de Searle sobre la habitación china y el de Turing sobre máquinas pensantes.","El informe de IBM sobre Watson y el de OpenAI sobre ChatGPT.","El informe de Russell y Norvig sobre entornos de trabajo."],"e":["Ambos cuestionaron la IA y, junto con las limitaciones de cómputo, provocaron el invierno.","XCON demostró el éxito industrial de los sistemas expertos, no un fracaso.","Son artículos filosóficos, no los informes de financiación citados.","Son hitos recientes.","Russell y Norvig describen dimensiones del entorno, no un informe histórico."]},{"s":"hist","c":"informes","q":"¿Qué lección dejó el primer invierno de la IA (mediados de los 70), según el tema?","o":["Que hacía falta algo más que búsqueda lógica: conocimiento y capacidad de cómputo.","Que la inteligencia debe emerger de la cooperación de múltiples agentes autónomos y distribuidos.","Que las redes neuronales nunca podrían escalar a problemas reales de gran tamaño y complejidad.","Que la traducción automática era el único problema irresoluble.","Que bastaba con aumentar la financiación gubernamental."],"e":["§1.2.3 cierra con esta lección, que da paso a los sistemas expertos.","Esa idea surge con la IAD hacia 1985, no como lección del primer invierno.","El tema no extrae esa lección; las redes se rescatan en la década de 2010.","ALPAC criticó la traducción automática, pero la lección es más general.","La financiación se retiró; la lección fue la necesidad de conocimiento."]},{"s":"hist","c":"se80","q":"Asocie correctamente cada sistema experto con su dominio según el tema:","o":["DENDRAL: química molecular; MYCIN: infecciones en sangre; XCON: configurar VAX.","DENDRAL: configuración de VAX; MYCIN: estructuras moleculares; XCON: diagnóstico médico.","DENDRAL: diagnóstico médico; MYCIN: configuración de VAX; XCON: estructuras moleculares.","DENDRAL: tráfico aéreo; MYCIN: logística de almacenes; XCON: traducción automática.","DENDRAL: ajedrez; MYCIN: concursos televisivos; XCON: lenguaje natural."],"e":["Son los tres ejemplos de §1.2.4.","Están permutados: DENDRAL es química y XCON configura pedidos VAX.","MYCIN es médico y XCON es de DEC para VAX.","Tráfico aéreo y almacenes son ejemplos de IAD, no de sistemas expertos.","Ajedrez y Jeopardy! corresponden a Deep Blue y Watson."]},{"s":"hist","c":"se80","q":"¿Qué destacó a <b>MYCIN</b> según el tema?","o":["Su capacidad para razonar con incertidumbre y explicar sus conclusiones.","Ser el primer sistema que generó ahorros millonarios en la industria.","Automatizar el análisis de estructuras moleculares.","Derrotar a los campeones del concurso Jeopardy!.","Simular a un paciente con esquizofrenia paranoide."],"e":["§1.2.4: destacó en el diagnóstico de infecciones bacterianas por esas dos capacidades.","Eso se atribuye a XCON.","Eso es DENDRAL.","Eso lo hizo Watson en 2011.","Eso es PARRY."]},{"s":"hist","c":"iad","q":"¿Qué caracteriza a la <b>Inteligencia Artificial Distribuida</b> surgida a partir de 1985?","o":["La inteligencia emerge de la cooperación entre múltiples agentes.","La inteligencia reside en una base de conocimiento centralizada de reglas.","El aprendizaje de patrones a partir de datos no estructurados con GPU.","La generación de contenido original mediante modelos Transformer.","El uso exclusivo de agentes hardware con sensores físicos."],"e":["Surge al detectar las limitaciones de los sistemas centralizados (§1.2.4).","Es el modelo de los sistemas expertos que la IAD pretende superar.","Es el aprendizaje profundo de la década de 2010.","Es la IA generativa.","Los agentes de la IAD pueden ser software; el tema cita tráfico aéreo y almacenes."]},{"s":"hist","c":"iad","q":"¿Qué papel asigna el tema a la <b>RoboCup</b> (1993)?","o":["Un laboratorio para probar estrategias colaborativas en entornos dinámicos.","Primer sistema experto comercial para la configuración de robots.","Competición que demostró que una máquina podía superar el Test de Turing.","Proyecto que puso fin al segundo invierno de la IA.","La primera aplicación de las redes Transformer al control de equipos de robots."],"e":["Es el ejemplo de iniciativa vinculada a la IA distribuida.","El primer éxito comercial citado es XCON.","La RoboCup no está relacionada con el Test de Turing.","El tema no habla de un segundo invierno.","Los Transformer son de 2017."]},{"s":"hist","c":"bigdata","q":"¿Qué tres factores convergieron a principios de la década de 2010, según el tema?","o":["Big Data, almacenamiento barato y GPU para cálculo matricial en paralelo.","Sistemas expertos, motores de inferencia y bases de conocimiento declarativas.","Informes críticos, retirada de la financiación y falta de grandes bases de datos.","Agentes autónomos, negociación en tiempo real y RoboCup.","Silogismos, cálculo simbólico y calculadoras mecánicas."],"e":["Su sinergia permitió escalar las redes neuronales y dio paso al aprendizaje profundo.","Son componentes de los SBC de los años 80.","Son las causas del primer invierno.","Pertenecen a la IA distribuida.","Son antecedentes filosóficos y mecánicos."]},{"s":"hist","c":"bigdata","q":"Frente a los SBC, ¿qué capacidad demostraron las arquitecturas de aprendizaje profundo?","o":["Aprender y extraer patrones de forma autónoma a partir de datos no estructurados.","Separar explícitamente la base de conocimiento del motor de inferencia.","Explicar cada decisión mediante una cadena de deducciones totalmente trazable.","Razonar con incertidumbre usando reglas escritas por expertos.","Resolver cualquier problema reduciéndolo a búsqueda lógica."],"e":["En los SBC el ingeniero debía codificar manualmente las reglas lógicas.","Esa separación es la aportación de los SBC.","La transparencia es una ventaja de los SBC; el tema habla de las «cajas negras» del aprendizaje profundo.","Es la virtud que el tema atribuye a MYCIN.","Es la creencia de la era del optimismo."]},{"s":"hist","c":"watson","q":"¿Por qué fue fundamental para el procesamiento del lenguaje natural la victoria de <b>Watson</b> (IBM, 2011)?","o":["Interpretó preguntas complejas y recuperó respuestas precisas en tiempo real.","Demostró por primera vez que una máquina podía derrotar al campeón mundial de ajedrez.","Superó oficialmente el Test de Turing ante un jurado formado por psiquiatras expertos.","Introdujo la arquitectura Transformer en los modelos de lenguaje.","Fue el primer programa que simuló a un psicoterapeuta."],"e":["Así lo explica §1.2.5.","Eso lo hizo Deep Blue en 1997.","Los psiquiatras evaluaron a PARRY, no a Watson.","Los Transformer se presentaron en 2017.","Ese fue ELIZA."]},{"s":"hist","c":"watson","q":"Según la Tabla 1.1, ¿qué hito y protagonista corresponden a <b>1997</b>?","o":["Deep Blue vence al campeón mundial de ajedrez (IBM).","Watson gana Jeopardy! (IBM).","Fundación de la RoboCup (comunidad científica).","Consolidación comercial de los sistemas expertos (DEC/CMU).","Presentación de los modelos Transformer para lenguaje natural."],"e":["1997: Deep Blue.","Watson corresponde a 2011.","RoboCup es de 1993.","Corresponde a 1980.","El tema los fecha en 2017."]},{"s":"hist","c":"generativa","q":"¿Qué distingue a la <b>IA generativa</b> descrita en el tema de las etapas anteriores?","o":["Crea contenido original, más allá de tareas analíticas o de clasificación.","Recupera la separación clásica entre base de conocimiento y motor de inferencia.","Sustituye las redes neuronales por reglas lógicas escritas por expertos.","Se limita a jugar a juegos de información perfecta.","Renuncia a los datos masivos para trabajar en micromundos."],"e":["Impulsada por los Transformer (2017) y los LLM, popularizada con ChatGPT (finales de 2022).","Eso es propio de los SBC.","Es al revés: se basa en redes neuronales a gran escala.","No; permite razonamiento conversacional, síntesis y generación de textos.","Los micromundos son de los años 60."]},{"s":"hist","c":"generativa","q":"¿Qué arquitectura y qué despliegue cita el tema como impulsores de la revolución generativa?","o":["Los Transformer (2017) y el lanzamiento público de ChatGPT (2022).","El perceptrón de McCulloch y Pitts (1943) y ELIZA (1966).","Los sistemas expertos comerciales (1980) y la iniciativa RoboCup (1993).","La victoria de Deep Blue (1997) y la conferencia de Dartmouth (1956).","El GPS de Newell y Simon y el informe Lighthill."],"e":["§1.2.5: democratizaron el acceso y la integraron en la vida cotidiana.","Son hitos muy anteriores.","Pertenecen a la etapa de SBC e IAD.","No están relacionados con la IA generativa.","Pertenecen a la era del optimismo y al primer invierno."]},{"s":"fil","c":"dual-mat","q":"¿Qué sostiene el <b>materialismo</b> frente al dualismo en el debate sobre si una máquina puede pensar?","o":["Que los estados mentales son estados físicos del cerebro.","Que la mente posee propiedades no físicas que escapan a la explicación mecánica.","Que la sintaxis basta para producir semántica en cualquier sistema.","Que solo los sistemas biológicos pueden tener estados mentales.","Que la inteligencia debe juzgarse solo por el comportamiento externo."],"e":["El dualismo, en cambio, atribuye a la mente propiedades no físicas.","Esa es la tesis dualista.","Es la premisa de la IA fuerte que Searle ataca, no la definición de materialismo.","El materialismo no exige sustrato biológico; de él surge el funcionalismo.","Es la hipótesis conductista del Test de Turing."]},{"s":"fil","c":"dual-mat","q":"El tema plantea la pregunta «¿puede pensar una máquina?» como una distinción ontológica entre…","o":["las concepciones dualista y materialista de la mente.","la IA simbólica y el aprendizaje estadístico.","los agentes reactivos y los agentes con memoria.","la roboética y la ética de la máquina.","los entornos deterministas y los estocásticos."],"e":["§1.3: la cuestión hunde sus raíces en esa distinción.","Es una distinción técnica e histórica, no ontológica.","Es una taxonomía de agentes.","Son las dos vertientes de la ética de la IA.","Son dimensiones del entorno de trabajo."]},{"s":"fil","c":"funcional","q":"¿Qué postula el <b>funcionalismo</b>, corriente clave para la IA según el tema?","o":["Que la mente se define por las funciones que realiza, no por su materia.","Que la mente solo puede existir en un sustrato biológico de neuronas.","Que la mente posee propiedades no físicas que escapan a cualquier explicación mecánica.","Que la inteligencia se reduce a la manipulación de símbolos sin significado.","Que la moral de un robot puede codificarse en tres leyes."],"e":["Neuronas o silicio son indiferentes; importan las funciones.","El funcionalismo afirma justo lo contrario.","Esa es la tesis dualista.","Es la caricatura que Searle atribuye a la IA fuerte.","Son las leyes de Asimov (ética de la máquina)."]},{"s":"fil","c":"funcional","q":"¿De qué corriente surge el funcionalismo según el tema?","o":["Del materialismo.","Del dualismo.","Del conductismo de los vehículos de Braitenberg.","De la roboética.","De la ingeniería del conocimiento."],"e":["§1.3: «De esta última [el materialismo] surge el funcionalismo».","El dualismo atribuye propiedades no físicas a la mente; el funcionalismo no deriva de él.","Braitenberg ilustra los límites del enfoque conductual, no el origen del funcionalismo.","La roboética es una rama de la ética de la IA.","Es la disciplina que construye SBC."]},{"s":"turing","c":"test","q":"¿En qué hipótesis se basa el <b>Test de Turing</b> según el tema?","o":["Conductista: si su conducta es indistinguible de la de un ser inteligente, lo es.","Funcionalista: si la máquina reproduce las funciones neuronales, posee consciencia.","Dualista: la mente tiene propiedades no físicas que la máquina no puede tener.","Semántica: la máquina debe demostrar que comprende el significado de los símbolos.","Utilitarista: la máquina debe maximizar una función de utilidad durante la conversación."],"e":["Turing sustituye «¿pueden pensar las máquinas?» por un desafío experimental.","El test no examina funciones internas, solo el comportamiento conversacional.","El test es compatible con atribuir inteligencia a una máquina.","Precisamente Searle critica que el test no mide comprensión.","La utilidad pertenece a la taxonomía de agentes."]},{"s":"turing","c":"test","q":"En el escenario del Test de Turing descrito en el tema, la máquina supera la prueba si…","o":["el juez no logra distinguir con certeza cuál es la máquina tras sus preguntas.","el juez reconoce a la máquina en menos del 48 % de las conversaciones mantenidas.","la máquina demuestra ante el juez que entiende el significado de lo que responde.","la máquina resuelve más acertijos lógicos que el humano oculto.","la máquina responde a preguntas con mayor rapidez que el humano."],"e":["El juez conversa por texto con un interlocutor oculto.","El 48 % es el resultado de PARRY con psiquiatras, no el criterio del test.","El test es conductista: no verifica comprensión.","No es una competición de resolución de problemas.","La rapidez no es el criterio."]},{"s":"turing","c":"lovelace","q":"¿Qué argumentaba la «Objeción de Lady Lovelace», que Turing anticipó y rebatió?","o":["Que las máquinas solo hacen lo que se les ordena, sin originalidad.","Que la manipulación de símbolos no genera significado.","Que los métodos de búsqueda no escalan por explosión combinatoria.","Que un robot no debe dañar a un ser humano.","Que los psiquiatras no distinguen a un programa de un paciente."],"e":["Es la objeción clásica citada en §1.3.1.","Es el argumento de Searle (1980).","Es un problema técnico histórico, no la objeción de Lovelace.","Es la primera ley de Asimov.","Es el resultado de la validación de PARRY."]},{"s":"turing","c":"lovelace","q":"Según el tema, además de diseñar el test, Turing en su artículo de 1950…","o":["anticipó y rebatió objeciones clásicas, como la de Lady Lovelace.","construyó el primer chatterbot de la historia para someterlo a la prueba.","propuso las tres leyes de la robótica.","acuñó el término «Inteligencia Artificial».","demostró que la sintaxis no basta para la semántica."],"e":["§1.3.1 lo señala explícitamente.","El primer chatterbot citado es ELIZA (1966).","Son de Isaac Asimov.","Se acuñó en Dartmouth (1956).","Es la tesis de Searle."]},{"s":"turing","c":"eliza","q":"¿Qué es el «efecto ELIZA» según el tema?","o":["La tendencia humana a proyectar inteligencia y empatía en interfaces tecnológicas.","El fenómeno por el que lo resuelto por una máquina deja de ser IA.","La capacidad de un programa para comprender el contexto de una conversación.","La reducción de nodos lograda al separar conocimiento e inferencia.","El aumento de presión selectiva al crecer el tamaño de un torneo."],"e":["ELIZA engañó a muchos usuarios pese a su simplicidad técnica.","Eso es el Efecto IA, ligado a la definición de Rich.","ELIZA no entendía el contexto; solo rebotaba frases.","No guarda relación con los SBC.","Es un concepto de algoritmos genéticos (Tema 4)."]},{"s":"turing","c":"eliza","q":"¿Cómo funcionaba <b>ELIZA</b> (Weizenbaum, 1966) según el tema?","o":["Simulaba a un psicoterapeuta con reglas de palabras clave.","Modelaba a un paciente con esquizofrenia paranoide.","Razonaba con incertidumbre sobre infecciones bacterianas.","Usaba un modelo Transformer entrenado con millones de documentos.","Aplicaba análisis de medios y fines para resolver teoremas."],"e":["No entendía el contexto; rebotaba las frases del usuario.","Eso es PARRY (Colby, 1972).","Eso es MYCIN.","Los Transformer son de 2017.","Eso es el GPS."]},{"s":"turing","c":"parry","q":"¿Qué resultado obtuvo <b>PARRY</b> (Colby, 1972) en su validación formal?","o":["Los psiquiatras lo identificaron solo en un 48 % de los casos.","Superó a los campeones humanos del concurso televisivo Jeopardy!.","Fue identificado como máquina por los psiquiatras en el 100 % de los casos.","Se demostró que comprendía el significado de sus respuestas.","Su éxito provocó el primer invierno de la IA."],"e":["§1.3.2: a diferencia de ELIZA, PARRY se validó formalmente.","Eso es Watson.","El resultado fue estadísticamente equivalente al azar.","El tema dice que el debate sobre la comprensión seguía abierto.","El invierno lo provocaron los informes críticos y las limitaciones de cómputo."]},{"s":"turing","c":"parry","q":"¿Qué demostraron ELIZA y PARRY según el tema?","o":["Que basta la manipulación simbólica para simular una conversación convincente.","Que la manipulación simbólica genera comprensión genuina.","Que el Test de Turing no puede aplicarse a programas que solo conversan por texto.","Que el aprendizaje profundo era imprescindible para conversar.","Que las tres leyes de la robótica bastan para un comportamiento seguro."],"e":["Es la conclusión de §1.3.2.","El tema no lo afirma; precisamente da pie a la crítica de Searle.","Ambos se diseñaron como chatterbots textuales.","Ninguno usaba aprendizaje profundo.","No tiene relación con la ética de la máquina."]},{"s":"china","c":"debil","q":"Según la distinción de Searle recogida en el tema, la <b>IA débil</b>…","o":["sostiene que las máquinas pueden actuar como si fueran inteligentes.","afirma que un computador bien programado es, literalmente, una mente con estados cognitivos.","sostiene que la sintaxis basta para generar semántica.","exige que la máquina experimente autoconsciencia.","describe a los agentes reactivos que ignoran todo su historial de percepciones."],"e":["El computador es una herramienta para modelar y simular el pensamiento.","Esa es la IA fuerte.","Es la premisa de la IA fuerte que Searle invalida.","La IA débil no asume en ningún caso autoconsciencia.","Es un tipo de agente, no una postura filosófica."]},{"s":"china","c":"debil","q":"Un investigador afirma: «mi sistema simula el razonamiento clínico para ayudar al médico, pero no pretendo que entienda nada». ¿Qué postura adopta?","o":["IA débil.","IA fuerte.","Dualismo.","Efecto ELIZA.","Ética de la máquina."],"e":["Usa la máquina como herramienta de simulación sin atribuirle comprensión.","La IA fuerte sostendría que el sistema es literalmente una mente que comprende.","El dualismo es una tesis ontológica sobre la mente, no sobre el uso de la máquina.","El efecto ELIZA es una tendencia de los usuarios, no una postura del investigador.","Esa rama estudia cómo dotar a los agentes de principios morales."]},{"s":"china","c":"fuerte","q":"¿Qué pretensión define a la <b>IA fuerte</b> según el tema?","o":["Que un computador bien programado es literalmente una mente que comprende.","Que el computador es solo una herramienta para resolver problemas.","Que la máquina debe superar a los humanos en cálculo y memoria.","Que los sistemas deben ser transparentes y explicables.","Que la inteligencia emerge de muchos agentes cooperando."],"e":["Es la pretensión ontológica que Searle intenta invalidar.","Es la tesis de la IA débil.","La IA fuerte no se define por rendimiento.","Es un pilar de la responsabilidad ética (XAI).","Es la idea de la IA distribuida."]},{"s":"china","c":"fuerte","q":"¿Cuál de las siguientes afirmaciones es coherente con la tesis de la IA fuerte?","o":["Un programa adecuado tendría intencionalidad genuina.","La máquina solo actúa como si fuera inteligente.","La persona de la habitación no entiende chino, luego el sistema tampoco.","La moralidad puede reducirse a tres reglas lógicas simples.","La inteligencia es lo que, por ahora, la gente hace mejor."],"e":["La IA fuerte atribuye a la máquina consciencia, comprensión e intencionalidad.","Eso es la IA débil.","Es el argumento de Searle contra la IA fuerte.","No guarda relación; además el tema dice que no puede reducirse.","Es la definición de Rich."]},{"s":"china","c":"china","q":"¿Qué pretende demostrar Searle con el experimento de la <b>habitación china</b>?","o":["Que la sintaxis no basta para producir semántica.","Que el Test de Turing es imposible de superar por un programa.","Que la manipulación de símbolos equivale al pensamiento real.","Que un libro de reglas suficientemente grande produce comprensión del chino.","Que la IA débil es incoherente."],"e":["Invalida así la premisa fundamental de la IA fuerte.","La habitación sí produce respuestas perfectas; el problema es la falta de comprensión.","Es exactamente lo que Searle niega.","La persona sigue sin entender una palabra pese a aplicar las reglas.","El argumento se dirige contra la IA fuerte."]},{"s":"china","c":"china","q":"En la habitación china, ¿qué papel desempeña el <b>libro de reglas</b>?","o":["El del programa, aplicado mecánicamente sin comprender.","El de la base de datos de entrenamiento de una red neuronal.","El del juez que decide si el interlocutor es humano.","El de la semántica que da significado a los caracteres.","El de la función de utilidad que guía las respuestas."],"e":["Searle equipara el libro de reglas al programa de un computador.","El experimento es de 1980 y se refiere a programas de manipulación simbólica.","Los observadores externos son los que creen que la habitación entiende chino.","Las reglas son puramente sintácticas; esa es la tesis del argumento.","No hay ninguna función de utilidad en el experimento."]},{"s":"etica","c":"ramas","q":"¿Qué estudia la <b>roboética</b> frente a la ética de la máquina?","o":["La conducta moral de quienes diseñan, construyen y usan la IA.","Cómo dotar a los propios agentes artificiales de principios morales.","La formalización de las tres leyes de la robótica en lógica de predicados.","El rendimiento de los robots en entornos parcialmente observables.","La regulación del tráfico aéreo mediante agentes negociadores."],"e":["La ética de la máquina, en cambio, estudia cómo dotar a los agentes de principios morales.","Eso es la ética de la máquina.","Las leyes de Asimov se citan como precursor literario de la ética de la máquina.","Es un problema técnico de agentes, no de ética.","Es un ejemplo de IA distribuida."]},{"s":"etica","c":"ramas","q":"Investigar cómo un coche autónomo debería incorporar principios morales en sus decisiones pertenece a…","o":["la ética de la máquina.","la roboética.","la ingeniería del conocimiento.","el funcionalismo.","la IA débil."],"e":["Se trata de dotar al propio agente artificial de principios morales.","La roboética se centra en la conducta moral de los humanos que diseñan y usan la IA.","Es la disciplina que construye y mantiene los SBC.","Es una corriente de filosofía de la mente.","Es una postura sobre si la máquina comprende, no una rama de la ética."]},{"s":"etica","c":"asimov","q":"Las Tres Leyes de Asimov, tal como las recoge el tema, priorizan…","o":["la integridad humana y la obediencia sobre la autopreservación del robot.","la autopreservación del robot sobre la obediencia a los humanos.","la obediencia sobre la integridad humana.","la maximización de la utilidad esperada por el robot a largo plazo y en cada acción.","la explicabilidad de las decisiones del robot."],"e":["La tercera ley (autoprotección) queda subordinada a las dos primeras.","La autoprotección es la última en prioridad.","La segunda ley exceptúa las órdenes que entren en conflicto con la primera.","Es un criterio de agentes basados en utilidad.","La explicabilidad es un pilar de la responsabilidad del ingeniero, no una ley de Asimov."]},{"s":"etica","c":"asimov","q":"Un robot recibe la orden de su dueño de empujar a una persona. Según las leyes de Asimov del tema, debe…","o":["desobedecer: la segunda ley exceptúa las órdenes contrarias a la primera.","obedecer, porque la segunda ley obliga a cumplir siempre las órdenes de los humanos.","obedecer solo si así protege su propia existencia.","calcular qué opción maximiza su función de utilidad.","apagarse, porque la tercera ley le impide actuar en conflicto."],"e":["No dañar a un ser humano prevalece sobre obedecer.","La obediencia está subordinada a la primera ley.","La autoprotección es la ley de menor prioridad.","Las leyes establecen una jerarquía, no una optimización de utilidad.","La tercera ley trata de la autoprotección, no de apagarse."]},{"s":"etica","c":"alineacion","q":"¿Qué es el <b>Problema de la Alineación</b> según el tema?","o":["Que los objetivos de sistemas autónomos coincidan con los valores humanos.","Alinear la base de conocimiento con el motor de inferencia dentro de un SBC.","Ordenar los sucesores en alfa-beta para maximizar la poda.","Ajustar los sensores de un robot para que perciban por completo el estado del entorno.","Hacer coincidir la sintaxis con la semántica."],"e":["Busca evitar consecuencias imprevistas de una optimización descontrolada o literal.","No es un problema de arquitectura de SBC.","Es un concepto del Tema 3.","Es una cuestión de observabilidad.","Es el debate de la habitación china."]},{"s":"etica","c":"alineacion","q":"¿Por qué, según el tema, el debate ético moderno evolucionó desde las leyes de Asimov hacia el Problema de la Alineación?","o":["Porque la moralidad no puede reducirse a reglas lógicas simples.","Porque las leyes de Asimov se demostraron matemáticamente contradictorias.","Porque los robots actuales no tienen actuadores físicos.","Porque la regulación europea prohibió usar las leyes de Asimov.","Porque la roboética sustituyó por completo a la ética de la máquina."],"e":["§1.3.4: las leyes sirvieron de marco teórico, pero son insuficientes.","El tema no menciona tal demostración.","Muchos sistemas son ciberfísicos; no es el motivo.","El tema no dice tal cosa.","Las dos vertientes siguen siendo complementarias."]},{"s":"etica","c":"xai","q":"Ante la pregunta «¿por qué se denegó esta hipoteca?», el pilar de responsabilidad que exige una justificación comprensible y trazable es…","o":["la transparencia y explicabilidad (XAI).","la equidad y mitigación de sesgos.","la seguridad, robustez y fiabilidad.","la ética desde el diseño.","la mantenibilidad declarativa."],"e":["Garantiza el derecho a la explicación frente al problema de las cajas negras.","Se ocupa de no discriminar, no de explicar la decisión.","Se ocupa de fallos y ataques adversarios, especialmente en sistemas ciberfísicos.","Es el principio general que engloba los tres pilares, no el pilar específico.","Es una ventaja de los SBC."]},{"s":"etica","c":"xai","q":"¿Qué problema concreto motiva la necesidad de XAI según el tema?","o":["Las «cajas negras» del aprendizaje profundo.","La explosión combinatoria de los métodos de búsqueda.","El sesgo de los datos de entrenamiento.","Los ataques adversarios en conducción autónoma.","La falta de financiación gubernamental."],"e":["El ingeniero debe desarrollar métodos para auditar sus decisiones.","Es un problema de los años 60.","Motiva el pilar de equidad.","Motivan el pilar de seguridad y robustez.","Fue una causa del primer invierno."]},{"s":"etica","c":"sesgos","q":"Según el tema, si los datos de entrenamiento de un sistema de IA son sesgados, el algoritmo…","o":["los replicará y, además, los amplificará a gran escala.","los corregirá automáticamente al promediar muchos ejemplos.","solo replicará los sesgos si se entrena con aprendizaje por refuerzo.","dejará de converger y no producirá ningún resultado.","será más explicable, porque los sesgos son fáciles de auditar."],"e":["Por eso se exige supervisar el ciclo de vida del dato y aplicar métricas de equidad.","El tema afirma que los sistemas no son neutrales y amplifican el sesgo.","El tema no restringe el problema a un tipo de aprendizaje.","El problema es que produce resultados sesgados.","El sesgo no aumenta la explicabilidad."]},{"s":"etica","c":"sesgos","q":"¿Qué exige la ingeniería ética para el pilar de <b>equidad</b>?","o":["Supervisar el ciclo de vida del dato y aplicar métricas de equidad.","Diseñar sistemas robustos frente a ataques adversarios.","Proporcionar una justificación comprensible y trazable de cada decisión tomada.","Separar la base de conocimiento del motor de inferencia.","Priorizar la obediencia del robot sobre su autoprotección."],"e":["Así se evita la discriminación por género, raza o condición socioeconómica.","Es el pilar de seguridad y robustez.","Es el pilar de transparencia (XAI).","Es la arquitectura de los SBC.","Es la jerarquía de las leyes de Asimov."]},{"s":"etica","c":"seguridad","q":"¿Por qué el pilar de <b>seguridad, robustez y fiabilidad</b> es especialmente crítico en sistemas ciberfísicos?","o":["Porque un error de percepción puede dañar físicamente a personas.","Porque estos sistemas no pueden explicar sus decisiones.","Porque se entrenan siempre con datos sesgados.","Porque operan en entornos totalmente observables y deterministas.","Porque su base de conocimiento es declarativa."],"e":["Ejemplos del tema: conducción autónoma y robótica quirúrgica.","La explicabilidad es otro pilar.","El sesgo corresponde al pilar de equidad.","El tema dice que operan en entornos dinámicos e inciertos.","No tiene relación con la seguridad física."]},{"s":"etica","c":"seguridad","q":"A diferencia del software convencional, los sistemas de IA, según el tema, operan…","o":["en entornos dinámicos e inciertos.","siempre en entornos estáticos y deterministas.","sin datos de entrenamiento, solo con reglas escritas por expertos.","exclusivamente en entornos virtuales sin impacto físico.","con complejidad espacial constante O(1)."],"e":["Es la motivación del pilar de seguridad.","El tema dice lo contrario.","Muchos sistemas modernos aprenden de datos.","El tema destaca precisamente los sistemas ciberfísicos.","Es una propiedad de la búsqueda local (Tema 4)."]},{"s":"etica","c":"bydesign","q":"¿Qué significa <b>Ética desde el Diseño</b> (Ethics by Design) en el tema?","o":["Que la ética es un requisito funcional desde la arquitectura inicial.","Que la ética se incorpora como un módulo de auditoría tras el despliegue.","Que el sistema debe obedecer las tres leyes de Asimov.","Que el diseñador es responsable solo si el sistema causa daños físicos.","Que el motor de inferencia debe ser independiente del dominio."],"e":["No son un añadido final.","Es justo lo que el principio rechaza: no es un añadido final.","El tema dice que la moralidad no se reduce a reglas simples.","La responsabilidad abarca explicabilidad, equidad y seguridad.","Es la modularidad de los SBC."]},{"s":"etica","c":"bydesign","q":"¿En qué culmina, según el tema, la responsabilidad del ingeniero de IA?","o":["En la adopción de una ética desde el diseño.","En la superación del Test de Turing.","En la regulación del sistema por parte del usuario final.","En la sustitución de reglas por redes neuronales.","En la maximización de la utilidad económica del sistema."],"e":["Es la conclusión de §1.3.5.","No es una cuestión de responsabilidad.","La responsabilidad es del ingeniero desde la arquitectura.","No es una exigencia ética.","El tema habla de beneficio social, no económico."]},{"s":"agent","c":"agente-def","q":"¿Cómo define el tema, de forma general, un <b>agente</b>?","o":["Una entidad que percibe con sensores y actúa con actuadores.","Un programa que supera el Test de Turing.","Un sistema que separa la base de conocimiento del motor de inferencia.","Una entidad con consciencia y comprensión genuina.","Una entidad que maximiza siempre su medida de rendimiento."],"e":["Establece un ciclo continuo de realimentación percepción–acción.","No es un requisito para ser agente.","Eso define un SBC.","Es la pretensión de la IA fuerte.","Eso define a un agente racional, no a cualquier agente."]},{"s":"agent","c":"agente-def","q":"En el paradigma moderno de la IA, el concepto central ya no es el programa aislado sino…","o":["el agente.","la base de datos.","el juez del Test de Turing.","el silogismo.","el micromundo."],"e":["§1.4: el agente, que percibe y actúa en un ciclo continuo.","No es el concepto central según el tema.","No es un concepto de ingeniería de agentes.","Es un antecedente filosófico.","Son los problemas de juguete de los años 60."]},{"s":"agent","c":"swhw","q":"Según la taxonomía del tema, un bot que monitoriza flujos de datos en una red es un…","o":["agente software.","agente hardware.","agente distribuido, por el mero hecho de estar en una red.","sistema experto, porque usa reglas.","vehículo de Braitenberg."],"e":["Habita entornos virtuales (sistemas operativos, redes) y procesa flujos de datos.","Los agentes hardware (robots) interactúan con el mundo físico.","Ser distribuido implica cooperación entre múltiples agentes, no estar en una red.","Nada en el enunciado indica una base de conocimiento de reglas.","Son vehículos físicos reactivos."]},{"s":"agent","c":"swhw","q":"¿Qué sensores y actuadores cita el tema como típicos de los agentes hardware?","o":["Cámaras y lidares; motores y brazos mecánicos.","Ficheros de registro y llamadas al sistema operativo.","Bases de conocimiento y motores de inferencia.","Feromonas y visibilidad.","Teclado y pantalla de un juez humano."],"e":["Ejemplos de §1.4.1 para robots.","Corresponden a agentes software.","Son componentes de un SBC.","Son conceptos de colonia de hormigas (Tema 4).","Son el canal del Test de Turing."]},{"s":"agent","c":"reactivo","q":"¿En qué problemas son eficaces los <b>agentes reactivos</b> según el tema?","o":["En los que cumplen la propiedad de Markov.","En los que hay que calcular velocidades observando cambios de posición.","En los que hay múltiples caminos a la meta con distinto grado de satisfacción.","En los que la inteligencia emerge de la cooperación de muchos agentes.","En los entornos parcialmente observables con alta incertidumbre."],"e":["Seleccionan la acción solo con la percepción actual, mediante reglas condición–acción.","Eso requiere memoria (estado interno).","Es el caso de los agentes basados en utilidad.","Es el caso de los agentes distribuidos.","Sin memoria, el agente reactivo no puede compensar lo que no observa."]},{"s":"agent","c":"reactivo","q":"¿Qué tipo de reglas sigue un agente reactivo (reflejo)?","o":["Reglas condición–acción sobre la percepción actual.","Reglas que actualizan un estado interno con percepciones pasadas.","Reglas que evalúan secuencias de acciones futuras hacia un objetivo.","Reglas aprendidas por un componente crítico que observa resultados.","Reglas de negociación con otros agentes."],"e":["Ignora el resto del historial de percepciones.","Eso caracteriza al agente con memoria.","Eso caracteriza al agente basado en objetivos.","Eso caracteriza al agente de aprendizaje.","Es propio de los sistemas distribuidos."]},{"s":"agent","c":"memoria","q":"Un agente estima la velocidad de un objeto observando cómo cambia su posición en el tiempo. Según el tema, es un agente…","o":["con memoria (estado interno).","reactivo, porque usa solo la percepción actual.","distribuido, porque combina varias percepciones.","basado en utilidad, porque cuantifica la velocidad.","de Braitenberg, porque reacciona al movimiento."],"e":["Necesita almacenar percepciones pasadas; es el ejemplo de §1.4.1.","Una única percepción no permite calcular la velocidad.","Combinar percepciones en el tiempo no implica varios agentes.","Cuantificar una magnitud no es una función de utilidad.","Los vehículos de Braitenberg carecen de estado interno."]},{"s":"agent","c":"memoria","q":"¿Qué refleja el estado interno de un agente con memoria?","o":["Aspectos del mundo que ahora no son visibles.","El grado de satisfacción de cada estado.","Los valores morales que debe respetar.","Las reglas condición–acción del reflejo.","El componente crítico que mejora su conducta."],"e":["Le permite modelar la evolución del entorno.","Eso es la función de utilidad.","Es objeto de la ética de la máquina.","Son propias del agente reactivo, que no tiene estado.","Es propio del agente de aprendizaje."]},{"s":"agent","c":"utilidad","q":"¿Cuándo entran en juego los <b>agentes basados en utilidad</b> frente a los basados en objetivos?","o":["Cuando hay varios caminos a la meta y se debe cuantificar su satisfacción.","Cuando el entorno cumple la propiedad de Markov.","Cuando no existe ningún estado objetivo definido y el agente actúa sin meta alguna.","Cuando el agente debe recordar percepciones pasadas para modelar el entorno.","Cuando varios agentes deben coordinarse."],"e":["Permiten decidir racionalmente en situaciones de compromiso (trade-offs).","En ese caso basta un agente reactivo.","El tema los introduce cuando hay varios caminos hacia la meta.","Es la motivación del agente con memoria.","Es la motivación de los agentes distribuidos."]},{"s":"agent","c":"utilidad","q":"¿Qué hacen los agentes basados en objetivos según el tema?","o":["Buscan secuencias de acciones que alcancen un estado deseado.","Seleccionan la acción solo con la percepción actual.","Mantienen un estado interno sin evaluar el futuro.","Mejoran su desempeño con la experiencia gracias a un componente crítico.","Delegan la decisión en la cooperación de un enjambre."],"e":["Es la descripción de §1.4.1; la utilidad se añade cuando hay varios caminos.","Eso es un agente reactivo.","Es un agente con memoria.","Es un agente de aprendizaje.","Es un agente distribuido."]},{"s":"agent","c":"aprendizaje","q":"En un agente de aprendizaje, ¿qué función cumple el <b>componente crítico</b>?","o":["Observa resultados y ajusta la conducta para mejorar la utilidad futura.","Selecciona la acción a partir de la percepción actual.","Almacena todas las percepciones pasadas para modelar la evolución del entorno.","Negocia rutas con otros agentes en tiempo real.","Separa la base de conocimiento del motor de inferencia."],"e":["Es lo que permite mejorar con la experiencia.","Es el comportamiento reactivo.","Es el estado interno del agente con memoria.","Es propio de los sistemas distribuidos.","Es la arquitectura de un SBC."]},{"s":"agent","c":"aprendizaje","q":"¿Qué capacidad distingue a los agentes de aprendizaje en la taxonomía del tema?","o":["Mejorar su desempeño con la experiencia.","Actuar sin ningún sensor.","Garantizar el óptimo global de su función de utilidad.","Prescindir de cualquier medida de rendimiento.","Repartir la inteligencia entre muchos individuos."],"e":["Gracias a un componente crítico que observa los resultados.","Todo agente percibe mediante sensores.","El tema no promete tal garantía.","Al contrario: buscan aumentar la utilidad futura.","Es la característica de los agentes distribuidos."]},{"s":"agent","c":"distribuido","q":"En los agentes distribuidos, según el tema, la inteligencia es…","o":["una propiedad emergente de la cooperación entre agentes.","un componente crítico interno de cada agente.","un estado interno compartido por todos.","una función de utilidad global calculada por un agente central.","una regla condición–acción común."],"e":["La resolución no reside en un individuo.","Es propio de los agentes de aprendizaje.","El tema no la describe como un estado compartido.","La IAD rechaza el núcleo monolítico.","Es propio de los agentes reactivos."]},{"s":"agent","c":"distribuido","q":"¿Cuál de estos ejemplos del tema ilustra mejor un sistema de agentes distribuidos?","o":["Robots de almacén que se autoorganizan para evitar colisiones.","MYCIN diagnosticando infecciones bacterianas a partir de reglas de expertos.","ELIZA conversando con un usuario.","Un vehículo de Braitenberg huyendo de la luz.","Deep Blue jugando al ajedrez."],"e":["Ejemplo de §1.2.4 de inteligencia emergente por cooperación.","Es un sistema experto centralizado.","Es un único programa conversacional.","Es un único vehículo reactivo.","Es un único sistema que compite contra un humano."]},{"s":"entor","c":"observ","q":"Según el tema, ¿cuándo es un entorno <b>totalmente observable</b>?","o":["Cuando los sensores dan acceso al estado completo del mundo en cada momento.","Cuando el siguiente estado está determinado por el actual y la acción.","Cuando hay un número finito de estados y acciones.","Cuando el agente mantiene un estado interno de las percepciones pasadas.","Cuando el agente puede explicar sus decisiones."],"e":["Si no, el agente debe lidiar con incertidumbre (p. ej., conducción autónoma).","Eso define un entorno determinista.","Eso define un entorno discreto.","Es una forma de compensar la observabilidad parcial, no su definición.","Es la explicabilidad (XAI)."]},{"s":"entor","c":"observ","q":"El tema pone la conducción autónoma como ejemplo de entorno…","o":["parcialmente observable.","totalmente observable y discreto.","determinista y estático.","discreto, como el ajedrez.","de información perfecta."],"e":["El agente no percibe todo el estado y debe lidiar con incertidumbre.","La conducción autónoma no es ni una cosa ni otra.","El tema no la presenta así.","El ajedrez es el ejemplo de entorno discreto.","Es un concepto de juegos (Tema 3)."]},{"s":"entor","c":"determ","q":"Un entorno es <b>estocástico</b> o no determinista cuando…","o":["hay incertidumbre o factores externos impredecibles.","los sensores del agente no dan acceso al estado completo del mundo.","el tiempo y las variables fluyen de forma continua.","el agente aprende de la experiencia.","hay varios agentes cooperando."],"e":["Si el siguiente estado lo fijan el estado actual y la acción, es determinista.","Eso es observabilidad parcial.","Eso es un entorno continuo.","Es un tipo de agente, no de entorno.","Eso no define la estocasticidad."]},{"s":"entor","c":"determ","q":"¿Qué define a un entorno <b>determinista</b> según el tema?","o":["El estado actual y la acción determinan por completo el siguiente estado.","El agente conoce, a través de sus sensores, todos los estados del mundo en todo momento.","Existe un número finito y claramente definido de estados y de acciones.","El agente siempre alcanza su objetivo.","Las acciones tienen todas el mismo coste."],"e":["Definición de §1.4.2.","Eso es observabilidad total.","Eso es un entorno discreto.","La determinación de la transición no garantiza el éxito.","El coste no forma parte de la definición."]},{"s":"entor","c":"discreto","q":"El vuelo de un dron es, según el tema, un ejemplo de entorno…","o":["continuo.","discreto, como el ajedrez.","totalmente observable y determinista.","de suma cero.","reactivo."],"e":["Requiere modelos matemáticos más complejos.","El ajedrez es el ejemplo discreto; el dron, el continuo.","El tema no lo usa con ese fin.","Es un concepto de juegos.","«Reactivo» califica a agentes, no a entornos."]},{"s":"entor","c":"discreto","q":"¿Cuándo es <b>discreto</b> un entorno según el tema?","o":["Cuando hay un número finito y bien definido de estados y acciones.","Cuando el agente no puede observar el estado completo.","Cuando no hay incertidumbre en las transiciones.","Cuando el agente actúa a intervalos de tiempo regulares y prefijados de antemano.","Cuando la función de utilidad toma valores enteros."],"e":["Ejemplo: el ajedrez.","Eso es observabilidad parcial.","Eso es determinismo.","Muestrear en el tiempo no hace discreto el entorno según la definición del tema.","No forma parte de la definición."]},{"s":"entor","c":"racional","q":"Según el tema, un agente es <b>racional</b> si…","o":["maximiza su medida de rendimiento según sus percepciones y su conocimiento.","siempre alcanza el resultado óptimo real del problema, aunque no llegue a percibirlo.","supera el Test de Turing.","tiene consciencia de sus decisiones.","opera en un entorno totalmente observable."],"e":["Es la definición de cierre de §1.4.2.","La racionalidad se mide respecto a la evidencia disponible, no al resultado ideal.","No forma parte de la definición.","La racionalidad no exige consciencia.","Puede haber agentes racionales en entornos parcialmente observables."]},{"s":"entor","c":"racional","q":"¿De qué depende la racionalidad de un agente según la definición del tema?","o":["De su medida de rendimiento, sus percepciones y su conocimiento.","Solo de la arquitectura física de sus sensores.","Del número de agentes con los que coopera.","De que su motor de inferencia sea independiente del dominio de aplicación.","De que el entorno sea discreto."],"e":["Son los tres elementos de la definición.","Los sensores influyen en las percepciones, pero no agotan la definición.","No interviene en la definición.","Es una propiedad de los SBC.","La racionalidad no depende de esa dimensión."]},{"s":"sbc","c":"separacion","q":"¿En qué premisa crítica se fundamenta el diseño de un <b>Sistema Basado en Conocimiento</b>?","o":["En separar el saber (BC) del razonar (motor de inferencia).","En entrelazar datos y algoritmo en un flujo de control rígido.","En aprender automáticamente todas las reglas a partir de datos.","En la cooperación de múltiples agentes autónomos.","En la manipulación de símbolos sin semántica."],"e":["Es el «Principio del Conocimiento» de §1.5.","Es lo que hace la programación tradicional que el SBC pretende superar.","El SBC clásico se basa en conocimiento representado declarativamente.","Es la IA distribuida.","Es la crítica de Searle, no el principio de los SBC."]},{"s":"sbc","c":"separacion","q":"¿Por qué la IA propone los SBC frente a la programación tradicional en dominios complejos?","o":["Porque el control rígido es costoso y difícil de mantener.","Porque la programación tradicional no se ejecuta en GPU.","Porque los SBC no necesitan expertos humanos.","Porque los SBC garantizan siempre la solución óptima.","Porque los SBC eliminan la necesidad de datos de entrada."],"e":["La separación saber/razonar resuelve esa limitación.","No es el motivo que da el tema.","La adquisición de conocimiento suele requerir expertos.","El tema no lo afirma.","El motor usa la BC y los datos del problema."]},{"s":"sbc","c":"bc","q":"En un SBC, el conocimiento de la Base de Conocimiento se representa de forma declarativa. ¿Qué significa?","o":["Que describe «qué» se sabe, no «cómo» usarlo.","Que especifica paso a paso el algoritmo de resolución.","Que se declara una sola vez y no puede modificarse.","Que se almacena como pesos de una red neuronal.","Que solo contiene datos del problema actual."],"e":["El «cómo» lo aporta el motor de inferencia.","Eso sería conocimiento procedimental.","Al contrario: lo declarativo facilita actualizarlo.","El tema habla de hechos, reglas, heurísticas y relaciones.","La BC contiene conocimiento del dominio."]},{"s":"sbc","c":"bc","q":"¿Qué contiene la Base de Conocimiento según el tema?","o":["Hechos, reglas, heurísticas y relaciones del dominio.","El algoritmo de deducción y planificación.","La interfaz con el usuario y las explicaciones.","Solo los datos de entrada del problema actual.","El registro de las decisiones tomadas por el sistema."],"e":["Definición de §1.5.1.","Eso es el motor de inferencia.","Son otros componentes de la arquitectura.","Los datos del problema se combinan con la BC, pero no son la BC.","No es lo que define la BC."]},{"s":"sbc","c":"motor","q":"¿Qué componente de un SBC realiza deducciones, alcanza conclusiones y genera planes a partir de la BC y de los datos del problema?","o":["El mecanismo o motor de inferencia.","La base de conocimiento.","La adquisición de conocimiento.","El componente crítico.","La función de vecindario."],"e":["Es el componente que aplica la lógica sobre el conocimiento.","La BC almacena el conocimiento, pero no lo procesa.","Es el proceso de extraer pericia de las fuentes.","Pertenece a los agentes de aprendizaje.","Es un concepto de optimización (Tema 4)."]},{"s":"sbc","c":"motor","q":"¿Qué relación guarda el motor de inferencia con la aplicación, según §1.5.3?","o":["Suele ser independiente de la aplicación.","Debe reprogramarse para cada nueva aplicación.","Contiene las reglas de negocio del dominio.","Solo funciona con conocimiento médico.","Se genera automáticamente a partir de los datos."],"e":["Es la ventaja de modularidad.","Precisamente la separación lo evita.","Las reglas están en la BC.","El tema cita usos médicos e industriales.","El tema no lo describe así."]},{"s":"sbc","c":"ingcon","q":"La disciplina encargada de construir, mantener y evolucionar los SBC es…","o":["la Ingeniería del Conocimiento.","la roboética.","la IA distribuida.","la ingeniería de control automático.","la búsqueda local."],"e":["§1.5.2; la adquisición de conocimiento es una de sus tareas más críticas.","Es una rama de la ética de la IA.","Es otro paradigma.","Es una disciplina de la que se nutre la IA, pero no la que construye SBC.","Es una familia de algoritmos de optimización."]},{"s":"sbc","c":"ingcon","q":"Un róver que genera la cartografía de un terreno desconocido mientras se desplaza ilustra, según el tema, la adquisición de conocimiento mediante…","o":["sistemas de aprendizaje activo.","expertos humanos.","bases de datos especializadas.","el motor de inferencia.","la interfaz de usuario."],"e":["El agente adquiere conocimiento explorando directamente su entorno.","No hay ningún experto que dicte el mapa.","El conocimiento no se extrae de una base de datos previa.","El motor procesa el conocimiento, no lo adquiere.","No interviene en el ejemplo."]},{"s":"sbc","c":"modularidad","q":"Usar el mismo motor de inferencia en un sistema experto médico y en uno de diagnóstico industrial, cambiando solo la BC, ilustra la ventaja de…","o":["modularidad.","transparencia.","mantenibilidad.","robustez.","equidad algorítmica."],"e":["Ejemplo literal de §1.5.3.","La transparencia se refiere a explicar razonamientos.","Se refiere a la facilidad de actualizar el c
