Algoritmo 14, ¿cómo se seleccionan los padres?","o":["De forma proporcional a su aptitud.","Por orden de índice dentro de la población, tomando siempre los dos primeros disponibles.","Eligiendo siempre los dos individuos de mayor aptitud de la población actual.","Al azar con distribución uniforme.","Por similitud con los hijos."],"e":["Seleccionar_Proporcional_Aptitud.","No es el mecanismo.","Eso eliminaría la diversidad.","Se usa la aptitud.","Es el crowding, en el reemplazo."]},{"s":"gop","c":"seleccion","q":"¿Por qué el tema exige conceder una probabilidad no nula de selección a los individuos menos aptos?","o":["Para preservar la diversidad de la población.","Para que la aptitud media baje en cada generación.","Para que el mejor individuo no se reproduzca nunca.","Porque la ruleta no puede asignar probabilidad cero.","Para reducir la tasa de mutación."],"e":["§4.3.1 (Selección).","No es el objetivo.","No.","No es la razón del tema.","No."]},{"s":"gop","c":"seleccion","q":"En la selección por ruleta, la probabilidad de un individuo x<sub>i</sub> es…","o":["p(x<sub>i</sub>) = f(x<sub>i</sub>) / Σ<sub>j</sub> f(x<sub>j</sub>).","p(x<sub>i</sub>) = 1/n para todos los individuos, independientemente de su aptitud.","p(x<sub>i</sub>) = f(x<sub>i</sub>) / máx<sub>j</sub> f(x<sub>j</sub>), normalizada respecto al mejor individuo.","p(x<sub>i</sub>) = 1 − λ.","p(x<sub>i</sub>) = e<sup>−f(x<sub>i</sub>)/T</sup>."],"e":["Ecuación 4.7.","Sería selección uniforme.","No es la fórmula.","Es la del torneo probabilístico.","Recuerda al recocido."]},{"s":"gop","c":"ruleta","q":"¿Cómo se construye la «ruleta virtual» según el tema?","o":["Dividiendo (0, 1] según las probabilidades acumuladas.","Asignando a todos el mismo intervalo por orden alfabético.","Con sectores proporcionales a su posición en la población.","Enfrentando a parejas de individuos al azar.","Aplicando una máscara binaria."],"e":["El número aleatorio r actúa como puntero.","No es el procedimiento.","Es proporcional a su aptitud.","Eso es el torneo.","Es el cruce uniforme."]},{"s":"gop","c":"torneodet","q":"En el torneo determinista con c = 2, ¿cómo se elige el individuo?","o":["Se extraen 2 al azar y gana el de mayor aptitud.","Se extraen 2 al azar y gana uno de ellos elegido con probabilidad proporcional a su aptitud.","Se extraen 2 y gana el menos apto, para mantener la diversidad genética de la población.","Se comparan todos los individuos de la población.","Se genera r y se compara con λ."],"e":["En el ejemplo, x₅ (676) frente a x₂ (324).","Sería una ruleta reducida.","No es el torneo determinista.","Solo se comparan c.","Eso es el torneo probabilístico."]},{"s":"gop","c":"torneodet","q":"¿Qué efecto tiene aumentar el tamaño c del torneo según el tema?","o":["Aumenta la presión selectiva.","Reduce la presión selectiva y favorece la supervivencia de los individuos menos aptos.","No tiene ningún efecto sobre la presión selectiva, solo sobre el tiempo de cálculo.","Aumenta la tasa de mutación.","Convierte el torneo en una ruleta."],"e":["Reduce la supervivencia de los menos adaptados.","Es al revés.","Sí la afecta.","No.","No."]},{"s":"gop","c":"torneoprob","q":"En el torneo probabilístico, ¿con qué probabilidad se elige al individuo más apto?","o":["1 − λ.","λ, el parámetro fijo del torneo, que se compara con el número aleatorio generado.","1/c, la inversa del número de individuos que participan en cada torneo.","f(x)/Σf.","Siempre 1."],"e":["Se elige si r > λ, con 1/c ≤ λ ≤ 1.","λ es la probabilidad de elegir al menos apto.","1/c es la cota inferior de λ.","Es la ruleta.","Eso sería el torneo determinista."]},{"s":"gop","c":"torneoprob","q":"Torneo probabilístico con c = 3, λ = 0,4 y r = 0,7. ¿A quién se selecciona?","o":["Al más apto del torneo, porque r > λ.","Al menos apto del torneo, porque r supera el valor del parámetro λ fijado.","A uno al azar, con la misma probabilidad para cada uno.","A ninguno: hay que repetir el torneo.","Al de aptitud intermedia."],"e":["En el ejemplo del tema, x₅.","Con r > λ se elige al más apto.","No es el mecanismo.","No.","No."]},{"s":"gop","c":"cruce","q":"Según el tema, el cruce constituye el operador fundamental de…","o":["explotación.","exploración global, introduciendo variabilidad que ningún progenitor contenía previamente.","selección, al decidir qué cromosomas transmiten su material genético a la descendencia.","reemplazamiento.","evaporación."],"e":["Combina estructuras de alta aptitud de dos progenitores.","Ese papel lo cumple la mutación.","Es el operador de selección.","Es otra fase.","Es de ACO."]},{"s":"gop","c":"cruce","q":"En el cruce de un punto (SPX), los dos descendientes se forman…","o":["con la cabeza de un padre y la cola del otro, y viceversa.","intercambiando únicamente el bloque central situado entre dos puntos de corte aleatorios.","copiando cada bit de un padre según una máscara.","invirtiendo bits aislados.","duplicando al padre más apto."],"e":["El corte es un único locus aleatorio.","Eso es DPX.","Eso es UPX.","Eso es la mutación.","No es un cruce."]},{"s":"gop","c":"dpxupx","q":"¿Qué caracteriza al cruce de dos puntos (DPX) frente al SPX?","o":["Intercambia solo el bloque central entre dos cortes.","Usa una máscara binaria que decide, posición a posición, qué padre aporta cada bit.","Conserva la cabeza de un padre y la cola del otro.","No usa ningún punto de corte.","Solo puede aplicarse a codificaciones reales."],"e":["Aumenta la exploración y reduce los sesgos posicionales.","Es UPX.","Es SPX.","Usa dos.","Se describe para binarias."]},{"s":"gop","c":"dpxupx","q":"En el cruce uniforme (UPX), ¿cuántos intercambios efectivos se producen estadísticamente en un cromosoma de longitud L?","o":["En torno a L/2.","Exactamente uno, en el locus elegido como punto de corte de la máscara.","Exactamente L, porque la máscara obliga a intercambiar todos los bits de los padres.","Dos, uno por cada punto de corte.","Ninguno."],"e":["Promueve una mezcla homogénea del material genético.","Eso se parece al SPX.","La máscara mezcla, no intercambia todo.","Eso es DPX.","No."]},{"s":"gop","c":"sustitucion","q":"Tras el cruce, una estrategia de sustitución <b>no destructiva</b> admite a los hijos solo si…","o":["su aptitud es estrictamente superior a la de sus padres.","han sufrido al menos una mutación en alguno de sus genes durante la fase posterior.","su aptitud iguala la media de la generación anterior.","son genéticamente idénticos a sus padres.","ganan un torneo determinista."],"e":["Las destructivas los admiten incondicionalmente.","No es la condición.","No es la condición.","No.","No es la definición."]},{"s":"gop","c":"sustitucion","q":"En una estrategia de sustitución <b>destructiva</b>…","o":["los hijos reemplazan a los padres sin importar su calidad.","los hijos solo entran en la población si superan estrictamente la aptitud de sus padres.","los padres sobreviven y los hijos que no mejoran se descartan.","se destruye la población y se genera otra aleatoria.","se eliminan los individuos mutados."],"e":["§4.3.1.","Eso es la no destructiva.","No es la definición.","No.","No."]},{"s":"gop","c":"mutacion","q":"¿Qué valor suele adoptar la probabilidad de mutación por gen según el tema, y por qué?","o":["Muy bajo (p<sub>m</sub> < 0,01): si no, sería búsqueda aleatoria.","En torno a 0,5, para que cambiar o no sea equiprobable.","Exactamente 1, para que todo hijo difiera.","Cero, porque la mutación no aporta nada.","Igual a la tasa de evaporación ρ."],"e":["Desmantelarían la explotación de la selección.","Sería prácticamente una búsqueda aleatoria.","Destruiría la información heredada.","Es fundamental para la exploración.","Son parámetros de algoritmos distintos."]},{"s":"gop","c":"mutacion","q":"¿Por qué es fundamental la mutación aunque su probabilidad sea baja?","o":["Porque ninguna solución factible queda con probabilidad cero.","Porque es el principal operador de explotación del AG.","Porque garantiza hijos mutados mejores que sus padres.","Porque sustituye a la selección.","Porque reduce la población."],"e":["Es la salvaguarda de la exploración.","Ese papel es del cruce.","No lo garantiza.","No.","No."]},{"s":"gop","c":"reemplazo","q":"En el reemplazamiento por <b>crowding</b>, ¿qué individuos sustituye el hijo?","o":["Uno elegido al azar entre un subgrupo de individuos de aptitud similar a la suya.","A sus propios progenitores, sea cual sea su aptitud.","A individuos elegidos uniformemente al azar en toda la población actual.","Al peor individuo de la población.","Al mejor individuo de la población."],"e":["Comúnmente entre 6 y 10 individuos; combate la convergencia en nichos.","Es el reemplazamiento de los padres.","Es el reemplazamiento aleatorio.","Se relaciona con el reemplazamiento de los peores.","No."]},{"s":"gop","c":"reemplazo","q":"¿Cuál de estos NO es un método de reemplazamiento descrito en el tema?","o":["Reemplazamiento de los mejores.","Reemplazamiento aleatorio con distribución uniforme.","Reemplazamiento de los padres por la descendencia.","Reemplazamiento de individuos similares (crowding).","Reemplazamiento entre un porcentaje de los peores individuos."],"e":["Sí es la respuesta: el tema cita aleatorio, padres, similares y peores.","Sí aparece.","Sí aparece.","Sí aparece.","Sí aparece."]},{"s":"gej","c":"parejas","q":"¿Qué efecto ilustra que el individuo 5 (x = 26) salga elegido dos veces en el ejemplo?","o":["La presión selectiva.","Un error del generador de números aleatorios, que debería evitar elegir dos veces al mismo.","La aplicación del elitismo, que obliga a conservar siempre al mejor individuo de la población.","La mutación en el bit 4.","La convergencia prematura de la población."],"e":["Los más aptos participan más; los menos adaptados ven reducida su participación.","No es un error.","El ejemplo no usa elitismo.","No guarda relación.","No es lo que ilustra."]},{"s":"gej","c":"cruce","q":"Pareja (3, 4): 01111 y 11000 con corte tras el bit 3 (SPX). ¿Qué descendientes resultan?","o":["01100 (12) y 11011 (27).","01111 (15) y 11000 (24), idénticos a sus padres porque el corte no separa ningún bloque.","01000 (8) y 11111 (31), al intercambiar los tres primeros bits de cada progenitor.","01011 (11) y 11100 (28), al intercambiar los dos últimos bits.","11111 (31) y 01000 (8)."],"e":["Tabla 4.6.","El corte en 3 sí intercambia las colas.","No es el resultado del SPX.","No corresponde.","No corresponde."]},{"s":"gej","c":"cruce","q":"Pareja (5, 1): 11010 y 01100 con corte tras el bit 2. ¿Qué descendientes resultan?","o":["11100 (28) y 01010 (10).","11010 (26) y 01100 (12), sin cambios, porque el corte coincide con la mitad de la cadena.","11000 (24) y 01110 (14), intercambiando solo el bloque central de ambos progenitores.","10100 (20) y 11010 (26), al cortar tras el primer bit de cada padre.","01100 (12) y 11010 (26)."],"e":["11|100 y 01|010.","El corte en 2 intercambia las colas.","Eso sería DPX.","No corresponde.","No corresponde."]},{"s":"gej","c":"mutacion","q":"En el ejemplo, la mutación actúa en el bit 4 del segundo descendiente 01010. ¿Qué individuo resulta?","o":["01000, x = 8 y aptitud 64.","01011, x = 11 y aptitud 121, al invertir el bit menos significativo de la cadena.","01110, x = 14 y aptitud 196, al invertir el bit central de la cadena.","11010, x = 26 y aptitud 676.","00010, x = 2 y aptitud 4."],"e":["Pasa de x = 10 (f = 100) a x = 8.","El bit 4 no es el menos significativo.","Ese sería el bit 3.","Sería el bit 1.","Sería el bit 2."]},{"s":"gej","c":"mutacion","q":"En la Figura 4.4, el cromosoma 01101011 pasa a 00101111. ¿Qué bits se han alterado?","o":["El 2 y el 6.","El 1 y el 8, los dos extremos de la cadena, que son los únicos que pueden mutar.","Del 2 al 6 en bloque, como en un cruce de dos puntos aplicado al mismo cromosoma.","El 3 y el 5.","Todos los bits pares."],"e":["Mutación de genes aislados por inversión lógica.","No coinciden con la figura.","No es un bloque: son genes aislados.","No coinciden.","No coinciden."]},{"s":"gej","c":"reemplazo","q":"¿Qué política de reemplazamiento se aplica en el ejemplo para pasar a t = 1?","o":["Generacional directa sin elitismo: los seis hijos sustituyen a los seis padres.","De los peores: solo se sustituyen los individuos con menor aptitud de la población inicial.","Crowding: cada hijo sustituye a un individuo de aptitud similar a la suya.","No destructiva: solo entran los hijos mejores que sus padres.","Elitista: se conserva siempre el mejor de t = 0."],"e":["Con independencia de su aptitud.","No es la del ejemplo.","No es la del ejemplo.","Entran todos, incluso el mutado.","No hay elitismo."]},{"s":"gej","c":"reemplazo","q":"En el ejemplo, ¿por qué el individuo 01000 (f = 64) forma parte de la población t = 1 pese a ser peor que todos sus padres?","o":["Porque el reemplazo generacional ignora la aptitud.","Porque la mutación siempre produce individuos mejores que la media.","Porque ganó un torneo determinista al menos apto.","Porque su aptitud supera la media de la población.","Porque es el óptimo global."],"e":["Todos los descendientes sustituyen a la población anterior.","En este caso empeoró.","No hubo torneo.","64 está muy por debajo de la media.","El óptimo es 31."]},{"s":"aco","c":"estigmergia","q":"¿Cómo se denomina el mecanismo de comunicación indirecta de las hormigas a través del entorno?","o":["Estigmergia.","Crowding, porque las hormigas se agrupan con otras de aptitud parecida.","Recocido, porque el rastro se enfría con el paso del tiempo.","Presión selectiva.","Inducción hacia atrás."],"e":["Se comunican modificando el entorno con feromona.","Es un método de reemplazamiento de los AG.","Es otra metaheurística.","Es un concepto de los AG.","Es el fundamento de Minimax."]},{"s":"aco","c":"estigmergia","q":"En el modelo biológico, ¿por qué acaba predominando la ruta más corta?","o":["Porque se recorre antes y acumula más feromona.","Porque cada hormiga conoce el mapa y calcula el óptimo.","Porque evitan los caminos con más feromona para explorar.","Porque las rutas largas se bloquean físicamente.","Porque la primera hormiga elige siempre la ruta corta."],"e":["Retroalimentación positiva.","Individualmente carecen de visión global.","Es al revés.","No es lo que dice el tema.","Al inicio eligen indiscriminadamente."]},{"s":"aco","c":"evaporacion","q":"En ACO, ¿qué papel tiene la <b>evaporación</b> de la feromona?","o":["Simular el olvido de las rutas subóptimas.","Aumentar el rastro en las aristas que forman parte de la mejor solución encontrada.","Calcular la visibilidad de cada arista como el inverso de su distancia geométrica.","Seleccionar el nodo siguiente de cada hormiga.","Garantizar el óptimo global."],"e":["Las rutas largas pierden gradualmente su rastro.","Eso es el depósito (refuerzo).","Es la heurística η.","Eso es la regla de transición.","No lo garantiza."]},{"s":"aco","c":"evaporacion","q":"¿Por qué suele fijarse una tasa de evaporación baja (p. ej., ρ = 0,01)?","o":["Para mitigar el riesgo de convergencia prematura a óptimos locales.","Para que la feromona desaparezca rápido y todo sea equiprobable.","Para que la visibilidad pese más que la feromona.","Porque ρ debe ser igual a Q.","Para reducir el número de hormigas."],"e":["§4.3.2.","Eso sería una tasa alta.","No es el motivo.","No.","No."]},{"s":"aco","c":"transicion","q":"La probabilidad de que la hormiga k pase de x a y es…","o":["p<sub>xy</sub> = τ<sub>xy</sub>·η<sub>xy</sub> / Σ<sub>z∈A<sub>x</sub></sub> τ<sub>xz</sub>·η<sub>xz</sub>.","p<sub>xy</sub> = τ<sub>xy</sub> + η<sub>xy</sub>, la suma de feromona y visibilidad sin ninguna normalización.","p<sub>xy</sub> = 1/d<sub>xy</sub>, la visibilidad de la arista, sin tener en cuenta la feromona.","p<sub>xy</sub> = e<sup>−ΔE/T</sup>.","p<sub>xy</sub> = f(x<sub>i</sub>)/Σf."],"e":["Ecuación 4.8: producto de feromona y visibilidad, normalizado entre los accesibles.","Es un producto normalizado.","Falta la feromona y la normalización.","Es el recocido.","Es la ruleta de lo function validSession(s) {

/* ---------- Práctica ---------- */
function startPractice(items) {
  if (!items.length) return;
  session = { mode: 'practice', items, answers: items.map(() => null), visited: items.map(() => false), cur: 0, startedAt: Date.now() };
  saveSession(); renderPractice(); scrollTop();
}
function renderPractice() {
  screen = 'practice';
  const s = session, k = s.cur, it = s.items[k], q = Q(it), N = s.items.length;

    ? it.p.map((orig, pos) => solvedOpt(q, orig, pos, ans)).join('')
    : it.p.map((orig, pos) => `<button class="opt" data-action="pick" data-pos="${pos}"><span class="let">${LET[pos]}</span><span class="otext">${q.o[orig]}</span></button>`).join('');
  let after = '';
  if (answered) {
    const okPos = it.p.indexOf(0);

      ${themeToggleHTML()}<button class="btn" data-action="quit">Salir</button></div>

function solvedOpt(q, orig, pos, ans) {

  const tag = ok ? (mine ? '✓ Correcta · tu respuesta' : '✓ Correcta') : (mine ? '✗ Incorrecta · tu respuesta' : 'Incorrecta');
  return `<div class="opt ${cls}"><span class="let">${LET[pos]}</span><div class="body"><div class="otext">${q.o[orig]}</div>

}

  <header class="top"><div><h1>Práctica terminada</h1><p class="sub">${sc.N} preguntas · ${mmss((s.finishedAt || Date.now()) - s.startedAt)}</p></div>${themeToggleHTML()}</header>
  <section class="card">
    <div class="score"><span class="nota">${pct(sc.A, sc.N)} %<small> de aciertos</small></span></div>
    <div class="kpis">
      <div class="kpi ok"><b>${sc.A}</b><span>Aciertos</span></div>
      <div class="kpi bad"><b>${sc.F}</b><span>Fallos</span></div>
      <div class="kpi"><b>${fmt(sc.nota)}</b><span>Nota con penalización</span></div>
      <div class="kpi"><b>${fmt(sc.notaBruta)}</b><span>Nota sin penalización</span></div>
    </div>
    <div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Tema</th><th>Preguntas</th><th>Aciertos</th><th>Fallos</th><th>% aciertos</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="controls">
      <button class="btn primary" data-action="retryWrong" ${wrong.length ? '' : 'disabled'}>Repasar las falladas (${wrong.length})</button>
      <button class="btn" data-action="home">Inicio</button>
    </div>
  </section>
  ${wrong.length ? `<section class="card"><h2>Preguntas falladas</h2>${wrong.map(x => reviewItem(x.it, s.answers[x.k], x.k)).join('')}</section>` : ''}`;
}

/* ---------- Examen ---------- */
function startExam(kind) {
  const ex = SSII.buildExam(BANK, kind, rnd);
  const minutes = +prefs.minutes;
  prefs.temas = ex.temas.slice(); savePrefs();
  session = { mode: 'exam', kind, items: ex.items, answers: ex.items.map(() => null), visited: ex.items.map(() => false), cur: 0,
    startedAt: Date.now(), minutes, deadline: minutes ? Date.now() + minutes * 60000 : null };
  saveSession(); renderExam(); scrollTop();
}
function renderExam() {
  screen = 'exam';
  const s = session, k = s.cur, it = s.items[k], q = Q(it), N = s.items.length;
  s.visited[k] = true;
  const ans = s.answers[k], answered = ans !== null && ans !== undefined;
  const nAns = s.answers.filter(a => a !== null && a !== undefined).length;
  const grid = s.items.map((x, j) => {
    const a = s.answers[j] !== null && s.answers[j] !== undefined;
    const cls = [a ? 'ans' : (s.visited[j] && j !== k ? 'skip' : ''), j === k ? 'cur' : ''].join(' ');
    return `<button class="navq ${cls}" data-action="goto" data-k="${j}" aria-label="Pregunta ${j + 1}${a ? ', respondida' : ''}">${j + 1}</button>`;
  }).join('');
  const opts = it.p.map((orig, pos) => `<button class="opt ${orig === ans ? 'sel' : ''}" data-action="choose" data-pos="${pos}" aria-pressed="${orig === ans}"><span class="let">${LET[pos]}</span><span>${q.o[orig]}</span></button>`).join('');
  const last = k === N - 1;
  app.innerHTML = `
  <div class="sessbar exam">
    <div class="row"><span class="title">${SSII.EXAM_KINDS[s.kind].label}</span>
      <span class="timer" id="timer">${s.deadline ? mmss(s.deadline - Date.now()) : mmss(Date.now() - s.startedAt)}</span>
      <span class="pill">${nAns}/${N}<span class="hide-sm">&nbsp;respondidas</span></span><span class="spacer"></span>
      ${themeToggleHTML()}<button class="btn primary" data-action="submit">Entregar</button></div>
    <div class="progress"><i style="width:${pct(nAns, N)}%"></i></div>
  </div>
  <section class="card">
    <div class="qmeta"><span><b>Pregunta ${k + 1} de ${N}</b></span><span>Tema ${it.t}</span></div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${opts}</div>
    <div class="controls">
      <button class="btn" data-action="prev" ${k === 0 ? 'disabled' : ''}>← Anterior</button>
      <button class="btn ghost" data-action="clear" ${answered ? '' : 'disabled'}>Borrar respuesta</button>
      <span class="spacer"></span>
      ${last ? `<button class="btn primary" data-action="submit">Revisar y entregar</button>`
             : `<button class="btn ${answered ? 'primary' : ''}" data-action="skip">${answered ? 'Siguiente →' : 'Saltar →'}</button>`}
    </div>
    <p class="kbd">Teclado: <kbd>A</kbd>–<kbd>E</kbd> o <kbd>1</kbd>–<kbd>5</kbd> marcar · <kbd>←</kbd> anterior · <kbd>→</kbd> saltar/siguiente · <kbd>Supr</kbd> borrar.</p>
  </section>
  <section class="card">
    <details class="navwrap" ${(navOpen === null ? window.innerWidth > 680 : navOpen) ? 'open' : ''}><summary>Mapa de preguntas</summary><div class="navgrid">${grid}</div>
    <div class="legend"><span class="l-ans">Respondida</span><span class="l-skip">Saltada</span><span>Sin ver</span></div></details>
  </section>`;
  saveSession(); startTimer();
}
function choose(pos) {
  const s = session; if (!s || s.mode !== 'exam' || s.done) return;
  const orig = s.items[s.cur].p[pos]; if (orig === undefined) return;
  s.answers[s.cur] = orig; saveSession(); renderExam();
}
function clearAns() { const s = session; if (!s || s.mode !== 'exam') return; s.answers[s.cur] = null; saveSession(); renderExam(); }
function gotoQ(k) { const s = session; if (!s || k < 0 || k >= s.items.length) return; s.cur = k; renderExam(); scrollTop(); }
function startTimer() {
  stopTimer();
  const tick = () => {
    const s = session; if (!s || s.mode !== 'exam' || s.done || screen !== 'exam') return stopTimer();
    const el = document.getElementById('timer');
    if (s.deadline) {
      const left = s.deadline - Date.now();
      if (el) { el.textContent = mmss(left); el.classList.toggle('low', left < 5 * 60000); }
      if (left <= 0) { stopTimer(); submitExam(true); }
    } else if (el) el.textContent = mmss(Date.now() - s.startedAt);
  };
  tick(); timerId = setInterval(tick, 500);
}
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
async function askSubmit() {
  const s = session; if (!s) return;
  const blanks = s.answers.filter(a => a === null || a === undefined).length;
  const okGo = await confirmModal('¿Entregar el examen?', blanks ? `Quedan ${blanks} pregunta${blanks === 1 ? '' : 's'} en blanco. Las preguntas en blanco no suman ni restan.` : 'Has respondido todas las preguntas.', 'Entregar', 'Seguir con el examen');
  if (okGo && session === s && !s.done) submitExam(false);
}
function submitExam(timeUp) {
  const s = session; if (!s || s.done) return;
  closeModal(false);
  s.done = true; s.timeUp = !!timeUp; s.submittedAt = Date.now();
  s.items.forEach((it, k) => { const a = s.answers[k]; if (a !== null && a !== undefined) record(it, a); });
  saveStats(); saveSession(); stopTimer(); reviewFilter = 'wrong';
  renderExamEnd(); scrollTop();
}
function renderExamEnd() {
  screen = 'examEnd';
  const s = session, sc = SSII.score(s.items, s.answers);
  const used = Math.min(s.submittedAt, s.deadline || Infinity) - s.startedAt;
  const rows = Object.keys(sc.perTema).map(Number).sort((a, b) => a - b).map(t => {
    const r = sc.perTema[t];
    return `<tr><td>Tema ${t}</td><td>${r.n}</td><td>${r.A}</td><td>${r.F}</td><td>${r.B}</td><td>${signed(r.net)}</td><td>${fmt(r.nota)}</td></tr>`;
  }).join('');
  const isWrong = k => s.answers[k] !== 0;
  const list = s.items.map((it, k) => ({ it, k })).filter(x =>
    reviewFilter === 'all' ? true : reviewFilter === 'wrong' ? isWrong(x.k) : reviewFilter === 'blank' ? s.answers[x.k] == null : s.answers[x.k] === 0);
  const grid = s.items.map((x, j) => {
    const a = s.answers[j];
    return `<a class="navq ${a === 0 ? 'r-ok' : a == null ? '' : 'r-bad'}" href="#rv-${j}" style="display:grid;place-items:center;text-decoration:none;color:inherit" data-action="jump" data-k="${j}">${j + 1}</a>`;
  }).join('');
  const fchip = (v, label, n) => `<button class="chip" data-action="rfilter" data-v="${v}" aria-pressed="${reviewFilter === v}">${label} (${n})</button>`;
  app.innerHTML = `
  <header class="top"><div><h1>${SSII.EXAM_KINDS[s.kind].label}: resultado</h1><p class="sub">${s.timeUp ? 'Tiempo agotado · ' : ''}Tiempo empleado ${mmss(used)}</p></div>${themeToggleHTML()}</header>
  <section class="card">
    <div class="score"><span class="nota">${fmt(sc.nota)}<small> / 10</small></span>
      <span class="formula">(aciertos − fallos) / ${sc.N} × 10 = (${sc.A} − ${sc.F}) / ${sc.N} × 10${sc.net < 0 ? ' → 0' : ''}</span></div>
    <div class="kpis">
      <div class="kpi ok"><b>${sc.A}</b><span>Aciertos</span></div>
      <div class="kpi bad"><b>${sc.F}</b><span>Fallos</span></div>
      <div class="kpi"><b>${sc.B}</b><span>En blanco</span></div>
      <div class="kpi"><b>${fmt(sc.notaBruta)}</b><span>Sin penalización</span></div>
    </div>
    <div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Tema</th><th>Preg.</th><th>Aciertos</th><th>Fallos</th><th>Blanco</th><th>Neta</th><th>Nota</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="controls">
      <button class="btn primary" data-action="practiceWrong" ${sc.F + sc.B ? '' : 'disabled'}>Practicar falladas y en blanco (${sc.F + sc.B})</button>
      <button class="btn" data-action="startExam" data-kind="${s.kind}">Otro ${s.kind === 'parcial' ? 'parcial' : 'final'}</button>
      <button class="btn" data-action="home">Inicio</button>
    </div>
  </section>
  <section class="card">
    <h2>Revisión</h2>
    <div class="navgrid" style="margin-bottom:12px">${grid}</div>
    <div class="row" style="margin-bottom:6px">${fchip('wrong', 'Falladas y en blanco', sc.F + sc.B)}${fchip('blank', 'En blanco', sc.B)}${fchip('right', 'Acertadas', sc.A)}${fchip('all', 'Todas', sc.N)}
      <span class="spacer"></span><button class="chip" data-action="whyToggle" aria-pressed="${showWhy}">Explicaciones</button></div>
    <div class="${showWhy ? '' : 'hide-why'}" id="rvlist">${list.length ? list.map(x => reviewItem(x.it, s.answers[x.k], x.k)).join('') : '<div class="empty">No hay preguntas en este grupo.</div>'}</div>
  </section>`;
}
function reviewItem(it, ans, k) {
  const q = Q(it);
  const sec = BANK[it.t].secs[q.s] || ['', ''];
  const status = ans === 0 ? '<span class="pill ok">Acertada</span>' : ans == null ? '<span class="pill">En blanco</span>' : '<span class="pill bad">Fallada</span>';
  return `<div class="rv" id="rv-${k}"><div class="qmeta"><span><b>${k + 1}.</b> Tema ${it.t} · ${esc(sec[0])}</span>${status}</div>
    <div class="qtext">${q.q}</div><div class="opts">${it.p.map((orig, pos) => solvedOpt(q, orig, pos, ans)).join('')}</div>
    <p class="source">Fuente: ${esc(sec[1])}</p></div>`;
}
const signed = x => (x < 0 ? '−' + (-x) : String(x));

/* ---------- Modal ---------- */
let modalResolve = null;
function confirmModal(title, body, okLabel, cancelLabel) {
  closeModal(false);
  return new Promise(res => {
    modalResolve = res;
    const ov = document.createElement('div');
    ov.className = 'overlay'; ov.id = 'overlay';
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3><p>${esc(body)}</p>
      <div class="row"><button class="btn" data-m="0">${esc(cancelLabel)}</button><button class="btn primary" data-m="1">${esc(okLabel)}</button></div></div>`;
    ov.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) closeModal(b.dataset.m === '1'); else if (e.target === ov) closeModal(false); });
    document.body.appendChild(ov);
    ov.querySelector('[data-m="1"]').focus();
  });
}
function alertModal(title, body) {
  closeModal(false);
  return new Promise(res => {
    modalResolve = res;
    const ov = document.createElement('div');
    ov.className = 'overlay'; ov.id = 'overlay';
    ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">${esc(title)}</h3><p>${esc(body)}</p>
      <div class="row"><button class="btn primary" data-m="1">Entendido</button></div></div>`;
    ov.addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) closeModal(true); else if (e.target === ov) closeModal(false); });
    document.body.appendChild(ov);
    ov.querySelector('[data-m="1"]').focus();
  });
}
async function importFromFile(file) {
  let data;
  try { data = JSON.parse(await file.text()); }
  catch (e) { return alertModal('Archivo no válido', 'No se ha podido leer el archivo: no contiene JSON válido.'); }
  if (!data || data.app !== 'ssii-test' || !data.stats || typeof data.stats !== 'object') {
    return alertModal('Archivo no válido', 'El archivo no es una exportación de este test.');
  }
  const inc = data.stats;
  const nInc = Object.keys(inc).length;
  const when = data.exportedAt ? new Date(data.exportedAt) : null;
  const whenTxt = when && !isNaN(when.getTime()) ? ', exportado el ' + when.toLocaleDateString('es-ES') : '';
  const ok = await confirmModal('Importar datos',
    'El archivo trae ' + nInc + ' preguntas con registro' + whenTxt + '. Se combinará con lo de este navegador: los intentos se suman y manda el último resultado del archivo.',
    'Importar', 'Cancelar');
  if (!ok) return;
  let n = 0;
  for (const id in inc) {
    const b = inc[id];
    if (!Array.isArray(b)) continue;
    const a = stats[id];
    stats[id] = a
      ? [(a[0] | 0) + (b[0] | 0), (a[1] | 0) + (b[1] | 0), b[2] == null ? a[2] : b[2]]
      : [b[0] | 0, b[1] | 0, b[2] == null ? null : b[2]];
    n++;
  }
  saveStats();
  if (data.prefs && typeof data.prefs === 'object') { Object.assign(prefs, data.prefs); savePrefs(); }
  if (typeof data.theme === 'string') { LS.set(K_THEME, data.theme); document.documentElement.setAttribute('data-theme', data.theme); }
  renderHome(); scrollTop();
  await alertModal('Datos importados', 'Se han combinado ' + n + ' preguntas con registro.');
}
function closeModal(v) {
  const ov = document.getElementById('overlay');
  if (ov) ov.remove();
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(v); }
}

/* ---------- Acciones ---------- */
function scrollTop() { try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (e) { window.scrollTo(0, 0); } }
function resume() {
  if (!session) return renderHome();
  if (session.mode === 'exam') {
    if (session.deadline && session.deadline <= Date.now()) { submitExam(true); return; }
    renderExam();
  } else renderPractice();
  scrollTop();
}
const ACTIONS = {
  theme() {
    const root = document.documentElement;
    const cur = root.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', nx); LS.set(K_THEME, nx);
  },
  temas(el) {
    const v = el.dataset.v;
    prefs.temas = v === 'all' ? TEMAS.slice() : v === 'none' ? [] : TEMAS.filter(t => t <= 4);
    savePrefs(); renderHome();
  },
  pref(el) { prefs[el.dataset.k] = el.dataset.k === 'minutes' ? +el.dataset.v : el.dataset.v; savePrefs(); renderHome(); },
  async startPractice() {
    if (session && !session.done && !(await confirmModal('Hay una sesión sin terminar', 'Si empiezas una práctica nueva se descartará la sesión pendiente.', 'Empezar', 'Cancelar'))) return;
    startPractice(SSII.buildPractice(BANK, prefs.temas, { count: prefs.count, filter: prefs.filter, order: prefs.order }, stats, rnd));
  },
  async startExam(el) {
    if (session && !session.done && !(await confirmModal('Hay una sesión sin terminar', 'Si empiezas un examen nuevo se descartará la sesión pendiente.', 'Empezar', 'Cancelar'))) return;
    startExam(el.dataset.kind);
  },
  resume() { resume(); },
  async discard() { if (await confirmModal('¿Descartar la sesión?', 'Se perderá el progreso de la sesión pendiente (las estadísticas ya guardadas se mantienen).', 'Descartar', 'Cancelar')) { session = null; saveSession(); renderHome(); } },
  pick(el) { pick(+el.dataset.pos); },
  next() { nextPractice(); },
  async quit() {
    if (await confirmModal('¿Salir de la práctica?', 'Podrás reanudarla desde el inicio.', 'Salir', 'Seguir')) renderHome();
  },
  retryWrong() {
    const s = session; if (!s) return;
    const items = s.items.filter((it, k) => s.answers[k] !== 0).map(it => ({ t: it.t, i: it.i, p: SSII.perm5(rnd) }));
    startPractice(SSII.shuffle(items, rnd));
  },
  practiceWrong() {
    const s = session; if (!s) return;
    const items = s.items.filter((it, k) => s.answers[k] !== 0).map(it => ({ t: it.t, i: it.i, p: SSII.perm5(rnd) }));
    startPractice(items);
  },
  choose(el) { choose(+el.dataset.pos); },
  clear() { clearAns(); },
  prev() { if (session && session.cur > 0) gotoQ(session.cur - 1); },
  skip() { if (session && session.cur < session.items.length - 1) gotoQ(session.cur + 1); },
  goto(el) { gotoQ(+el.dataset.k); },
  submit() { askSubmit(); },
  rfilter(el) { reviewFilter = el.dataset.v; renderExamEnd(); },
  whyToggle(el) {
    showWhy = !showWhy; el.setAttribute('aria-pressed', String(showWhy));
    const l = document.getElementById('rvlist'); if (l) l.classList.toggle('hide-why', !showWhy);
  },
  jump(el, e) {
    const k = el.dataset.k, target = document.getElementById('rv-' + k);
    e.preventDefault();
    if (!target) { reviewFilter = 'all'; renderExamEnd(); }
    const t2 = document.getElementById('rv-' + k); if (t2) t2.scrollIntoView({ behavior: 'smooth', block: 'start' });
  },
  home() { session = session && !session.done ? session : null; saveSession(); renderHome(); scrollTop(); },
  exportData() {
    const data = { app: 'ssii-test', version: 1, exportedAt: new Date().toISOString(), stats, prefs, theme: LS.get(K_THEME, null) };
    const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const d = new Date(), p = x => String(x).padStart(2, '0');
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ssii-test-datos-' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  },
  importData() { const f = document.getElementById('impfile'); if (f) { f.value = ''; f.click(); } },
  async resetStats() {
    if (await confirmModal('¿Borrar estadísticas?', 'Se borrará el registro de preguntas vistas y falladas de este navegador.', 'Borrar', 'Cancelar')) { stats = {}; saveStats(); renderHome(); }
  }
};
app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled || !app.contains(el)) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn) fn(el, e);
});
app.addEventListener('toggle', e => { if (e.target.classList && e.target.classList.contains('navwrap')) navOpen = e.target.open; }, true);
app.addEventListener('change', e => {
  if (e.target.id === 'impfile') { const f = e.target.files && e.target.files[0]; if (f) importFromFile(f); return; }
  const cb = e.target.closest('input[data-tema]');
  if (!cb) return;
  const t = +cb.dataset.tema, set = new Set(prefs.temas);
  if (cb.checked) set.add(t); else set.delete(t);
  prefs.temas = TEMAS.filter(x => set.has(x)); savePrefs(); renderHome();
});
document.addEventListener('keydown', e => {
  if (document.getElementById('overlay')) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(false); }
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey || (e.target && e.target.matches && e.target.matches('input, textarea, select'))) return;
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  let idx = 'abcde'.indexOf(key); if (idx < 0) idx = '12345'.indexOf(key);
  if (key.length !== 1) idx = -1;
  if (screen === 'practice' && session) {
    const answered = session.answers[session.cur] !== null && session.answers[session.cur] !== undefined;
    if (idx >= 0 && !answered) { e.preventDefault(); pick(idx); }
    else if (answered && (key === 'Enter' || key === 'ArrowRight')) { e.preventDefault(); nextPractice(); }
  } else if (screen === 'exam' && session) {
    if (idx >= 0) { e.preventDefault(); choose(idx); }
    else if (key === 'ArrowLeft') { e.preventDefault(); ACTIONS.prev(); }
    else if (key === 'ArrowRight') { e.preventDefault(); ACTIONS.skip(); }
    else if (key === 'Delete' || key === 'Backspace') { e.preventDefault(); clearAns(); }
  }
});
renderHome();
})();
</script>
</body>
