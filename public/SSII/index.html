"compromiso","q":"Una heurística muy precisa tarda tanto en evaluarse en cada nodo que el tiempo total de búsqueda empeora. Según el tema…","o":["evaluarla cuesta más de lo que ahorra en nodos.","es preferible porque siempre reduce el número de nodos.","deja de ser admisible por ser demasiado precisa respecto al coste real.","convierte A* en una búsqueda de coste uniforme.","la búsqueda pasa a ser incompleta."],"e":["§3.2.3.","Reducir nodos no compensa si cada evaluación es muy cara.","La precisión no rompe la admisibilidad.","Eso ocurre con h = 0.","No se deduce."]},{"s":"dis","c":"relajacion","q":"¿En qué consiste la <b>relajación de problemas</b> para construir heurísticas?","o":["En quitar restricciones y usar el óptimo del problema simplificado.","En añadir restricciones para que el problema tenga una sola solución.","En sustituir la función de coste por otra de valor constante.","En combinar varias heurísticas mediante el máximo.","En permitir que la heurística sobreestime el coste en algunos nodos."],"e":["Es la metodología más extendida (§3.2.3).","Es lo contrario.","No es la relajación.","Es la combinación por máximo, otra técnica.","Eso rompería la admisibilidad."]},{"s":"dis","c":"relajacion","q":"¿Por qué las heurísticas obtenidas por relajación son siempre admisibles?","o":["Porque con menos restricciones el óptimo nunca supera al del problema original.","Porque el problema relajado tiene siempre más estados que el original.","Porque su cálculo tiene complejidad O(1).","Porque son consistentes por definición.","Porque coinciden con el coste real del problema original en todo nodo."],"e":["h<sub>relajado</sub>(n) ≤ h*(n).","No es la razón.","El coste de cálculo no garantiza admisibilidad.","No es el argumento del tema.","No coinciden en general."]},{"s":"dis","c":"euclidmanh","q":"En el robot de la cuadrícula, la distancia <b>euclídea</b> surge al relajar…","o":["el movimiento por casillas contiguas, permitiendo ir en línea recta.","solo la presencia de obstáculos, manteniendo los movimientos ortogonales por la cuadrícula.","la restricción de que el coste de cada movimiento sea 1.","la restricción de que el objetivo sea único.","ninguna restricción: es el coste real del problema."],"e":["Ecuación 3.4.","Eso da la distancia Manhattan.","No es la relajación descrita.","No es la relajación descrita.","Es una estimación optimista."]},{"s":"dis","c":"euclidmanh","q":"La distancia <b>Manhattan</b> |i₁ − i₂| + |j₁ − j₂| se obtiene, según el tema, al…","o":["mantener los movimientos ortogonales pero eliminar los obstáculos.","permitir desplazamientos continuos en línea recta por el espacio.","permitir movimientos diagonales con coste 1.","eliminar a la vez obstáculos y movimientos ortogonales.","añadir obstáculos que el problema original no tenía."],"e":["Ecuación 3.5.","Eso da la distancia euclídea.","No es la relajación del tema.","Eso daría la euclídea.","Relajar es quitar restricciones."]},{"s":"dis","c":"dominancia","q":"Dadas dos heurísticas admisibles, h<sub>A</sub> <b>domina</b> a h<sub>B</sub> si…","o":["h<sub>A</sub>(n) ≥ h<sub>B</sub>(n) para todo nodo n.","h<sub>A</sub>(n) ≤ h<sub>B</sub>(n) para todo nodo n.","h<sub>A</sub> es consistente y h<sub>B</sub> no lo es.","h<sub>A</sub> se calcula más rápido que h<sub>B</sub>.","h<sub>A</sub>(n) = h<sub>B</sub>(n) en el objetivo."],"e":["Definición 3.2.4.","La desigualdad está invertida.","La dominancia no se define por la consistencia.","No es la definición.","Ambas valen 0 en el objetivo."]},{"s":"dis","c":"dominancia","q":"Si h₁ domina a h₂ (ambas admisibles), ¿qué cabe esperar de A* según el tema?","o":["Que con h₁ expanda, en general, menos nodos hasta la misma solución.","Que con h₁ encuentre una solución de menor coste total que la que encuentra con h₂.","Que con h₁ pierda la optimalidad por devolver valores mayores.","Que con h₁ expanda más nodos porque evalúa más.","Que ambas expandan exactamente los mismos nodos."],"e":["Valores más altos sin superar h* aportan más información.","Ambas llevan a la misma solución óptima.","Mientras sea admisible no la pierde.","Es al revés.","No es lo que dice el tema."]},{"s":"dis","c":"manhdomina","q":"En entornos cuadriculados, ¿qué relación hay entre Manhattan (h<sub>M</sub>) y euclídea (h<sub>E</sub>)?","o":["h<sub>M</sub> ≥ h<sub>E</sub> siempre: h<sub>M</sub> domina.","h<sub>E</sub> ≥ h<sub>M</sub> siempre, de modo que la euclídea domina.","Ninguna domina a la otra.","h<sub>E</sub> es inadmisible y h<sub>M</sub> es admisible en la cuadrícula.","Son iguales en todos los nodos."],"e":["Incorpora más conocimiento de las restricciones reales.","Es al revés.","El tema afirma que h<sub>M</sub> domina a h<sub>E</sub>.","Ambas son admisibles.","Solo coinciden si el objetivo está en la misma fila o columna."]},{"s":"dis","c":"manhdomina","q":"Para un nodo en (1,1) y meta en (3,3), ¿cuánto valen h<sub>M</sub> y h<sub>E</sub>?","o":["h<sub>M</sub> = 4 y h<sub>E</sub> ≈ 2,83.","h<sub>M</sub> = 2,83 y h<sub>E</sub> = 4.","h<sub>M</sub> = 4 y h<sub>E</sub> = 4.","h<sub>M</sub> = 2 y h<sub>E</sub> = 2.","h<sub>M</sub> = 8 y h<sub>E</sub> ≈ 2,83."],"e":["|1−3| + |1−3| = 4; √(4 + 4) ≈ 2,83.","Están intercambiadas.","La euclídea es menor.","Corresponde a una sola dimensión.","Manhattan suma |Δi| + |Δj| = 4."]},{"s":"dis","c":"maximo","q":"Según el Teorema 3.2.1, si h₁, …, h<sub>k</sub> son admisibles, h<sub>máx</sub>(n) = máx{h₁(n), …, h<sub>k</sub>(n)}…","o":["es admisible y domina a cada una de sus componentes.","es inadmisible porque puede superar a h*.","es admisible pero dominada por la mejor componente.","solo es admisible si todas las h<sub>i</sub> son iguales.","es admisible solo si se divide entre k."],"e":["Si todas son ≤ h*, su máximo también lo es.","Ninguna supera h*, luego el máximo tampoco.","Domina a todas.","No es una condición.","Eso sería un promedio."]},{"s":"dis","c":"maximo","q":"Tres heurísticas admisibles devuelven 4, 7 y 5 en un nodo. ¿Qué valor da la combinación del tema?","o":["7.","16.","5,33.","4.","5."],"e":["h<sub>máx</sub> = máx{4, 7, 5}.","La suma podría sobreestimar y romper la admisibilidad.","Es la media.","Es el mínimo: admisible, pero menos informado.","Es la mediana."]},{"s":"dis","c":"maxcons","q":"¿Qué ocurre con la consistencia al combinar heurísticas consistentes mediante el máximo?","o":["La combinación también es consistente.","Se pierde la consistencia, aunque se mantenga la admisibilidad del resultado.","Solo se conserva si todas valen cero en el objetivo.","Pasa a ser inadmisible.","Solo se conserva si se usan exactamente dos heurísticas."],"e":["Por eso es la estrategia idónea cuando ninguna domina a priori.","El tema dice que se preserva.","Eso lo cumple cualquier heurística.","El máximo de admisibles es admisible.","No hay tal restricción."]},{"s":"dis","c":"maxcons","q":"¿Cuándo recomienda el tema combinar heurísticas mediante el máximo?","o":["Cuando hay varias admisibles y ninguna domina.","Cuando una heurística domina claramente a todas las demás disponibles.","Cuando ninguna heurística es admisible.","Cuando se usa búsqueda ávida en lugar de A*.","Cuando el problema no tiene restricciones."],"e":["P. ej., una precisa cerca de la meta y otra en zonas intermedias.","Entonces bastaría con la dominante.","El teorema parte de heurísticas admisibles.","No es la condición del tema.","No guarda relación."]},{"s":"greedy","c":"fh","q":"¿Cuál es la función de evaluación de la búsqueda ávida?","o":["f(n) = h(n).","f(n) = g(n) + h(n), la suma del coste acumulado y la estimación heurística.","f(n) = g(n), el coste acumulado desde la raíz.","f(n) = g(n) − h(n).","f(n) = máx{g(n), h(n)}."],"e":["Ignora por completo el coste g(n) ya recorrido.","Es la de A*.","Es la de coste uniforme.","No es una función del tema.","No es una función del tema."]},{"s":"greedy","c":"fh","q":"La búsqueda ávida expande siempre el nodo que…","o":["parece estar más cerca de la meta según la heurística.","tiene el menor coste acumulado desde el nodo inicial.","tiene la menor suma de coste acumulado y estimación.","está a menor profundidad en el árbol.","se generó en último lugar."],"e":["Ignora el esfuerzo de llegar a él.","Eso hace UCS.","Eso hace A*.","Eso hace BFS.","Eso hace DFS."]},{"s":"greedy","c":"complej","q":"¿Cuál es la complejidad de la búsqueda ávida en el peor caso, según el tema?","o":["Temporal O(b<sup>m</sup>), como DFS, y espacial también exponencial.","Temporal O(b<sup>m</sup>) y espacial lineal O(b·m), como la búsqueda en profundidad.","Temporal O(b<sup>d</sup>) y espacial O(1).","Temporal lineal O(d) gracias a la heurística.","Temporal O(b<sup>d/2</sup>)."],"e":["Almacena todos los nodos de la frontera.","Guarda toda la frontera: la memoria es exponencial.","No es la del tema.","Solo con heurísticas perfectas se acercaría a lineal.","No es la complejidad de la ávida."]},{"s":"greedy","c":"complej","q":"En el peor caso, el comportamiento temporal de la búsqueda ávida equivale al de…","o":["una búsqueda en profundidad.","una búsqueda en anchura, porque explora el árbol nivel por nivel.","una búsqueda de coste uniforme.","un algoritmo lineal.","Minimax."],"e":["O(b<sup>m</sup>), con m la máxima profundidad.","No explora por niveles.","Esa equivalencia es la de A* con h = 0.","No en el peor caso.","No guarda relación."]},{"s":"greedy","c":"completitud","q":"¿Es completa la búsqueda ávida según el tema?","o":["En general no; con control de repetidos sí, en espacios finitos.","Sí, siempre que la heurística sea admisible, aunque no se controlen repetidos.","Sí, en cualquier espacio, porque la heurística la guía hacia la meta.","No, ni siquiera en espacios finitos con control de repetidos.","Solo si h = 0 en todos los nodos."],"e":["Sin control puede quedar atrapada en ciclos.","La admisibilidad no evita los ciclos.","Puede quedar atrapada en ciclos.","Con control es completa en espacios finitos.","No es la condición."]},{"s":"greedy","c":"completitud","q":"En el Algoritmo 7, ¿para qué sirve el conjunto <code>interiores</code>?","o":["Para controlar ciclos y no reinsertar estados ya expandidos.","Para almacenar la solución parcial que se devuelve al final.","Para ordenar la frontera por h(n).","Para guardar los nodos podados por superar un umbral de f en la iteración.","Para registrar el coste g(n) de cada nodo."],"e":["Hace la búsqueda completa en espacios finitos.","La solución se reconstruye desde el nodo objetivo.","Eso lo hace la cola de prioridad.","Eso es propio de IDA*.","La ávida ignora g(n)."]},{"s":"greedy","c":"optim","q":"¿Por qué la búsqueda ávida no es óptima?","o":["Por ser cortoplacista: una h baja puede llevar a una ruta globalmente más cara.","Porque usa por definición una heurística inadmisible que sobreestima.","Porque explora por niveles y agota la memoria.","Porque nunca llega a la meta en espacios finitos.","Porque expande el nodo de mayor h(n)."],"e":["Ignora el coste ya recorrido.","La heurística puede ser admisible y aun así la ávida no es óptima.","No explora por niveles.","Con control de repetidos es completa.","Expande el de menor h(n)."]},{"s":"greedy","c":"optim","q":"¿Qué pregunta se plantea en la Ficha 2 tras aplicar la búsqueda ávida a ROBI, y cuál es la respuesta teórica general?","o":["Si es óptima; no está garantizado, porque ignora g(n).","Si la trayectoria es óptima; siempre lo es si la heurística es admisible.","Si la búsqueda termina; nunca lo hace cuando hay obstáculos en la cuadrícula.","Si la heurística es consistente; nunca lo es con costes asimétricos.","Si expande más que BFS; siempre expande más."],"e":["La ávida solo optimiza el tramo restante estimado.","La admisibilidad garantiza el óptimo en A*, no en la ávida.","Con control de repetidos termina en espacios finitos.","La de ROBI sí lo es.","No es lo que se deduce en general."]},{"s":"greedy","c":"almeria","q":"¿Qué ilustran juntos los escenarios Almería y Huelva del tema?","o":["Que la ávida puede acertar el óptimo en unos casos y fallar en otros.","Que la búsqueda ávida es óptima con la distancia en línea recta.","Que la distancia en línea recta es una heurística inadmisible.","Que A* y la ávida devuelven siempre la misma ruta.","Que la ávida es incompleta en mapas de carreteras."],"e":["No garantiza la optimalidad.","Huelva muestra que no.","Es una relajación, luego admisible.","En Huelva difieren.","En ambos casos encuentra una ruta."]},{"s":"astar","c":"autores","q":"¿Quiénes diseñaron A* y qué función de evaluación usa?","o":["Hart, Nilsson y Raphael (1968); f(n) = g(n) + h(n).","Korf (1985); f(n) = g(n) + h(n) con un umbral iterativo sobre f.","Newell y Simon (1957); f(n) = h(n).","Dijkstra (1959); f(n) = g(n).","Kirkpatrick, Gelatt y Vecchi (1983); f(n) = e<sup>−ΔE/T</sup>."],"e":["Combina el pasado (g) con el futuro (h).","Korf es el autor de IDA*.","f = h es la ávida.","f = g es coste uniforme (variante de Dijkstra).","Es el recocido simulado (Tema 4)."]},{"s":"astar","c":"autores","q":"En A*, f(n) representa…","o":["la estimación del coste total de la solución que pasa por n.","el coste real del camino recorrido desde el nodo inicial.","la estimación del coste restante desde n hasta la meta.","el número de nodos que quedan por expandir en la frontera.","la profundidad de n en el árbol."],"e":["Suma del coste real hasta n y la estimación restante.","Eso es g(n).","Eso es h(n).","No es f(n).","No es f(n)."]},{"s":"astar","c":"espacio","q":"¿Cuál es, según el tema, la principal limitación de A* en su variante de árbol?","o":["Su complejidad espacial O(b<sup>d</sup>).","Que no es óptima aunque la heurística sea admisible.","Que solo funciona correctamente cuando las acciones tienen costes uniformes.","Que no puede usar heurísticas consistentes.","Que su complejidad temporal es siempre lineal."],"e":["Mucho antes de que el tiempo sea un problema.","Con heurística admisible es óptima.","Funciona con costes arbitrarios positivos.","Sí puede.","En el peor caso es exponencial."]},{"s":"astar","c":"espacio","q":"¿Por qué la memoria de A* en árbol crece de forma exponencial según el tema?","o":["Porque guarda toda la frontera en la cola de prioridad, sin interiores.","Porque recalcula h(n) en cada iteración desde la raíz, como hace la profundización.","Porque usa una pila LIFO de tamaño b·d.","Porque guarda la heurística de todos los estados posibles.","Porque el factor de ramificación aumenta con la profundidad."],"e":["La cola absorbe toda la memoria.","Eso se parece a IDA*.","Eso sería memoria lineal.","No es lo que dice el tema.","No es la razón."]},{"s":"astar","c":"h0","q":"Si en A* se usa la heurística nula h(n) = 0, el algoritmo se comporta como…","o":["una búsqueda de coste uniforme.","una búsqueda ávida.","una búsqueda en profundidad.","Minimax.","IDA*."],"e":["f(n) = g(n); es el peor escenario temporal, O(b<sup>d</sup>).","Con h = 0 la ávida no tendría criterio.","El orden lo da g(n), no la profundidad.","No guarda relación.","IDA* es otro algoritmo, no un caso de A*."]},{"s":"astar","c":"h0","q":"¿Qué escenario asocia el tema con el peor caso temporal de A*?","o":["El uso de una heurística trivial o nula.","El uso de la heurística perfecta h = h*.","El uso de una heurística consistente.","El uso de costes de acción uniformes.","La combinación de heurísticas por el máximo."],"e":["A* degenera en coste uniforme, O(b<sup>d</sup>).","Sería el mejor caso.","Mejora el comportamiento.","No es el peor caso.","Aumenta la información."]},{"s":"astar","c":"error","q":"Según el tema, si el error |h(n) − h*(n)| de la heurística está acotado o es nulo…","o":["su complejidad puede bajar a polinómica o lineal, O(d).","A* pierde la optimalidad por acercarse demasiado al coste real.","A* pasa a ser incompleta en espacios de estados con factor de ramificación finito.","la complejidad espacial pasa a ser O(1).","A* se convierte en búsqueda ávida."],"e":["La complejidad real depende de la precisión de h.","No la pierde.","No se deduce.","No es lo que dice el tema.","Sigue usando g + h."]},{"s":"astar","c":"error","q":"¿De qué depende, según el tema, la complejidad temporal real de A*?","o":["De la precisión de la heurística.","Únicamente del factor de ramificación del problema.","Del número de soluciones óptimas.","Del orden en que se insertan los hijos en la frontera.","De la tasa de evaporación de la feromona."],"e":["Con h = 0 es exponencial; con error acotado, polinómica o lineal.","La precisión de h es determinante.","No es lo que señala el tema.","La cola de prioridad los ordena por f.","Es un parámetro de ACO (Tema 4)."]},{"s":"astar","c":"opteficiente","q":"¿Qué significa que A* sea <b>óptimamente eficiente</b> para una heurística dada?","o":["Que ningún algoritmo completo con la misma información garantiza el óptimo expandiendo menos.","Que expande exactamente d nodos.","Que usa la mínima memoria posible entre todos los algoritmos completos y óptimos.","Que siempre es más rápido que IDA*.","Que encuentra la solución sin evaluar ninguna heurística."],"e":["§3.3.2.","No es la definición.","Su memoria es su principal limitación.","No es lo que dice el tema.","Usa la heurística."]},{"s":"astar","c":"opteficiente","q":"La propiedad de eficiencia óptima de A* se enuncia en el tema…","o":["en búsqueda en árbol y para una heurística dada.","para cualquier heurística, incluso inadmisible, que se use para guiar la búsqueda.","solo para la heurística nula.","comparándolo con algoritmos que usan más información que él.","solo en problemas con costes uniformes."],"e":["Compara con algoritmos completos que comparten la misma información.","Se enuncia para una heurística dada.","No es así.","Se compara con los que comparten la misma información.","No se impone esa condición."]},{"s":"astar","c":"teorema","q":"Según el Teorema 3.3.1, A* aplicado a un árbol de búsqueda garantiza la solución óptima si…","o":["la heurística es admisible.","la heurística domina a la distancia euclídea.","la heurística vale 0 en todos los nodos.","la heurística sobreestima ligeramente el coste.","las acciones tienen coste uniforme."],"e":["Si nunca sobreestima el coste restante.","La dominancia no es la condición del teorema.","Es un caso particular admisible, no la condición general.","Sobreestimar rompe la garantía.","No se exige coste uniforme."]},{"s":"astar","c":"teorema","q":"Una heurística sobreestima el coste en algunos nodos del camino óptimo. ¿Qué puede ocurrir con A* en árbol?","o":["Que devuelva una solución subóptima.","Nada, porque A* siempre es óptimo al tener en cuenta el coste acumulado g(n).","Que se comporte exactamente como coste uniforme.","Que deje de terminar en espacios finitos.","Que reduzca su memoria a lineal."],"e":["El teorema requiere admisibilidad.","La garantía depende de h.","Eso ocurre con h = 0.","No se deduce.","No se deduce."]},{"s":"astar","c":"demo","q":"En la demostración de optimalidad de A*, s₂ es una meta subóptima y n un nodo de la frontera en el camino óptimo. ¿Qué desigualdad se obtiene?","o":["f(n) ≤ f* < f(s₂).","f(s₂) ≤ f* < f(n).","f(n) = f(s₂) = f*.","f(n) ≥ f* ≥ f(s₂).","g(n) > g(s₂)."],"e":["Por eso n se expande antes que s₂.","Está invertida.","s₂ es subóptima: f(s₂) > f*.","Contradice la admisibilidad.","No es la desigualdad usada."]},{"s":"astar","c":"demo","q":"En la demostración, ¿por qué f(s₂) = g(s₂) para la meta subóptima s₂?","o":["Porque h(s₂) = 0 al ser s₂ un estado objetivo.","Porque g(s₂) = 0 al encontrarse s₂ en la raíz del árbol de búsqueda.","Porque la heurística es consistente.","Porque s₂ está en el camino óptimo.","Porque f(s₂) = f* por hipótesis."],"e":["Por definición de heurística.","s₂ no es la raíz.","Basta la definición de heurística.","s₂ es subóptima.","La hipótesis es g(s₂) > f*."]},{"s":"astar","c":"terminacion","q":"Según el tema, ¿termina A* en cuanto genera por primera vez el estado objetivo como hijo?","o":["No: debe extraerlo con la menor f de la frontera.","Sí, porque la heurística vale 0 en el objetivo y ya no puede mejorarse.","Sí, siempre que la heurística sea admisible.","Solo si el objetivo está a profundidad mínima.","No, porque A* no tiene test de objetivo."],"e":["Podría existir una ruta mejor en otra rama.","Generar no basta; hay que extraerlo con la menor f.","Precisamente para la optimalidad no puede parar al generar.","No es el criterio.","Sí lo tiene, al extraer el nodo."]},{"s":"ida","c":"korf","q":"¿Qué limitación de A* pretende mitigar IDA*, propuesto por Richard Korf?","o":["Su complejidad espacial exponencial.","Su falta de optimalidad con heurísticas admisibles.","Su incapacidad para trabajar con costes reales.","Su dependencia de una heurística consistente.","Su complejidad temporal lineal."],"e":["IDA* usa memoria lineal como DFS.","A* ya es óptimo con admisibles.","IDA* empeora precisamente con muchos costes reales distintos.","No es la motivación.","No es una limitación de A*."]},{"s":"ida","c":"korf","q":"¿Cómo gestiona IDA* la exploración en lugar de mantener una frontera explícita?","o":["Con DFS acotadas por un umbral de f, usando la pila del sistema.","Con una cola de prioridad ordenada por h(n) que se vacía en cada iteración.","Con una cola FIFO por niveles de profundidad.","Con un único descenso sin retroceso.","Con una población de soluciones candidatas."],"e":["Cada iteración poda las trayectorias que superan el umbral.","No usa cola de prioridad.","Eso es BFS.","Retrocede y reitera.","Es propio de los AG."]},{"s":"ida","c":"umbral0","q":"¿Con qué valor se inicializa el umbral θ en la primera iteración de IDA*?","o":["Con f(raíz) = h(raíz).","Con cero.","Con infinito.","Con el coste óptimo C*.","Con el máximo valor de h del problema."],"e":["g(raíz) = 0.","Se usa f de la raíz.","∞ indica fallo definitivo.","C* es desconocido a priori.","No es la inicialización."]},{"s":"ida","c":"umbral0","q":"En BÚSQUEDA_ACOTADA de IDA*, ¿cuándo se interrumpe una trayectoria?","o":["Cuando f(n) supera el umbral θ vigente.","Cuando la profundidad del nodo supera un límite L que se incrementa de uno en uno.","Cuando h(n) supera a g(n).","Cuando el nodo ya está en la lista de cerrados.","Cuando g(n) supera el umbral."],"e":["Ecuación 3.10.","Eso es IDDFS.","No es la condición.","No es la poda de IDA*.","Se compara f, no solo g."]},{"s":"ida","c":"actualiza","q":"Si una iteración de IDA* termina sin encontrar el objetivo, el nuevo umbral es…","o":["el mínimo f de los nodos podados en esa iteración.","el máximo f de los nodos podados en esa iteración.","el umbral anterior más 1.","el doble del umbral anterior.","el f del último nodo expandido."],"e":["θ<sub>siguiente</sub> = mín{f(n) | f(n) > θ}.","Saltaría niveles y comprometería el óptimo.","Eso se parece a IDDFS con costes unitarios.","No es la regla.","No es la regla."]},{"s":"ida","c":"actualiza","q":"En una iteración de IDA* con θ = 10 se podan nodos con f = 14, 12 y 17. ¿Cuál es el siguiente umbral?","o":["12.","17.","11.","14.","10."],"e":["El mínimo de los f que excedieron el umbral.","Es el máximo.","No se incrementa en una unidad.","No es el mínimo.","El umbral debe crecer."]},{"s":"ida","c":"fallo","q":"¿Cuándo devuelve IDA* un fallo definitivo?","o":["Cuando el siguiente umbral vale ∞: el árbol se ha agotado.","Cuando el umbral supera por primera vez el valor heurístico de la raíz del árbol.","Cuando se repite un estado.","Tras d + 1 iteraciones.","Cuando la pila del sistema se desborda."],"e":["Algoritmo 9.","Ocurre ya en la segunda iteración.","IDA* en árbol no lo comprueba.","No hay un número fijo.","No es el criterio del algoritmo."]},{"s":"ida","c":"fallo","q":"¿Qué garantiza el incremento selectivo del umbral en IDA*?","o":["No explorar más de lo necesario: se avanza por curvas de nivel de f.","Que cada iteración expanda exactamente el doble de nodos.","Que nunca se regeneren nodos ya expandidos en iteraciones anteriores del algoritmo.","Que el algoritmo termine en una sola iteración.","Que la memoria sea constante."],"e":["La búsqueda crece de forma concéntrica en f.","No es lo que garantiza.","Sí se regeneran.","Normalmente requiere varias.","Es lineal, no constante."]},{"s":"ida","c":"espacio","q":"¿Cuál es la complejidad espacial de IDA*?","o":["O(b·d).","O(b<sup>d</sup>), como A*, porque mantiene la frontera.","O(1).","O(b<sup>d/2</sup>).","O(d²)."],"e":["Lineal: solo retiene la trayectoria actual.","IDA* no mantiene frontera explícita.","No es constante.","No es la del tema.","No es la del tema."]},{"s":"ida","c":"espacio","q":"Frente a A*, la mayor virtud de IDA* es…","o":["transformar el requisito exponencial de memoria en uno lineal.","expandir siempre menos nodos que A*, gracias a la regeneración del árbol.","no necesitar heurística.","garantizar tiempo polinómico.","evitar por completo la reexpansión de nodos."],"e":["§3.3.3.","Puede expandir más por las reexpansiones.","Usa la heurística.","El peor caso sigue siendo exponencial.","Reexpande en cada iteración."]},{"s":"ida","c":"costes","q":"¿En qué tipo de problemas sufre IDA* una severa penalización temporal según el tema?","o":["En los que hay muchos costes reales distintos.","En los que todas las acciones tienen coste unitario, como en el robot de la cuadrícula.","En los que la heurística es consistente.","En los que el factor de ramificación es 2.","En los juegos de suma cero."],"e":["El umbral crece poco y hacen falta muchísimas iteraciones.","Ahí alcanza su máxima eficiencia.","No es la causa.","No es la causa.","No se aplica a juegos."]},{"s":"ida","c":"costes","q":"¿Dónde alcanza IDA* su máxima eficiencia temporal según el tema?","o":["Donde los costes son discretos o uniformes.","Donde los costes son reales, continuos y muy dispersos entre sí.","Donde la heurística sobreestima.","Donde el árbol es infinito.","Donde hay un adversario."],"e":["El umbral avanza en saltos significativos.","Ahí se penaliza.","Perdería la optimalidad.","No es el criterio.","No guarda relación."]},{"s":"ida","c":"optimo","q":"Con heurística admisible, ¿qué propiedades hereda IDA* de A*?","o":["Completitud y optimalidad.","Solo la completitud; la optimalidad se pierde por ser en profundidad.","Solo la complejidad espacial exponencial.","Solo la optimalidad, pero no la completitud.","Ninguna."],"e":["Con b finito y costes mayores que un umbral positivo.","Los contornos crecientes garantizan el óptimo.","IDA* tiene memoria lineal.","Es completo bajo las condiciones del tema.","Hereda ambas."]},{"s":"ida","c":"optimo","q":"¿Por qué la naturaleza en profundidad de IDA* no le lleva a soluciones subóptimas?","o":["Porque sus contornos de f son mínimos y crecientes.","Porque ordena los hijos por coste uniforme.","Porque compara todas las soluciones encontradas al final de cada iteración.","Porque usa una cola de prioridad global.","Porque nunca poda nodos."],"e":["La primera solución hallada tiene el menor coste.","No es el mecanismo.","No las compara.","No la usa.","Sí poda por umbral."]},{"s":"juego","c":"tupla","q":"¿Cuántos elementos tiene la tupla con la que el tema define un juego combinatorio entre dos agentes?","o":["Seis: (S, s₀, A, Jugador, Resultado, Utilidad).","Tres: estados, acciones y utilidad, como en un CSP.","Cuatro: estados, inicial, acciones y objetivo.","Cinco: (S, A, Jugador, Resultado, Utilidad).","Siete, incluyendo la función de evaluación heurística."],"e":["Ecuación 3.12.","El tema define una tupla de seis.","Faltan Jugador, Resultado y Utilidad.","Falta el estado inicial s₀.","La función heurística no forma parte de la tupla."]},{"s":"juego","c":"tupla","q":"En la tupla del juego, ¿qué hace la función <b>Resultado</b>?","o":["Define el estado s' tras aplicar una acción legal a en s.","Asigna el valor numérico final a los estados terminales.","Determina a qué jugador le toca mover.","Indica el subconjunto de acciones legales en cada estado.","Decide si la partida ha terminado."],"e":["Es la función de transición o modelo dinámico.","Eso es la Utilidad.","Eso es la función Jugador.","Eso es A(s).","Los terminales son S<sub>T</sub>."]},{"s":"juego","c":"sumacero","q":"Un juego es de <b>suma cero</b> si…","o":["lo que gana un jugador lo pierde el otro: U<sub>Max</sub> = −U<sub>Min</sub>.","ambos jugadores obtienen siempre utilidad cero.","el juego termina siempre en empate.","no hay elementos de azar.","la suma de las utilidades de todos los estados terminales del juego es exactamente cero."],"e":["Basta optimizar una única utilidad desde Max.","No es la definición.","No es la definición.","Eso es información perfecta.","La condición es por estado terminal, no global."]},{"s":"juego","c":"sumacero","q":"¿Qué simplificación algorítmica permite la estructura de suma cero?","o":["Optimizar una única utilidad desde la perspectiva de Max.","Prescindir de los estados terminales.","Usar búsqueda ávida en lugar de Minimax para elegir la jugada de cada turno.","Ignorar el turno de Min.","Garantizar el empate."],"e":["§3.4.1.","Siguen siendo necesarios.","No es la simplificación.","Min sigue jugando.","No lo garantiza."]},{"s":"juego","c":"infoperfecta","q":"¿Cuál de estos juegos NO es de información perfecta según el tema?","o":["El póker.","El ajedrez.","Las damas.","El Go.","Un juego determinista con tablero visible para ambos."],"e":["Tiene información oculta.","Es de información perfecta.","Es de información perfecta.","Es de información perfecta.","Cumple la definición."]},{"s":"juego","c":"infoperfecta","q":"En un juego de información perfecta…","o":["ambos ven todo el estado y no interviene el azar.","un jugador conoce el estado y el otro no.","las utilidades de ambos jugadores suman cero en cada estado terminal del juego.","las transiciones dependen de un dado.","el número de estados es finito."],"e":["Ejemplos: ajedrez, damas y Go.","Eso sería información imperfecta.","Eso es suma cero, otra propiedad.","No interviene el azar.","No es la definición."]},{"s":"juego","c":"racional","q":"¿Qué establece el Postulado de Racionalidad Perfecta que fundamenta Minimax?","o":["Que cada agente elige siempre la transición que maximiza su utilidad.","Que el rival comete errores aleatorios que Max puede explotar.","Que Max debe elegir al azar entre jugadas de igual valor.","Que ambos jugadores cooperan para maximizar la utilidad conjunta de la partida.","Que la función de evaluación es exacta."],"e":["Con capacidad de cómputo ideal.","Se supone que el rival no comete errores.","No es el postulado.","Los intereses son opuestos.","No es el postulado."]},{"s":"juego","c":"racional","q":"Si la estrategia de Max asegura la victoria contra un oponente perfecto, ¿qué ocurre ante un rival real de menor nivel?","o":["Que un error del rival solo puede favorecer a Max.","Que la estrategia deja de ser válida.","Que Max debe recalcular su estrategia con búsqueda ávida en cada turno del rival.","Que el juego deja de ser de suma cero.","Que el resultado se vuelve aleatorio."],"e":["Es la consecuencia del postulado de racionalidad.","Sigue siendo válida.","No es necesario.","No cambia la naturaleza del juego.","No se deduce."]},{"s":"minimax","c":"induccion","q":"¿Sobre qué principio descansa la arquitectura conceptual de Minimax?","o":["La inducción hacia atrás (backward induction).","La relajación de restricciones del problema.","La selección proporcional a la aptitud.","La estigmergia.","El enfriamiento progresivo."],"e":["Los valores se propagan desde las hojas a la raíz.","Es una técnica de diseño de heurísticas.","Es propia de los AG.","Es propia de ACO.","Es propio del recocido simulado."]},{"s":"minimax","c":"induccion","q":"Según el tema, Minimax traza la estrategia óptima para Max bajo la premisa de que…","o":["Min intentará siempre destruir los beneficios de Max.","Min elegirá sus jugadas al azar.","Min cooperará con Max.","Max conoce de antemano todas las jugadas que va a realizar Min durante la partida.","Min usará una heurística distinta."],"e":["Es el postulado de racionalidad aplicado.","Se supone racional.","Los intereses son opuestos.","No las conoce; las anticipa.","No es la premisa."]},{"s":"minimax","c":"ajedrez","q":"Según el tema, con b = 35 y unos 100 turnos, el árbol de juego del ajedrez tiene aproximadamente…","o":["10¹⁵⁴ nodos.","3.500 nodos, el producto del factor por el número de turnos.","10¹⁰⁰ nodos.","35² nodos.","10³⁵ nodos."],"e":["35¹⁰⁰ ≈ 10¹⁵⁴.","Es b·m, no b<sup>m</sup>.","35¹⁰⁰ es mucho mayor que 10¹⁰⁰.","No corresponde.","No corresponde."]},{"s":"minimax","c":"ajedrez","q":"¿Qué solución adopta Minimax ante el tamaño del árbol de juego en dominios reales?","o":["Fijar un horizonte m y evaluar las hojas con f(s).","Explorar el árbol completo hasta los terminales con una máquina suficientemente potente.","Elegir jugadas al azar más allá de cierta profundidad.","Sustituirlo por búsqueda ávida.","Jugar solo las aperturas conocidas."],"e":["Las posiciones del límite se convierten en hojas provisionales.","El tema lo descarta.","No es la solución.","No es la solución.","No es lo que describe el tema."]},{"s":"minimax","c":"horizonte","q":"En Minimax con horizonte, un valor de f(s) que tiende a +∞ indica…","o":["victoria o ventaja relevante para Max.","una victoria o ventaja significativa para el jugador Min.","un empate técnico.","que la posición es terminal.","que hay que ampliar el horizonte."],"e":["−∞ indicaría ventaja de Min.","Eso indica −∞.","No es lo que indica.","No necesariamente.","No es su significado."]},{"s":"minimax","c":"horizonte","q":"Según el tema, el horizonte finito en Minimax…","o":["mantiene la completitud, pero solo optimiza dentro del subárbol acotado.","garantiza obtener la estrategia globalmente óptima del juego completo hasta el final.","provoca bucles infinitos por movimientos repetitivos.","hace que la complejidad temporal sea lineal.","elimina la necesidad de una función heurística."],"e":["Depende críticamente de la exactitud de f(s).","Solo es óptima dentro del subárbol de profundidad m.","Al contrario, los evita.","Sigue siendo O(b<sup>m</sup>).","La hace necesaria en las hojas."]},{"s":"minimax","c":"complej","q":"¿Cuáles son las complejidades de Minimax con horizonte m?","o":["Temporal O(b<sup>m</sup>) y espacial O(b·m).","Temporal O(b<sup>m/2</sup>) y espacial O(b).","Temporal O(b<sup>m</sup>) y espacial O(b<sup>m</sup>).","Temporal O(b·m) y espacial O(1).","Temporal O(m) y espacial O(b)."],"e":["Explora todo el árbol en profundidad.","O(b<sup>m/2</sup>) es alfa-beta con orden ideal.","La memoria es lineal.","El tiempo es exponencial.","No es la del tema."]},{"s":"minimax","c":"complej","q":"¿Por qué la memoria de Minimax es lineal?","o":["Porque, como una DFS, solo guarda la trayectoria activa y sus hermanos.","Porque solo evalúa las hojas del horizonte.","Porque poda la mitad del árbol.","Porque almacena una tabla con todos los estados visitados para no repetirlos nunca.","Porque usa una cola FIFO."],"e":["O(b·m).","Evaluar hojas no explica la memoria.","Minimax no poda.","Eso no sería lineal.","Usa recursión en profundidad."]},{"s":"minimax","c":"fases","q":"En la fase descendente de Minimax, ¿qué hacen los nodos intermedios?","o":["Quedan en espera sin evaluarse y ceden el control al nivel inferior.","Calculan su valor con la función heurística antes de bajar al siguiente nivel del árbol.","Podan a los hermanos de menor valor.","Fijan su valor definitivo en −∞.","Eligen la acción de forma aleatoria."],"e":["La evaluación nace en las hojas.","Solo se evalúan las hojas.","Minimax no poda.","−∞ es la inicialización del valor temporal en MAX en la fase ascendente.","No es así."]},{"s":"minimax","c":"fases","q":"¿Cuándo se convierte en definitivo el valor temporal v de un nodo intermedio en Minimax?","o":["Cuando ha explorado todas sus ramificaciones.","Cuando recibe el valor del primer hijo.","Cuando su valor temporal supera por primera vez el valor de su nodo padre.","Cuando alcanza el horizonte m.","Cuando el adversario decide su jugada."],"e":["Entonces se transmite a su ancestro.","Es solo provisional.","No es el criterio en Minimax.","Eso convierte al nodo en hoja.","No es el criterio."]},{"s":"minimax","c":"ejemplo","q":"En Minimax, un nodo MIN tiene tres hijos MAX con valores 6, 3 y 8. ¿Qué valor devuelve?","o":["3.","8.","17.","5,67.","6."],"e":["MIN toma el mínimo de sus hijos.","Es el máximo.","Es la suma.","Es la media.","Es el primer hijo."]},{"s":"ab","c":"def","q":"¿Qué garantiza la poda alfa-beta respecto a Minimax?","o":["El mismo valor en la raíz, examinando menos nodos.","Un valor mejor en la raíz, explorando más profundidad con los mismos recursos.","Un valor aproximado a cambio de mucha menos memoria.","Que siempre se poda la mitad del árbol.","Que la memoria pase a ser constante."],"e":["Elimina subárboles irrelevantes sin alterar el veredicto final.","El valor es idéntico.","No es aproximado.","Depende del ordenamiento.","Sigue siendo O(b·m)."]},{"s":"ab","c":"def","q":"En alfa-beta, ¿qué representan α y β?","o":["α: lo mejor hallado por un MAX; β: lo mejor (más bajo) hallado por un MIN.","α: probabilidad de mutación por gen; β: probabilidad de cruce de cada pareja de padres.","α: coste acumulado; β: coste estimado restante.","α: valor de Min; β: valor de Max.","α: profundidad; β: factor de ramificación."],"e":["α empieza en −∞ y β en +∞.","Son parámetros de AG.","Son g y h.","Están intercambiados.","No son esos parámetros."]},{"s":"ab","c":"podamax","q":"Según la regla de la trayectoria, se poda en un nodo MAX cuando…","o":["su α<sub>local</sub> alcanza o supera el β de un ancestro MIN.","su α<sub>local</sub> se vuelve menor que el β de algún ancestro MIN.","su α<sub>local</sub> supera al α de algún ancestro MAX situado en la trayectoria hacia la raíz.","recibe el primer valor de un hijo.","su valor es menor que el de su hermano."],"e":["El ancestro MIN nunca permitiría esa ruta.","Es la situación normal, sin poda.","La comparación es con ancestros de tipo opuesto.","No basta.","No es la regla."]},{"s":"ab","c":"podamax","q":"Un nodo MAX con un ancestro MIN cuyo β = 5 obtiene de su primer hijo el valor 7. ¿Qué ocurre?","o":["Se podan sus hijos restantes, porque 7 ≥ 5.","Sigue explorando para comprobar si algún hijo supera 7.","Devuelve 5 al ancestro.","Actualiza β a 7.","Reinicia la búsqueda."],"e":["El MIN de arriba ya tiene una opción de 5.","El ancestro MIN ya no elegirá esta rama.","Devuelve su α<sub>local</sub>.","β no puede aumentar.","No."]},{"s":"ab","c":"podamin","q":"Se activa la poda en un nodo MIN cuando…","o":["su β<sub>local</sub> es ≤ que el α de un ancestro MAX.","su β<sub>local</sub> supera el α de algún ancestro MAX.","su β<sub>local</sub> es menor que el β de algún ancestro MIN situado en el camino hacia la raíz.","todos sus hijos tienen el mismo valor.","alcanza el horizonte m."],"e":["El ancestro MAX ya tiene una alternativa mejor.","Es la situación normal, sin poda.","Se compara con ancestros MAX.","No es la regla.","Eso lo convierte en hoja."]},{"s":"ab","c":"podamin","q":"La raíz MAX ya tiene asegurada una jugada de valor 3. Al explorar otro hijo MIN, su primer hijo devuelve 2. ¿Qué sucede?","o":["Se poda el resto de hijos de ese MIN, pues valdrá ≤ 2 < 3.","Se exploran los demás hijos por si alguno vale más de 3.","El MIN devuelve 3 a la raíz.","La raíz cambia su α a 2.","Se poda el subárbol que ya valía 3."],"e":["Es la tercera poda del ejemplo del tema.","MIN solo puede bajar su valor.","Devuelve su β<sub>local</sub> ≤ 2.","α no disminuye.","Ese ya está evaluado."]},{"s":"ab","c":"ideal","q":"Con un ordenamiento óptimo de los sucesores, la complejidad temporal de alfa-beta es…","o":["O(b<sup>m/2</sup>).","O(b<sup>3m/4</sup>).","O(b<sup>m</sup>).","O(b·m).","O(log b<sup>m</sup>)."],"e":["La raíz cuadrada del coste de Minimax.","Es el caso promedio.","Es el peor caso.","Es la complejidad espacial.","No es la del tema."]},{"s":"ab","c":"ideal","q":"Con ordenamiento óptimo, ¿qué permite alfa-beta frente a Minimax con los mismos recursos?","o":["Explorar el doble de profundidad (2m).","Explorar cuatro veces más profundidad.","Explorar la misma profundidad en la mitad de memoria.","Garantizar la victoria.","Prescindir de la función de evaluación."],"e":["Porque O(b<sup>m/2</sup>) equivale a √(b<sup>m</sup>).","No es lo que afirma el tema.","La memoria es igual.","No garantiza la victoria.","Sigue siendo necesaria."]},{"s":"ab","c":"orden","q":"¿Qué significa en el tema que el árbol esté «perfectamente ordenado» para alfa-beta?","o":["Ascendentes bajo MIN y descendentes bajo MAX: mejor jugada primero.","Hijos descendentes bajo MIN y ascendentes bajo MAX, con la peor jugada en primer lugar.","Todos los hijos con el mismo valor.","Hijos ordenados alfabéticamente por acción.","Hijos en orden aleatorio."],"e":["La poda se activa de inmediato.","Es el peor caso.","No es la definición.","No es la definición.","Es el caso promedio."]},{"s":"ab","c":"orden","q":"Bajo un nodo MAX, los hijos se evalúan en orden 2, 5, 9 (de peor a mejor para Max). Según el tema, esto corresponde al…","o":["peor caso para la poda.","caso ideal, porque los valores crecen.","caso promedio.","caso en que no hace falta función de evaluación.","caso que reduce la memoria a O(1)."],"e":["Bajo MAX en orden creciente nunca se cruzan los umbrales.","El ideal pone la mejor jugada primero.","El promedio es orden aleatorio.","No guarda relación.","La memoria no depende del orden."]},{"s":"ab","c":"promedio","q":"Con un ordenamiento aleatorio de las acciones, ¿qué complejidad da el tema para alfa-beta?","o":["O(b<sup>3m/4</sup>).","O(b<sup>m/2</sup>).","O(b<sup>m</sup>).","O(b<sup>m/4</sup>).","O(b·m)."],"e":["Caso promedio con factores de ramificación moderados o altos.","Es el caso ideal.","Es el peor caso.","No es la del tema.","Es la espacial."]},{"s":"ab","c":"promedio","q":"¿Por qué en el caso promedio alfa-beta no alcanza O(b<sup>m/2</sup>)?","o":["Porque con orden aleatorio solo hay podas intermitentes.","Porque con un orden aleatorio no llega a producirse ninguna poda en todo el árbol.","Porque la memoria crece exponencialmente.","Porque se pierde la optimalidad del valor de la raíz.","Porque necesita reiniciar la búsqueda."],"e":["§3.4.3.","Hay podas intermitentes.","La memoria es lineal en todos los casos.","La optimalidad se preserva siempre.","No."]},{"s":"ab","c":"peor","q":"En el peor caso (ordenamiento inverso), ¿qué complejidad temporal tiene alfa-beta?","o":["O(b<sup>m</sup>), igual que Minimax.","O(b<sup>3m/4</sup>).","O(b<sup>m/2</sup>).","O(b<sup>2m</sup>), peor que Minimax.","O(b·m)."],"e":["No se cruzan los umbrales y se inspeccionan todas las hojas.","Es el caso promedio.","Es el caso ideal.","No empeora a Minimax.","Es la espacial."]},{"s":"ab","c":"peor","q":"¿Qué ordenación provoca el peor caso de alfa-beta según el tema?","o":["Hijos descendentes bajo MIN y crecientes bajo MAX.","Ascendentes bajo MIN y descendentes bajo MAX.","Hijos aleatorios en ambos tipos de nodo.","Hijos con el mismo valor.","Un único hijo por nodo."],"e":["Las peores jugadas se evalúan primero.","Es el caso ideal.","Es el caso promedio.","No es lo que describe el tema.","No es el caso descrito."]},{"s":"ab","c":"espacio","q":"¿Cómo afecta el ordenamiento de las jugadas a la complejidad espacial de alfa-beta?","o":["No le afecta: es siempre lineal, O(b·m).","Con orden ideal pasa a O(b<sup>m/2</sup>) y con el peor a O(b<sup>m</sup>), como el tiempo.","Con orden aleatorio pasa a ser exponencial.","Con orden inverso pasa a ser constante.","Con orden ideal se reduce a O(1)."],"e":["Solo almacena la trayectoria activa y los hermanos pendientes.","Eso describe el tiempo, no la memoria.","Sigue siendo lineal.","No es así.","No es así."]},{"s":"ab","c":"espacio","q":"Frente a Minimax, la poda alfa-beta en cuanto a memoria…","o":["conserva la misma eficiencia lineal O(b·m).","necesita memoria exponencial para guardar α y β de todos los nodos.","reduce la memoria a la mitad.","necesita una cola de prioridad.","necesita almacenar los nodos podados."],"e":["Ambos se basan en DFS limitada.","Solo pasa las cotas como parámetros.","No es lo que afirma el tema.","No la usa.","No los almacena."]},{"s":"ab","c":"preserva","q":"En la demostración del tema, T₁ vale 3 y el primer hijo del MIN T₂ vale 2. ¿Por qué puede podarse el resto de T₂?","o":["Porque V(T₂) ≤ 2 < 3: la raíz elegirá T₁ igualmente.","Porque los hermanos restantes de T₂ siempre valen menos que 2 en cualquier árbol de juego.","Porque T₂ vale exactamente 2.","Porque la raíz es de tipo MIN.","Porque 2 > 3 en el orden de evaluación."],"e":["V(r) = máx(3, V(T₂)) = 3.","No se sabe; da igual cuánto valgan.","Solo se sabe que vale como máximo 2.","La raíz es MAX.","No es así."]},{"s":"ab","c":"preserva","q":"¿Qué afirma el tema sobre la optimalidad de la poda alfa-beta?","o":["Que preserva la optimalidad de Minimax.","Que la pierde a cambio de velocidad.","Que solo la conserva con orden ideal.","Que la mejora respecto a Minimax.","Que depende de la tasa de poda."],"e":["Las ramas podadas son irrelevantes para el valor de la raíz.","No la pierde.","La conserva en todos los casos.","El valor es el mismo.","No depende."]}]},"4":{"n":4,"nombre":"Optimización y metaheurísticas","secs":{"opt":["Conceptos fundamentales de la optimización","Tema 4 §4.1–4.1.1"],"pais":["El paisaje de soluciones","Tema 4 §4.1.2"],"meta":["Metaheurísticas y su taxonomía","Tema 4 §4.1.3–4.1.4"],"local":["Mecánica de la búsqueda local","Tema 4 §4.2.1"],"hc":["Ascensión de colinas (Hill Climbing)","Tema 4 §4.2.2 y Tabla 4.1"],"sa":["Recocido simulado (Simulated Annealing)","Tema 4 §4.2.3 y Tabla 4.2"],"ga":["Algoritmos genéticos: esquema básico","Tema 4 §4.3.1"],"gop":["Operadores genéticos","Tema 4 §4.3.1 (Operadores genéticos)"],"gej":["Ejemplo de algoritmo genético","Tema 4 §4.3.1 (Tablas 4.3–4.7)"],"aco":["Optimización por colonia de hormigas (ACO)","Tema 4 §4.3.2 y Tablas 4.8–4.10"]},"qs":[{"s":"opt","c":"camino","q":"¿Qué diferencia fundamental señala el tema entre los problemas de optimización pura y los resueltos con A* o Minimax?","o":["En optimización el camino carece de valor: solo importa la configuración final.","En optimización se busca la secuencia de acciones de menor coste desde el estado inicial.","En optimización siempre se garantiza el óptimo global en tiempo polinómico.","En optimización no existe una función que evalúe la calidad de las soluciones.","En optimización hay siempre un adversario que minimiza la utilidad."],"e":["Lo que cuenta es la calidad intrínseca de la solución.","Eso es lo que hacen A* y la búsqueda clásica.","Las metaheurísticas no garantizan el óptimo global.","La función objetivo es imprescindible.","Eso es la búsqueda adversaria."]},{"s":"opt","c":"camino","q":"En el diseño de un horario o de un microchip, según el tema, ¿qué interesa realmente?","o":["La calidad de la configuración final.","El orden exacto de los pasos intermedios que se siguieron para construir la solución.","El número de nodos generados por el algoritmo durante la búsqueda del óptimo.","La profundidad del árbol de búsqueda en la que se encuentra la solución.","El camino de menor coste entre la configuración inicial y la final."],"e":["No importa el orden de los pasos intermedios.","El tema dice que ese orden no importa.","No es lo que interesa del problema.","No hay un árbol de caminos relevante.","El camino carece de valor operativo."]},{"s":"opt","c":"componentes","q":"¿Cuáles son los tres componentes esenciales de un problema de optimización según §4.1.1?","o":["Espacio de soluciones S, función objetivo f(s) y función de vecindario N(s).","Estado inicial, acciones aplicables y test de objetivo del problema.","Variables, dominios y restricciones, como en un problema de satisfacción.","Población, operador de cruce y operador de mutación.","Feromona, visibilidad y tasa de evaporación."],"e":["Con ellos se formaliza cualquier problema de optimización.","Es la formalización de la búsqueda clásica (Tema 2).","Es la terna de un CSP.","Son componentes de un AG, no de cualquier problema.","Son elementos de ACO."]},{"s":"opt","c":"componentes","q":"La función de vecindario N : S → P(S) define…","o":["qué soluciones son vecinas de s mediante una pequeña modificación local.","el valor que la función objetivo asigna a cada configuración.","el conjunto universal de todas las configuraciones posibles del sistema.","la probabilidad de aceptar un estado peor en función de la temperatura.","la secuencia de estados recorrida por el algoritmo."],"e":["Por ejemplo, conmutar un bit o intercambiar dos elementos.","Eso es la función objetivo f.","Eso es el espacio S.","Es el criterio del recocido.","Eso es la trayectoria."]},{"s":"opt","c":"costeapt","q":"Según el tema, ¿cómo se denomina la función objetivo cuando el problema es de <b>minimización</b>?","o":["Función de coste o energía.","Función de aptitud o fitness, propia de los problemas de maximización del rendimiento.","Función de utilidad, como en los agentes que maximizan la satisfacción esperada.","Función de vecindario, que define la topología del espacio de soluciones.","Función de visibilidad, por analogía con la colonia de hormigas."],"e":["Se busca reducir pérdidas, distancias o recursos.","Se usa cuando se maximiza.","También se asocia a maximizar.","Es otro componente del problema.","Es un término de ACO."]},{"s":"opt","c":"costeapt","q":"Un problema busca maximizar el rendimiento de una línea de producción. ¿Cómo llamaría el tema a su función objetivo?","o":["Función de aptitud o utilidad.","Función de coste o energía.","Función de vecindario.","Función heurística admisible.","Función de transición."],"e":["Se usa al maximizar eficiencia, ganancia o rendimiento.","Esa denominación es para minimizar.","El vecindario define la topología, no la calidad.","Es un concepto del Tema 3.","No es la denominación del tema."]},{"s":"opt","c":"vecindario","q":"Al representar soluciones como cadenas de 5 bits, ¿qué vecindario usa el tema en sus ejemplos de búsqueda local?","o":["Conmutar aleatoriamente uno de los cinco bits.","Intercambiar las dos mitades de la cadena de bits y evaluar el resultado.","Sumar o restar una unidad al número decimal representado por la cadena.","Cruzar la cadena con otra de la población.","Invertir todos los bits a la vez."],"e":["Así se genera cada sucesor en la ascensión de colinas y el recocido.","No es el vecindario de los ejemplos.","No es el vecindario del tema.","Es el cruce de los AG.","Sería un salto lejano, no un vecino local."]},{"s":"opt","c":"vecindario","q":"¿Qué expresa, en general, el problema de optimización global que formaliza el tema?","o":["máx f(s) o mín f(s) sobre s ∈ S.","El camino de menor coste entre un estado inicial y un estado objetivo del espacio.","Una asignación completa y consistente de las variables del problema.","El valor minimax del nodo raíz de un árbol de juego.","La heurística que domina a todas las demás."],"e":["Ecuación 4.1.","Es un problema de búsqueda de caminos.","Es la solución de un CSP.","Es búsqueda adversaria.","Es un concepto del Tema 3."]},{"s":"pais","c":"paisaje","q":"¿Qué es el <b>paisaje de soluciones</b> (fitness landscape)?","o":["La proyección de f(s) sobre la topología de N(s).","El conjunto de los óptimos globales del problema.","El árbol de búsqueda que genera A*.","La tabla con el rastro de feromona de las aristas.","La secuencia de temperaturas del recocido."],"e":["Se visualiza como un relieve de valles, laderas y cumbres.","Es mucho más que el conjunto de óptimos.","Es un concepto de optimización, no de A*.","Es la memoria de ACO.","Es la agenda de enfriamiento."]},{"s":"pais","c":"paisaje","q":"¿De qué depende la eficiencia de cualquier estrategia de optimización según §4.1.2?","o":["De la complejidad topológica del paisaje.","Exclusivamente del número de bits que se utilizan para codificar cada solución candidata.","De que la función objetivo sea siempre lineal y derivable en todo el espacio.","Del número de adversarios.","De que exista una única solución."],"e":["Óptimos locales, mesetas y crestas dificultan la navegación.","La codificación influye, pero el tema destaca la topología.","No es la condición.","No hay adversarios.","No es lo que señala el tema."]},{"s":"pais","c":"local","q":"¿Por qué los algoritmos basados exclusivamente en mejoras codiciosas quedan atrapados en un <b>óptimo local</b>?","o":["Porque, una vez alcanzado, no detectan vecinos que mejoren.","Porque el óptimo local es peor que todos sus vecinos.","Porque su memoria se agota al llegar a la cima.","Porque la temperatura es demasiado alta.","Porque la función de vecindario está vacía en ese punto."],"e":["La cima es mejor que sus vecinos, pero peor que el global.","Es al revés: es mejor que sus vecinos.","La búsqueda local usa memoria constante.","La temperatura es del recocido, que precisamente escapa de óptimos locales.","El vecindario no está vacío."]},{"s":"pais","c":"local","q":"Un óptimo local, según el tema, es una cima…","o":["mejor que sus vecinos pero peor que el global.","superior al máximo global pero inferior a un vecino.","igual a todos sus vecinos: una región plana.","situada en una pendiente no alineada con los ejes.","que coincide siempre con el óptimo global."],"e":["Definición de §4.1.2.","El máximo global es el mayor valor posible.","Eso es una meseta.","Eso describe una cresta.","No coincide."]},{"s":"pais","c":"meseta","q":"En una <b>meseta</b> o planicie del paisaje, ¿qué le ocurre a la búsqueda?","o":["Sin gradiente, degenera en un paseo aleatorio.","Avanza en zig-zag porque ajusta un elemento cada vez.","Se detiene en una cima inferior al máximo global.","Alcanza siempre el óptimo global.","Aumenta la temperatura automáticamente."],"e":["La función no oscila (o lo hace por debajo de la precisión).","Eso ocurre en una cresta.","Eso es un óptimo local.","No es lo que ocurre.","No guarda relación."]},{"s":"pais","c":"cresta","q":"¿Qué son las <b>crestas</b> del paisaje de soluciones y qué efecto tienen?","o":["Máximos locales en pendiente no alineada con los ejes: obligan a avanzar en zig-zag.","Regiones planas en las que la función objetivo no varía y la búsqueda se desorienta.","La configuración que rinde el valor máximo absoluto de todo el espacio.","Zonas donde se evapora la feromona.","Saltos aleatorios del reinicio."],"e":["Sobre todo si solo se ajusta un elemento del estado a la vez.","Eso describe una meseta.","Eso es el óptimo global.","Es un concepto de ACO.","No es su definición."]},{"s":"pais","c":"meseta","q":"¿Qué variante de la ascensión de colinas está pensada específicamente para atravesar mesetas?","o":["La selección aleatoria en igualdad.","El reinicio aleatorio, que abandona la meseta y empieza desde un punto nuevo del espacio.","La aceptación probabilística de empeoramientos según la distribución de Boltzmann.","El cruce uniforme, que mezcla bits de dos soluciones al azar.","El refuerzo de feromona en las aristas más transitadas."],"e":["Permite pasos laterales hasta encontrar una ladera con gradiente.","Ayuda ante óptimos locales, pero no está pensada para cruzar mesetas.","Es el recocido simulado.","Es un operador genético.","Es propio de ACO."]},{"s":"pais","c":"cresta","q":"Un algoritmo que solo modifica un elemento del estado por paso se encuentra con una cresta. Según el tema…","o":["avanzará en un zig-zag extremadamente lento.","la recorrerá en línea recta y alcanzará la cima en muy pocos pasos.","se detendrá inmediatamente al detectar que todos los vecinos tienen el mismo valor.","saltará al óptimo global.","perderá la memoria de la solución actual."],"e":["La cresta no está alineada con los ejes de cambio.","No puede seguirla en línea recta.","Eso describe una meseta.","No.","No."]},{"s":"meta","c":"def","q":"Según el tema, una <b>metaheurística</b> es…","o":["un algoritmo para hallar soluciones suficientemente buenas cuando los métodos exactos son inviables.","un algoritmo exacto que garantiza el óptimo global en problemas de explosión combinatoria.","una heurística admisible que nunca sobreestima el coste real hasta la meta.","un método que solo funciona en un problema específico.","un algoritmo de búsqueda ciega."],"e":["Combina heurísticas locales con estrategias de alto nivel.","Renuncian a esa garantía.","Es un concepto del Tema 3.","Son de propósito general.","No es la definición."]},{"s":"meta","c":"def","q":"¿Cuándo resultan especialmente útiles las metaheurísticas según el tema?","o":["Cuando los métodos exactos sufren explosión combinatoria y son inviables en tiempo.","Cuando el problema es pequeño y puede enumerarse exhaustivamente en pocos segundos.","Cuando hay que demostrar formalmente que la solución es el óptimo global.","Solo en juegos de suma cero.","Solo cuando el paisaje no tiene óptimos locales."],"e":["§4.1.3.","Entonces bastaría un método exacto.","No ofrecen esa garantía.","No es su ámbito.","Al contrario, ayudan ante esas trampas."]},{"s":"meta","c":"caracteristicas","q":"¿Cuál NO es una de las características fundamentales de las metaheurísticas según el tema?","o":["La garantía de encontrar siempre el óptimo global absoluto.","Su propósito general, como plantillas adaptables redefiniendo S y f(s).","La aproximación: ofrecen soluciones casi óptimas bajo restricciones de tiempo.","La inspiración frecuente en sistemas complejos de la naturaleza.","Su robustez para dar soluciones de alta calidad sin explorar todo el espacio."],"e":["Sí es la respuesta: el tema habla de aproximación y no-garantía.","Es una característica.","Es una característica.","Es una característica.","Forma parte de la característica de aproximación."]},{"s":"meta","c":"caracteristicas","q":"¿Qué fenómenos naturales cita el tema como inspiración de las metaheurísticas?","o":["Evolución, enjambres, termodinámica y dinámicas sociales.","Exclusivamente la evolución biológica.","La relajación de problemas y la dominancia.","El razonamiento silogístico y la lógica formal.","La propiedad de Markov y la observabilidad."],"e":["§4.1.3.","Hay más inspiraciones.","Son técnicas de diseño de heurísticas.","No se citan.","No se citan."]},{"s":"meta","c":"taxonomia","q":"La ascensión de colinas y el recocido simulado son metaheurísticas…","o":["basadas en trayectorias (monopoblacionales).","basadas en poblaciones (multipoblacionales), porque comparan varios vecinos.","no inspiradas en la naturaleza, ambas por igual.","de búsqueda adversaria.","de búsqueda ciega sistemática."],"e":["Gestionan una única solución candidata en cada iteración.","Comparar vecinos no las hace poblacionales.","El recocido se inspira en la metalurgia.","No lo son.","No lo son."]},{"s":"meta","c":"taxonomia","q":"¿Qué caracteriza a las metaheurísticas <b>basadas en poblaciones</b>?","o":["Manipulan simultáneamente un conjunto de soluciones que cooperan o compiten.","Gestionan una única solución y trazan una trayectoria por el paisaje.","Usan siempre una función de temperatura que decrece con las iteraciones.","Garantizan el óptimo global por usar muchas soluciones a la vez.","Requieren memoria constante O(1)."],"e":["Ejemplos: algoritmos genéticos y colonia de hormigas.","Eso son las basadas en trayectorias.","Es propio del recocido.","No lo garantizan.","Mantienen una población, no O(1)."]},{"s":"meta","c":"inspiradas","q":"La distinción entre metaheurísticas inspiradas y no inspiradas en la naturaleza se basa en…","o":["su origen: analogías naturales o principios matemáticos.","el número de soluciones que gestionan en cada iteración del algoritmo.","si garantizan o no la convergencia al óptimo global del problema.","el tipo de codificación de las soluciones.","si usan o no aleatoriedad."],"e":["§4.1.4.","Eso es trayectoria frente a población.","No es el criterio.","No es el criterio.","No es el criterio."]},{"s":"meta","c":"inspiradas","q":"El recocido simulado y la colonia de hormigas son, respectivamente, ejemplos de inspiración…","o":["física (termodinámica) y biológica (enjambre).","biológica (evolución genética) y física (metalurgia del temple).","social y matemática.","matemática abstracta en ambos casos.","evolutiva en ambos casos."],"e":["Ambos son métodos inspirados en la naturaleza.","Están intercambiadas y mal atribuidas.","No corresponde.","Ambos tienen analogías naturales explícitas.","No corresponde."]},{"s":"meta","c":"explexp","q":"En una metaheurística, la <b>exploración</b> (diversificación) es…","o":["llevar la búsqueda a regiones nuevas y distantes del paisaje.","concentrar el esfuerzo en la vecindad inmediata de las mejores zonas ya descubiertas.","almacenar todas las soluciones visitadas para no repetirlas.","reducir la temperatura en cada iteración.","seleccionar siempre al individuo más apto."],"e":["Previene la convergencia prematura.","Eso es la explotación.","No es la definición.","Favorece la explotación.","Aumenta la explotación."]},{"s":"meta","c":"explexp","q":"¿Qué fuerza favorece un recocido simulado con temperatura muy baja?","o":["La explotación (intensificación).","La exploración, porque acepta casi cualquier empeoramiento propuesto por el vecindario.","El reinicio aleatorio del estado inicial cada vez que se alcanza un óptimo local.","La diversidad genética de la población.","La estigmergia."],"e":["Se comporta de forma codiciosa sobre la vecindad.","Eso ocurre con temperatura alta.","No es propio del recocido.","No hay población.","Es propia de ACO."]},{"s":"local","c":"memoria","q":"¿Qué consumo de memoria tienen los algoritmos de búsqueda local según el tema?","o":["Constante, O(1).","Lineal en la profundidad, O(b·d), como la búsqueda en profundidad iterativa.","Exponencial, O(b<sup>d</sup>), porque deben almacenar todos los vecinos generados hasta el momento.","Proporcional al tamaño de la población.","Proporcional al número de aristas del grafo."],"e":["Mantienen una única solución activa y descartan el camino.","No guardan trayectoria.","No almacenan los vecinos pasados.","No usan población.","No es la del tema."]},{"s":"local","c":"memoria","q":"La búsqueda local, en cada iteración, inspecciona…","o":["solo el vecindario directo de la única solución activa.","toda la población de soluciones y combina las mejores para formar nuevos candidatos.","todos los estados del espacio, como una enumeración exhaustiva.","la frontera completa ordenada por f.","las aristas con más feromona."],"e":["Explota el entorno inmediato de s.","Eso hace un AG.","No es exhaustiva.","Eso es A*.","Eso es ACO."]},{"s":"local","c":"parada","q":"¿Cuándo se detienen los métodos de búsqueda local según §4.2.1?","o":["Al agotar el tiempo de cómputo o tras un número fijo de iteraciones sin mejora.","Solo cuando han demostrado que la solución es el óptimo global.","Cuando la frontera de búsqueda queda completamente vacía.","Cuando todas las hormigas siguen el mismo camino.","Cuando la población converge a un único individuo."],"e":["Buscan una solución casi óptima en plazo.","No pueden demostrarlo.","No mantienen frontera.","Es un criterio de convergencia de ACO.","Es propio de los AG."]},{"s":"local","c":"parada","q":"¿Por qué la búsqueda local es idónea en entornos con restricciones críticas de hardware?","o":["Porque usa memoria constante al descartar los caminos.","Porque garantiza el óptimo global con un número de iteraciones conocido de antemano.","Porque no necesita función objetivo para comparar.","Porque explora el espacio por niveles.","Porque usa una pila de tamaño b·d."],"e":["Y es útil en espacios de soluciones masivos.","No lo garantiza.","La necesita.","No explora por niveles.","No usa pila."]},{"s":"hc","c":"mecanica","q":"En la ascensión de colinas del tema, si varios vecinos empatan como mejores…","o":["se elige uno de ellos al azar.","se elige el primero generado según el orden de las acciones del problema.","el algoritmo se detiene porque no puede decidir hacia dónde ascender.","se aceptan todos y se continúa en paralelo.","se aplica la probabilidad de Boltzmann."],"e":["§4.2.2.","El tema indica selección aleatoria.","No se detiene por empate.","Mantiene una sola solución.","Eso es el recocido."]},{"s":"hc","c":"mecanica","q":"En el Algoritmo 12, ¿qué condición hace que la ascensión de colinas termine?","o":["Que el mejor vecino sea peor que el estado actual.","Que el mejor vecino sea igual que el estado actual, sin mejorarlo estrictamente.","Que la temperatura llegue a cero tras el último enfriamiento.","Que la población converja.","Que se alcance la profundidad máxima."],"e":["Si es mejor o igual, pasa a ser el nuevo estado actual.","Con igualdad continúa (paso lateral).","Es la condición del recocido.","No hay población.","No hay profundidad."]},{"s":"hc","c":"limitaciones","q":"¿A qué se deben, según el tema, las limitaciones de la ascensión de colinas?","o":["A decidir a corto plazo y no tener backtracking.","A su consumo de memoria exponencial.","A que acepta demasiados movimientos que empeoran la solución.","A que necesita una población muy grande.","A que requiere una heurística admisible."],"e":["Por eso le afectan cimas, planicies y crestas.","Su memoria es constante.","Eso hace el recocido, no la ascensión de colinas.","No usa población.","No es un requisito."]},{"s":"hc","c":"limitaciones","q":"¿Qué tres estructuras topográficas condicionan la eficacia de la ascensión de colinas?","o":["Cimas (óptimos locales), planicies y crestas.","Nodos, aristas y caminos del grafo que representa el espacio de soluciones.","Población inicial, operador de cruce y operador de mutación.","Temperatura, enfriamiento y congelación.","Feromona, visibilidad y evaporación."],"e":["§4.2.2, en referencia a §4.1.2.","No son estructuras del paisaje.","Son elementos de un AG.","Son conceptos del recocido.","Son conceptos de ACO."]},{"s":"hc","c":"lateral","q":"¿Qué permite la variante de <b>selección aleatoria en igualdad</b>?","o":["Dar «pasos laterales» para cruzar una meseta.","Aceptar estados peores con una probabilidad que decrece según la temperatura del sistema.","Reiniciar el algoritmo desde un punto aleatorio del espacio al quedar estancado.","Limitar el número total de iteraciones.","Cruzar la solución con otra."],"e":["Si el mejor vecino iguala al actual, se escoge un sucesor al azar.","Es el recocido simulado.","Es el reinicio aleatorio.","Es el límite de iteraciones.","Es un operador genético."]},{"s":"hc","c":"lateral","q":"¿Qué riesgo combate la variante de <b>límite de iteraciones</b>?","o":["Que se convierta en un paseo aleatorio por las planicies.","Que se acepten demasiados empeoramientos con T alta.","Que la población converja prematuramente.","Que la memoria se agote.","Que la feromona se evapore."],"e":["Fuerza la salida tras un número máximo de pasos para que el paseo por planicies extensas no se vuelva un bucle infinito.","Es un problema del recocido mal ajustado.","Es un problema de los AG.","La memoria es constante.","No guarda relación."]},{"s":"hc","c":"reinicio","q":"¿En qué consiste el <b>reinicio aleatorio</b> (Random-Restart)?","o":["Guardar el óptimo local y volver a empezar desde un punto aleatorio.","Aceptar un vecino peor con probabilidad e<sup>−ΔE/T</sup>.","Sustituir la población sin mirar la aptitud.","Volver al último punto de decisión y probar otra rama del árbol.","Aumentar la temperatura tras cada iteración."],"e":["Aumenta la probabilidad de soluciones globalmente satisfactorias.","Es el recocido.","Es el reemplazamiento generacional de un AG.","Es backtracking, que la ascensión de colinas no tiene.","No es la variante."]},{"s":"hc","c":"reinicio","q":"Según el tema, el reinicio aleatorio, a pesar de su simplicidad…","o":["aumenta pronto la probabilidad de soluciones globalmente buenas.","garantiza encontrar el óptimo global en exactamente una iteración del bucle principal.","convierte la ascensión de colinas en un algoritmo con memoria exponencial.","elimina por completo los óptimos locales del paisaje.","solo funciona con funciones lineales."],"e":["§4.2.2: tras un número reducido de iteraciones aumenta la probabilidad de converger a soluciones globalmente satisfactorias.","No lo garantiza.","Solo guarda los óptimos locales.","No cambia el paisaje.","No es una restricción."]},{"s":"hc","c":"traza","q":"En la Tabla 4.1, el estado final x = 2 (f = 7) no es el mínimo global. ¿Por qué se detiene ahí el algoritmo?","o":["Porque sus dos sucesores aleatorios (10 y 6) no mejoran.","Porque x = 2 es el mínimo global de f dentro del intervalo [0, 31] de los naturales.","Porque ninguno de los cinco vecinos de 00010 mejora.","Porque la temperatura llegó a cero.","Porque se alcanzó el límite de iteraciones."],"e":["El vecino 0 (00000), que sí mejora, no llegó a generarse.","f(1) = −2 y f(0) = −1 son menores.","Conmutar el bit 4 da 0, con f(0) = −1 < 7.","No hay temperatura en la ascensión de colinas.","El criterio es f(s) ≥ f(x)."]},{"s":"sa","c":"analogia","q":"¿Por qué se llama «recocido simulado» este algoritmo?","o":["Por analogía con el recocido metalúrgico: calentar y enfriar lentamente un sólido.","Por analogía con la evolución biológica, que combina y muta genes.","Por analogía con las colonias de hormigas que depositan feromona al moverse.","Porque simula el cálculo de Leibniz.","Porque recalcula la heurística en cada iteración."],"e":["Así el sistema alcanza configuraciones de mínima energía.","Esa es la analogía de los AG.","Es la analogía de ACO.","No guarda relación.","No es el origen del nombre."]},{"s":"sa","c":"analogia","q":"En el recocido metalúrgico, ¿qué efecto tiene la temperatura inicial elevada?","o":["Da a los átomos movilidad para salir de mínimos locales.","Fija los átomos en su primera configuración.","Destruye toda estructura estable para siempre.","Reduce la energía térmica de los átomos.","No tiene efecto sobre la estructura."],"e":["Al enfriar, el sistema se estabiliza en mínima energía.","Es al revés: aporta movilidad.","El enfriamiento lento la recupera.","La aumenta.","Sí lo tiene."]},{"s":"sa","c":"autores","q":"¿Quiénes propusieron de forma independiente el recocido simulado según el tema?","o":["Kirkpatrick, Gelatt y Vecchi (1983) y Černý (1985).","John Henry Holland en la década de 1970, junto con sus primeros algoritmos genéticos.","Hart, Nilsson y Raphael en 1968, como variante de A*.","Richard Korf.","Dorigo y colaboradores."],"e":["§4.2.3.","Holland es el padre de los AG.","Son los autores de A*.","Es el autor de IDA*.","No aparecen como autores del recocido en el tema."]},{"s":"sa","c":"autores","q":"¿Qué renuncia asume el recocido simulado frente a la enumeración exhaustiva, según el tema?","o":["La garantía teórica de convergencia exacta.","La posibilidad de evaluar la función objetivo en cada uno de los estados visitados.","El uso de cualquier tipo de aleatoriedad en la elección de los vecinos.","La memoria constante.","El uso de un vecindario."],"e":["A cambio, halla soluciones de alta calidad en un tiempo dado.","Evalúa cada estado propuesto.","Es intrínsecamente aleatorio.","Mantiene una sola solución.","Usa vecindario."]},{"s":"sa","c":"aceptacion","q":"En un problema de minimización, si el vecino propuesto tiene ΔE = f(s) − f(x) < 0, el recocido…","o":["lo acepta con probabilidad 1.","lo acepta con probabilidad e<sup>−ΔE/T</sup>, que depende de la temperatura del momento.","lo rechaza, porque solo acepta movimientos que empeoran para escapar de óptimos.","lo acepta solo si la temperatura es alta.","reinicia desde un punto aleatorio."],"e":["Es un movimiento favorable.","Esa probabilidad se aplica cuando ΔE > 0.","Acepta siempre las mejoras.","La aceptación es incondicional.","No reinicia."]},{"s":"sa","c":"aceptacion","q":"Para un empeoramiento (ΔE > 0), la probabilidad de aceptación del recocido es…","o":["P = e<sup>−ΔE/T</sup>.","P = e<sup>ΔE/T</sup>, que crece con el tamaño del empeoramiento propuesto.","P = ΔE/T, una proporción lineal entre el empeoramiento y la temperatura.","P = 1 − T/ΔE, que se anula cuando la temperatura iguala al empeoramiento.","P = 0 siempre, porque nunca se acepta un empeoramiento."],"e":["Distribución de Boltzmann (ecuación 4.3).","El signo es negativo.","No es la fórmula.","No es la fórmula.","Entonces sería ascensión de colinas."]},{"s":"sa","c":"temperatura","q":"Con temperatura T muy elevada, ¿qué ocurre con la probabilidad de aceptar empeoramientos?","o":["Tiende a 1: fase de exploración.","Tiende a 0, de modo que el algoritmo se comporta de forma puramente codiciosa.","Vale exactamente 0,5 para cualquier ΔE positivo.","Depende solo de ΔE.","Se anula y el algoritmo se detiene."],"e":["El exponente −ΔE/T se acerca a 0.","Eso ocurre cuando T → 0.","Depende de ΔE y T.","Depende también de T.","No se anula."]},{"s":"sa","c":"temperatura","q":"A medida que T converge hacia cero, el recocido…","o":["se comporta de forma codiciosa: fase de explotación.","acepta casi cualquier empeoramiento y explora el paisaje de forma cuasi aleatoria.","reinicia el estado actual en una posición aleatoria.","pasa a mantener una población de soluciones.","aumenta su consumo de memoria."],"e":["La probabilidad de aceptar empeoramientos decae exponencialmente.","Eso ocurre con T alta.","No reinicia.","Sigue siendo de trayectoria.","No cambia."]},{"s":"sa","c":"enfriamiento","q":"¿Qué dos esquemas de enfriamiento cita el tema como más extendidos?","o":["El lineal T<sub>t+1</sub> = T<sub>t</sub> − 1 y el geométrico T = e<sup>−iter</sup>·T₀.","El aleatorio, que sortea T en cada paso, y el constante, que mantiene T fija.","El logarítmico T = T₀ / log(iter) y el cuadrático T = T₀ − iter².","El de Boltzmann y el de Metropolis.","El de evaporación (1 − ρ)τ y el de depósito Q/L."],"e":["Ecuaciones 4.4 y 4.5.","No son los del tema.","No aparecen en el tema.","Son criterios de aceptación, no de enfriamiento.","Son de ACO."]},{"s":"sa","c":"enfriamiento","q":"¿Qué destaca el tema sobre el rendimiento del recocido respecto al esquema de enfriamiento?","o":["Que es muy sensible a él y requiere ajustes empíricos.","Que el esquema de enfriamiento elegido no influye en absoluto en el resultado final.","Que solo el esquema lineal garantiza el óptimo global.","Que el esquema debe aumentar T con las iteraciones.","Que el enfriamiento solo afecta a la memoria."],"e":["Mediante experimentación.","Es al revés.","No lo afirma.","T debe disminuir.","Afecta a la exploración/explotación."]},{"s":"sa","c":"ejcalculo","q":"En la Tabla 4.2, con T = 50 se propone pasar de 16 a 18 (ΔE = +68). ¿Qué probabilidad de aceptación resulta?","o":["≈ 25,6 %, y se acepta (exploración).","≈ 1,36 %, y se rechaza porque el empeoramiento es demasiado grande para la temperatura.","100 %, porque con temperatura alta se aceptan todos los empeoramientos propuestos.","≈ 0,16 %, y se rechaza por estar ya en la fase de explotación.","≈ 28,6 %, y se acepta como un ligero empeoramiento."],"e":["e<sup>−68/50</sup> = e<sup>−1,36</sup> ≈ 0,256.","1,36 es el exponente, no la probabilidad.","La probabilidad es menor que 1.","Es la probabilidad de otro paso de la tabla (T = 5).","Es la del paso T = 4 con ΔE = +5."]},{"s":"sa","c":"ejcalculo","q":"En la Tabla 4.2, con T = 4 el estado 2 propone pasar a 3 (ΔE = +5). ¿Qué ocurre?","o":["P ≈ 28,6 % y se acepta un ligero empeoramiento.","P ≈ 0,16 % y se rechaza, porque en fases tardías no se admite ningún empeoramiento.","P = 1 y se acepta, porque toda transición desde un estado par a uno impar mejora.","P ≈ 25,6 % y se acepta.","P = 0 y el sistema se congela."],"e":["e<sup>−5/4</sup> ≈ 0,286.","Esa es la del paso T = 5 con ΔE = +32.","ΔE = +5 es un empeoramiento.","Es la del paso T = 50.","Aún no se congela."]},{"s":"ga","c":"holland","q":"¿Quién y cuándo introdujo los algoritmos genéticos según el tema?","o":["John Henry Holland, en la década de 1970.","Kirkpatrick, Gelatt y Vecchi en 1983, a partir del recocido de metales.","Hart, Nilsson y Raphael en 1968, como extensión de la búsqueda heurística.","Alan Turing en 1950.","McCulloch y Pitts en 1943."],"e":["§4.3.1.","Son autores del recocido.","Son autores de A*.","No es el autor.","Son autores del modelo neuronal."]},{"s":"ga","c":"holland","q":"¿En qué se inspiran los algoritmos genéticos según el tema?","o":["En la base genético-molecular de la evolución biológica.","En el proceso metalúrgico de calentamiento y enfriamiento controlado de materiales.","En las hormigas que buscan el camino más corto.","En la lógica silogística.","En la teoría de juegos de suma cero."],"e":["Mutación, recombinación y supervivencia de los más aptos.","Es el recocido.","Es ACO.","No.","No."]},{"s":"ga","c":"genotipo","q":"En un AG, el <b>genotipo</b> o cromosoma es…","o":["la cadena que codifica una solución candidata.","la solución candidata decodificada, sobre la que se evalúa la aptitud del individuo.","la función de aptitud que mide la calidad de cada individuo de la población.","la población completa de una generación.","el operador que combina dos padres."],"e":["El fenotipo es la solución que representa.","Eso es el fenotipo.","Es otro componente.","La población es el conjunto de individuos.","Es el cruce."]},{"s":"ga","c":"genotipo","q":"En el ejemplo del tema, la cadena 11010 y el número 26 son, respectivamente…","o":["genotipo y fenotipo.","fenotipo y genotipo, porque el número es la representación interna del individuo.","aptitud y fenotipo, ya que la aptitud se expresa en binario.","máscara de cruce y descendiente.","población y generación."],"e":["La cadena codifica; el número es la solución representada.","Están intercambiados.","La aptitud sería 676.","No.","No."]},{"s":"ga","c":"componentes","q":"¿Qué dos componentes esenciales requiere modelar un problema con un AG?","o":["La codificación (cromosomas) y la función de aptitud.","La temperatura inicial del sistema y el esquema de enfriamiento empleado.","La matriz de feromona y la de visibilidad.","Una heurística admisible y una cola de prioridad.","Un horizonte y una función de evaluación."],"e":["§4.3.1.","Son del recocido.","Son de ACO.","Son de A*.","Son de Minimax."]},{"s":"ga","c":"componentes","q":"¿Sobre qué se evalúa la función de aptitud en un AG según el tema?","o":["Sobre el fenotipo.","Directamente sobre la cadena de bits, sin decodificarla, contando el número de unos.","Sobre el operador de cruce utilizado para generar a cada uno de los descendientes.","Sobre la máscara binaria.","Sobre la tasa de mutación."],"e":["Cuantifica la bondad de la solución representada.","Se evalúa sobre la solución que representa.","No.","No.","No."]},{"s":"ga","c":"flujo","q":"¿Qué orden siguen las fases del bucle evolutivo de un AG canónico según el tema?","o":["Selección → cruce y mutación → evaluación → reemplazo.","Mutación → selección → reemplazo → cruce, repitiendo el ciclo en cada generación.","Reemplazo → evaluación → selección → cruce.","Evaporación → depósito → transición.","Enfriamiento → aceptación → perturbación."],"e":["Tras inicializar y evaluar la población.","No es el orden del tema.","No es el orden.","Son fases de ACO.","Son fases del recocido."]},{"s":"ga","c":"flujo","q":"¿Por qué la población inicial de un AG debe tener suficiente diversidad?","o":["Para cubrir un amplio espectro del espacio y prevenir la convergencia prematura.","Para que la función de aptitud pueda calcularse en un tiempo constante O(1).","Para garantizar que el cruce dé siempre hijos mejores que los padres.","Para reducir la tasa de mutación a cero.","Para eliminar la fase de selección."],"e":["§4.3.1.","No es la razón.","No lo garantiza.","No.","No."]},{"s":"ga","c":"pseudo","q":"En el Algoritmo 14, ¿cuándo se detiene el ciclo reproductivo interno de cada generación?","o":["Cuando los hijos igualan el tamaño de la población.","Cuando surge un individuo mejor que todos los demás.","Cuando la temperatura baja de un umbral fijado.","Cuando todos los padres han sido seleccionados una vez.","Cuando la mutación no altera ningún bit."],"e":["Se generan hijos de dos en dos.","No es la condición.","Es del recocido.","No es la condición.","No es la condición."]},{"s":"ga","c":"pseudo","q":"En el
