onocimiento.","No es una de las ventajas listadas para los SBC.","Es un pilar ético."]},{"s":"sbc","c":"modularidad","q":"¿Cuál NO es una de las tres ventajas del enfoque basado en conocimiento que enumera el tema?","o":["Garantía de encontrar siempre la solución óptima.","Modularidad e independencia del motor de inferencia.","Mantenibilidad gracias al almacenamiento declarativo.","Transparencia para explicar la cadena de deducciones.","Posibilidad de intercambiar la base de conocimiento sin reprogramar el motor."],"e":["Sí es la respuesta: el tema lista modularidad, mantenibilidad y transparencia, no optimalidad.","Es una de las tres ventajas.","Es una de las tres ventajas.","Es una de las tres ventajas.","Forma parte de la ventaja de modularidad."]},{"s":"sbc","c":"mant-transp","q":"¿Por qué el conocimiento de un SBC es más fácil de actualizar que en sistemas donde conocimiento e inferencia están entrelazados?","o":["Porque es declarativo: cambiarlo no obliga a reprogramar la lógica.","Porque el motor de inferencia se reescribe automáticamente con cada cambio introducido.","Porque los SBC no tienen reglas de negocio.","Porque se entrenan de nuevo con cada cambio.","Porque usan un número constante de reglas."],"e":["Es la ventaja de mantenibilidad.","El motor no cambia; cambia la BC.","Sí las tienen, en la BC.","El tema no describe reentrenamiento.","No es la razón."]},{"s":"sbc","c":"mant-transp","q":"La ventaja de <b>transparencia</b> de los SBC consiste en que…","o":["el sistema puede explicar su cadena de deducciones.","el código fuente del motor es público.","la base de conocimiento no contiene heurísticas.","el sistema no necesita interfaz de usuario.","el motor puede reutilizarse en otros dominios sin reprogramarlo."],"e":["La separación BC/motor facilita las explicaciones.","No es el sentido del tema.","Sí puede contenerlas.","No tiene relación.","Eso es la modularidad."]}]},"2":{"n":2,"nombre":"Estrategias básicas de búsqueda","secs":{"form":["Formalización de un problema de búsqueda","Tema 2 §2.2"],"carac":["Características y complejidad del problema","Tema 2 §2.2.1–2.2.2"],"crit":["Búsqueda no informada y criterios de evaluación","Tema 2 §2.3"],"bfs":["Búsqueda en anchura (BFS)","Tema 2 §2.3.1"],"dfs":["Búsqueda en profundidad (DFS)","Tema 2 §2.3.2"],"iddfs":["Búsqueda en profundidad iterativa (IDDFS)","Tema 2 §2.3.3"],"ucs":["Búsqueda de coste uniforme (UCS)","Tema 2 §2.3.4"],"robot":["Caso de estudio: el robot y la habitación","Tema 2 §2.4 y Ficha de trabajo 1"],"csp":["Problemas de satisfacción de restricciones (CSP)","Tema 2 §2.5–2.5.1"],"grafo":["Grafo de restricciones y k-coloración","Tema 2 §2.5.2–2.5.3"],"alg":["Generación y prueba frente a vuelta atrás","Tema 2 §2.5.4"],"heurcsp":["Heurísticas de selección en backtracking","Tema 2 §2.5.5"]},"qs":[{"s":"form","c":"solucion","q":"Según la formalización del tema, una <b>solución</b> de un problema de búsqueda es…","o":["una secuencia de acciones desde el estado inicial hasta un estado objetivo.","el estado objetivo, con independencia del camino seguido para alcanzarlo desde el inicio.","el conjunto de todos los estados alcanzables desde el estado inicial mediante acciones.","el árbol completo que resulta de aplicar todas las acciones de forma recursiva.","el valor numérico asociado a cada paso del camino recorrido."],"e":["Definición de §2.2; su coste lo mide la función de coste.","El estado objetivo es la meta; la solución es el camino de acciones hasta ella.","Eso es el espacio de estados.","Eso es el árbol de búsqueda.","Eso es la función de coste."]},{"s":"form","c":"solucion","q":"¿Qué componente de la formalización es imprescindible para decidir si una solución es <b>óptima</b>?","o":["La función de coste.","El conjunto de acciones disponibles para el agente en cada estado.","La representación del estado inicial del que parte la búsqueda.","El factor de ramificación efectivo del espacio de estados.","La propiedad de observabilidad del entorno."],"e":["Asigna un valor a cada paso; la solución óptima es la de menor coste acumulado.","Las acciones generan sucesores, pero no permiten comparar soluciones entre sí.","El estado inicial es necesario, pero no mide la calidad de una solución.","Mide el tamaño del espacio, no la calidad de la solución.","Es un requisito para aplicar estas técnicas, no un criterio de optimalidad."]},{"s":"form","c":"espacio","q":"El <b>espacio de estados</b> se define en el tema como…","o":["el conjunto de estados alcanzables desde el inicial con cualquier secuencia de acciones.","la lista de nodos generados que aún están pendientes de expansión.","la secuencia de acciones que conduce al objetivo.","la estructura jerárquica resultante de aplicar las acciones de forma recursiva.","el subconjunto de estados que cumplen la condición objetivo."],"e":["Definición literal de §2.2.","Eso es la frontera.","Eso es la solución.","Eso es el árbol de búsqueda; puede repetir estados.","Son los estados objetivo, no el espacio completo."]},{"s":"form","c":"espacio","q":"¿Cómo denomina el tema a la estructura que resulta de aplicar todas las acciones posibles de forma recursiva desde el estado inicial?","o":["Árbol de búsqueda.","Espacio de soluciones o de configuración.","Grafo de restricciones.","Función de vecindario.","Paisaje de soluciones."],"e":["§2.2: en él puede distinguirse el camino solución del resto del espacio explorado.","Ese término pertenece a la optimización (Tema 4).","Es la representación de un CSP binario.","Es un concepto de búsqueda local (Tema 4).","Es la proyección de la función objetivo sobre el vecindario (Tema 4)."]},{"s":"form","c":"acciones","q":"En la formalización del tema, ¿qué hace cada <b>acción</b>?","o":["Transforma un estado en un estado sucesor.","Asigna un valor numérico de coste a cada estado alcanzado.","Comprueba si el estado actual satisface la condición objetivo.","Selecciona el siguiente nodo de la frontera que se va a expandir.","Define la configuración que el agente intenta alcanzar."],"e":["Las acciones son las operaciones disponibles para el agente.","Es la función de coste, que se asocia a los pasos del camino.","Es el test de objetivo, no una acción.","Es la estrategia de búsqueda, no una acción del problema.","Es el estado objetivo."]},{"s":"form","c":"acciones","q":"¿Qué se entiende por <b>estados sucesores</b> en §2.2?","o":["Los nuevos escenarios generados al aplicar acciones sobre un estado.","Los estados ya explorados que se guardan en la lista de cerrados.","Los estados objetivo alternativos de un mismo problema.","Los estados que violan alguna restricción del problema.","Los nodos que se encuentran a la máxima profundidad del árbol."],"e":["Su expansión iterativa da lugar al espacio de búsqueda.","Esos son los estados explorados, no sus sucesores.","No es la definición de sucesor.","Serían estados no válidos.","Esos serían nodos hoja, no necesariamente sucesores."]},{"s":"carac","c":"propiedades","q":"¿Qué dos propiedades debe cumplir un problema para tratarse con las técnicas de este tema?","o":["Determinismo y observabilidad.","Continuidad del espacio de estados y existencia de varios agentes que cooperan.","Que todas las acciones tengan el mismo coste y una única solución posible.","Que exista una heurística admisible y un factor de ramificación constante.","Suma cero e información perfecta."],"e":["Cada acción produce un único sucesor conocido y el agente sabe en qué estado está.","El tema exige lo contrario: estados discretos y un único agente que conoce su estado.","El coste uniforme es condición de optimalidad de BFS, no un requisito general.","Las heurísticas son materia del Tema 3; la búsqueda ciega no las requiere.","Son requisitos de la búsqueda adversaria (Tema 3)."]},{"s":"carac","c":"propiedades","q":"Según §2.2.1, la propiedad de <b>determinismo</b> exige que…","o":["toda acción aplicada a un estado produzca un único sucesor conocido.","el agente tenga acceso a toda la información relevante de su estado.","el algoritmo de búsqueda devuelva siempre la misma solución.","el número de sucesores sea el mismo para todos los estados.","el estado objetivo sea único."],"e":["No existe incertidumbre en la transición.","Eso es la observabilidad.","La propiedad se refiere al problema, no al algoritmo.","Eso sería un factor de ramificación constante.","No es lo que define el determinismo."]},{"s":"carac","c":"befectivo","q":"Si el número de sucesores varía entre estados, el tema usa el <b>factor de ramificación efectivo</b>. ¿Cómo se calcula con m estados y un único estado final?","o":["Sumando los sucesores de los estados no finales y dividiendo entre m − 1.","Dividiendo los nodos del árbol entre la profundidad de la solución.","Tomando el máximo número de sucesores de cualquier estado.","Sumando los sucesores de los m estados y dividiendo entre m.","Elevando el número de estados a la inversa de la profundidad."],"e":["Ecuación 2.1: media de sucesores por nodo, excluido el estado final.","No es la fórmula del tema.","Eso sería el factor máximo, no el efectivo (una media).","El estado final no se expande; por eso se divide entre m − 1.","No corresponde a la ecuación 2.1."]},{"s":"carac","c":"befectivo","q":"En un espacio de 5 estados (uno de ellos final) cuyos estados no finales tienen 2, 3, 3 y 4 sucesores, el factor de ramificación efectivo vale…","o":["3.","2,4.","4.","12.","3,5."],"e":["(2 + 3 + 3 + 4) / (5 − 1) = 12/4 = 3.","Resulta de dividir 12 entre 5; el estado final no se cuenta en el denominador.","Es el máximo número de sucesores, no la media.","Es la suma de sucesores sin dividir.","No se obtiene con la ecuación 2.1."]},{"s":"carac","c":"nnodos","q":"¿Cuántos nodos tiene un árbol con factor de ramificación constante b = 3 y profundidad d = 2?","o":["13.","9.","12.","27.","6."],"e":["N(3,2) = 1 + 3 + 9 = 13 = (3³ − 1)/(3 − 1).","Son solo los nodos del último nivel (b<sup>d</sup>).","Olvida contar la raíz.","Es b<sup>d+1</sup>, sin restar 1 ni dividir entre b − 1.","Es b·d, la memoria lineal de la búsqueda en profundidad, no el tamaño del árbol."]},{"s":"carac","c":"nnodos","q":"La expresión N(b,d) = 1 + b + b² + … + b<sup>d</sup> del tema permite estimar…","o":["el tiempo y la memoria necesarios para explorar el árbol.","el número de soluciones distintas que tiene el problema planteado.","el coste del camino óptimo cuando las acciones tienen costes distintos.","el factor de ramificación efectivo a partir de la profundidad.","el número de iteraciones que realiza la profundidad iterativa."],"e":["§2.2.2: el valor n estima ambos recursos.","No cuenta soluciones, sino nodos generados.","Para costes distintos se usa C* y ε (coste uniforme).","El factor efectivo se calcula con la ecuación 2.1.","IDDFS realiza d + 1 iteraciones, no N(b,d)."]},{"s":"crit","c":"ciega","q":"Los algoritmos de búsqueda básica (fuerza bruta, exhaustiva o ciega) se caracterizan por…","o":["no disponer de información del dominio más allá de la definición del problema.","emplear una función heurística que estima el coste restante hasta la meta.","mantener una única solución candidata y mejorarla de forma iterativa.","modelar un oponente que minimiza la utilidad del jugador.","descartar el camino y quedarse solo con la configuración final."],"e":["Exploran el árbol de forma sistemática hasta hallar el objetivo.","Eso define la búsqueda informada (Tema 3).","Eso es la búsqueda local (Tema 4).","Eso es la búsqueda adversaria.","Es propio de la optimización pura (Tema 4)."]},{"s":"crit","c":"ciega","q":"¿Cuándo se prefieren, según el tema, los algoritmos de búsqueda no informada?","o":["Cuando prima la simplicidad o no se dispone de funciones heurísticas.","Cuando el espacio de estados es tan grande que la memoria resulta crítica y hay muchos óptimos locales.","Cuando el entorno es estocástico y parcialmente observable para el agente.","Cuando hay un adversario racional que juega contra el agente.","Cuando se dispone de una heurística consistente para el problema."],"e":["Además sirven de base de comparación para algoritmos más avanzados.","En ese caso el tema recomienda la búsqueda local y las metaheurísticas.","Requieren determinismo y observabilidad.","Eso requiere búsqueda adversaria.","Con heurística se emplearía búsqueda informada."]},{"s":"crit","c":"criterios","q":"¿Cuáles son los cuatro criterios fundamentales con los que el tema evalúa los algoritmos de búsqueda?","o":["Completitud, optimalidad y complejidades temporal y espacial.","Admisibilidad, consistencia, dominancia y completitud de la heurística.","Determinismo, observabilidad, discreción y racionalidad.","Exploración, explotación, diversidad y convergencia.","Factor de ramificación, profundidad, coste y número de soluciones."],"e":["§2.3.","Las tres primeras son propiedades de heurísticas (Tema 3).","Son propiedades del entorno o del agente.","Son conceptos de metaheurísticas (Tema 4).","Son parámetros del problema, no criterios de evaluación."]},{"s":"crit","c":"criterios","q":"La <b>completitud</b> de un algoritmo de búsqueda indica…","o":["si garantiza encontrar una solución siempre que esta exista.","si la solución hallada es la de menor coste posible.","si recorre todos los nodos del espacio de estados antes de terminar.","si su memoria crece de forma lineal con la profundidad.","si se detiene en un tiempo finito incluso cuando no hay solución."],"e":["Definición de §2.3.","Eso es la optimalidad.","Ser exhaustivo no es la definición de completitud.","Es una propiedad de complejidad espacial.","La definición del tema se refiere a hallar la solución si existe."]},{"s":"crit","c":"espacial","q":"Según el tema, la complejidad espacial mide la memoria necesaria para mantener…","o":["la frontera de la búsqueda (nodos pendientes de expansión).","únicamente el camino de la solución final que se devuelve.","el número de acciones distintas que admite el problema.","la tabla de costes de todas las aristas del grafo.","la lista de soluciones alternativas encontradas."],"e":["§2.3: así se define la complejidad espacial.","La memoria incluye los nodos pendientes, no solo la solución.","No es la definición del tema.","No es lo que mide el criterio.","La búsqueda básica se detiene en la primera solución."]},{"s":"crit","c":"espacial","q":"¿En qué unidad mide habitualmente el tema la <b>complejidad temporal</b>?","o":["En número de nodos generados.","En segundos de CPU medidos experimentalmente en cada máquina.","En el número de estados objetivo del problema.","En el coste acumulado g(n) del nodo solución.","En la longitud de la frontera al final de la búsqueda."],"e":["§2.3: estimación del tiempo medido en nodos generados.","El tema usa una medida independiente de la máquina.","No es la unidad usada.","Es el coste de la solución, no el tiempo.","Eso se relaciona con la memoria."]},{"s":"bfs","c":"fifo","q":"¿Qué estructura de datos usa la búsqueda en anchura para gestionar la frontera?","o":["Una cola FIFO: el primer nodo generado es el primero en expandirse.","Una pila LIFO: el último nodo generado es el primero en expandirse.","Una cola de prioridad ordenada por el coste acumulado g(n).","Una cola de prioridad ordenada por la heurística h(n).","Un conjunto sin orden del que se extrae un nodo al azar."],"e":["Garantiza explorar todos los nodos a distancia n antes que los de n + 1.","Es la estructura de la búsqueda en profundidad.","Es la estructura de la búsqueda de coste uniforme.","Es la búsqueda ávida (Tema 3).","BFS es sistemática, no aleatoria."]},{"s":"bfs","c":"fifo","q":"En el pseudocódigo de BFS del tema, ¿dónde se añade cada sucesor que no está ni en explorados ni en la frontera?","o":["Al final de la cola (<code>Añadir_Al_Final</code>).","Al inicio de la estructura, para que sea el próximo en salir.","En la posición que le corresponde según su coste acumulado.","Directamente en el conjunto de estados explorados.","En una posición aleatoria de la frontera."],"e":["Así se respeta el orden FIFO por niveles.","Es lo que hace DFS con <code>Añadir_Al_Inicio</code>.","Es lo que hace UCS con su cola de prioridad.","Se marca como explorado al extraerlo, no al generarlo.","BFS no inserta al azar."]},{"s":"bfs","c":"tiempo","q":"La complejidad temporal de BFS con factor de ramificación b y solución a profundidad d es…","o":["O(b<sup>d</sup>).","O(b·d).","O(b<sup>m</sup>), con m la profundidad máxima del árbol.","O(d²).","O(b<sup>d/2</sup>)."],"e":["N<sub>BFS</sub>(b,d) = (b<sup>d+1</sup> − 1)/(b − 1) ∈ O(b<sup>d</sup>).","Es una complejidad lineal, propia de la memoria de IDDFS.","Es la complejidad temporal de DFS.","No es la complejidad de ninguna estrategia ciega del tema.","No es la complejidad de BFS en el tema."]},{"s":"bfs","c":"tiempo","q":"¿Qué ocurre, según el tema, si en BFS el test de objetivo se aplica al <b>generar</b> el nodo en lugar de al expandirlo?","o":["La complejidad mantiene el mismo orden, aunque se ahorra el último nivel.","BFS deja de ser óptimo aunque las acciones tengan coste uniforme.","La complejidad temporal pasa a ser lineal en la profundidad.","BFS se convierte en una búsqueda de coste uniforme sobre la profundidad.","Deja de ser completo en espacios con factor de ramificación finito."],"e":["§2.3.1 lo señala expresamente.","Con costes unitarios el primer objetivo generado sigue estando en el nivel mínimo.","Sigue siendo exponencial.","UCS requiere ordenar la frontera por g(n).","La completitud no se pierde."]},{"s":"bfs","c":"espacio","q":"¿Cuál es, según el tema, el <b>punto crítico</b> de la búsqueda en anchura?","o":["Su complejidad espacial O(b<sup>d</sup>), que agota antes la memoria.","Que no es completa aunque el factor de ramificación sea finito.","Que puede quedar atrapada en una rama infinita del árbol de búsqueda.","Que su complejidad temporal es lineal y poco eficiente.","Que nunca devuelve la solución de menor profundidad."],"e":["Debe mantener en memoria explorados y frontera; en el nivel d la frontera tiene unos b<sup>d</sup> nodos.","BFS es completa si b es finito.","Ese es el problema de DFS.","Su tiempo es exponencial, no lineal.","Sí la devuelve: explora por niveles."]},{"s":"bfs","c":"espacio","q":"Un BFS con b = 10 alcanza la profundidad d. ¿Qué crece de forma más preocupante según el tema?","o":["La memoria, porque todos los nodos generados se conservan.","El número de iteraciones de profundización, que crece en d + 1.","El riesgo de devolver una solución no óptima con costes unitarios.","El tamaño de la pila de llamadas recursivas, que crece en b·d.","El número de veces que se regenera la raíz del árbol de búsqueda."],"e":["La frontera del nivel d tiene del orden de b<sup>d</sup> nodos.","BFS no itera por límites de profundidad; eso es IDDFS.","Con costes uniformes BFS es óptima.","BFS no usa recursión en profundidad.","Eso ocurre en IDDFS."]},{"s":"bfs","c":"completitud","q":"¿Bajo qué condición es <b>completa</b> la búsqueda en anchura?","o":["Si el factor de ramificación b es finito.","Solo si todas las acciones tienen exactamente el mismo coste.","Solo si se dispone de una heurística admisible.","Solo si el espacio de estados es un árbol sin ciclos.","Solo si la solución está a profundidad 1."],"e":["Así alcanza el nivel d y encuentra el objetivo si existe.","Esa es la condición de optimalidad, no de completitud.","La búsqueda ciega no usa heurísticas.","BFS con control de repetidos es completa también en grafos.","No hay tal restricción."]},{"s":"bfs","c":"completitud","q":"Un espacio de estados es infinito, pero cada estado tiene un número finito de sucesores y existe una solución a profundidad 7. ¿Qué garantiza el tema para BFS?","o":["Que la encuentra.","Que puede no encontrarla porque el espacio es infinito y la frontera nunca se vacía.","Que la encuentra solo si se aplica el test de objetivo al expandir los nodos.","Que la encuentra solo si además todas las acciones tienen coste uniforme.","Que la encuentra únicamente si se controlan los estados repetidos con una lista de cerrados."],"e":["BFS es completa si b es finito: acabará alcanzando el nivel 7.","La infinitud del espacio no impide alcanzar el nivel 7 si b es finito.","El momento del test no afecta a la completitud.","El coste uniforme afecta a la optimalidad, no a la completitud.","El control de repetidos ahorra trabajo, pero no es la condición de completitud de BFS."]},{"s":"bfs","c":"optimalidad","q":"BFS es <b>óptima</b> siempre que…","o":["el coste de las acciones sea uniforme.","el factor de ramificación sea finito, sean cuales sean los costes de las acciones.","se use una heurística consistente para ordenar la frontera.","se aplique el test de objetivo al extraer el nodo de la cola.","no existan ciclos en el grafo del problema."],"e":["Explora el nivel l completo antes que el l + 1; la primera solución es la menos profunda.","Eso garantiza completitud; con costes distintos no es óptima.","BFS no usa heurísticas.","Esa precaución es esencial en UCS, no lo que define la optimalidad de BFS.","La ausencia de ciclos no es la condición del tema."]},{"s":"bfs","c":"optimalidad","q":"En un grafo con acciones de costes distintos, BFS devuelve el camino de menos aristas. ¿Qué afirma el tema?","o":["Que con costes distintos BFS no garantiza la optimalidad.","Que BFS sigue siendo óptima porque explora por niveles.","Que BFS deja de ser completa aunque el factor de ramificación sea finito.","Que BFS equivale entonces a una búsqueda en profundidad.","Que BFS pasa a tener complejidad espacial lineal."],"e":["La solución menos profunda puede no ser la de menor coste.","Explorar por niveles solo garantiza el óptimo con costes uniformes.","Sigue siendo completa si b es finito.","No cambia su orden de expansión.","La memoria no depende de los costes."]},{"s":"dfs","c":"lifo","q":"¿Por qué DFS utiliza una pila LIFO según el tema?","o":["Para que el último nodo generado sea el siguiente en expandirse.","Para garantizar que todos los nodos de un nivel se exploren antes que los del siguiente.","Para expandir siempre el nodo con menor coste acumulado.","Para regenerar el árbol desde la raíz en cada iteración.","Para descartar los nodos que violan restricciones."],"e":["Así progresa siempre hacia el nivel más profundo.","Eso lo garantiza la cola FIFO de BFS.","Es la cola de prioridad de UCS.","Eso hace IDDFS.","Es propio del backtracking en CSP."]},{"s":"dfs","c":"lifo","q":"En DFS, desde un estado se generan los sucesores en el orden de las acciones A1, A2, A3 y cada uno se inserta <b>al inicio</b> de la pila. ¿Cuál se expande primero?","o":["El generado por A3, el último en insertarse.","El generado por A1, por ser la primera acción.","El de menor coste acumulado, sea cual sea su acción.","Uno elegido al azar entre los tres.","El generado por A2, que queda en medio de la pila."],"e":["LIFO: los sucesores se expanden en orden inverso al de las acciones.","Expandir en el orden de las acciones contradice el LIFO del algoritmo del tema.","DFS no ordena por coste.","DFS es sistemática.","Solo el último insertado queda en la cima."]},{"s":"dfs","c":"backtrack","q":"¿Qué hace DFS cuando alcanza un nodo sin sucesores que no es el objetivo?","o":["Retrocede al nodo más reciente con sucesores sin explorar.","Reinicia la búsqueda desde un estado aleatorio.","Incrementa el límite de profundidad y vuelve a empezar.","Termina devolviendo «No hay solución» aunque queden nodos en la pila.","Pasa al nodo de menor profundidad de toda la frontera."],"e":["§2.3.2.","Es el reinicio aleatorio de la ascensión de colinas (Tema 4).","Es lo que hace IDDFS entre iteraciones.","Solo termina así si la pila se vacía.","Eso se parecería a BFS."]},{"s":"dfs","c":"backtrack","q":"¿Cómo describe el tema la estrategia general de exploración de DFS frente a BFS?","o":["Progresa siempre hacia el nivel más profundo, no de forma radial.","Explora por niveles, expandiendo los sucesores antes de bajar.","Expande el nodo con menor estimación hasta la meta.","Expande los nodos en círculos de coste creciente.","Explora únicamente hasta un umbral de f(n)."],"e":["Expande el nodo más profundo de la frontera.","Eso es BFS.","Es la búsqueda ávida.","Es UCS.","Es IDA* (Tema 3)."]},{"s":"dfs","c":"tiempo","q":"Si el árbol es finito con profundidad máxima m, la complejidad temporal de DFS es…","o":["O(b<sup>m</sup>).","O(b·m).","O(b<sup>d</sup>), con d la profundidad de la solución mínima.","O(m).","O(b<sup>1+⌊C*/ε⌋</sup>)."],"e":["En el peor caso explora todo el espacio de estados.","Es su complejidad espacial.","Es la de BFS; DFS depende de m.","Solo sería así con b = 1.","Es la complejidad de UCS."]},{"s":"dfs","c":"tiempo","q":"¿En qué situación puede DFS tardar <b>más</b> que BFS según el tema?","o":["Cuando m es mucho mayor que d.","Cuando existen muchas soluciones en ramas profundas.","Cuando el factor de ramificación del árbol es exactamente 1.","Cuando la solución está en la primera rama explorada.","Cuando todas las acciones tienen coste uniforme."],"e":["O(b<sup>m</sup>) puede superar a O(b<sup>d</sup>).","En ese caso DFS podría encontrar solución más rápido que BFS.","Con b = 1 ambas recorren una sola rama.","En ese caso DFS es muy rápida.","El coste no afecta al orden de DFS."]},{"s":"dfs","c":"espacio","q":"La memoria requerida por DFS es M(b,m) = b·m porque solo almacena…","o":["la ruta actual y los hermanos no expandidos de sus nodos.","todos los nodos generados en cada nivel del árbol.","el nodo actual y su mejor vecino según la función de coste.","la frontera completa ordenada por coste.","el conjunto de estados explorados de todas las iteraciones."],"e":["Es la ventaja comparativa de DFS: complejidad lineal.","Eso hace BFS.","Es más propio de la búsqueda local.","Es UCS.","No es lo que justifica b·m."]},{"s":"dfs","c":"espacio","q":"¿Qué ventaja comparativa atribuye el tema a DFS frente a BFS?","o":["Su complejidad espacial lineal, O(b·m).","Su optimalidad con costes uniformes.","Su completitud en espacios infinitos.","Su complejidad temporal siempre inferior a la de BFS.","Que no necesita controlar estados repetidos en grafos con ciclos."],"e":["Permite abordar espacios mucho mayores que BFS.","DFS no es óptima.","DFS no es completa en espacios infinitos.","Puede ser superior si m ≫ d.","Sin ese control puede quedar atrapada en ciclos."]},{"s":"dfs","c":"completitud","q":"¿Cuándo NO es completa la búsqueda en profundidad según el tema?","o":["En espacios infinitos o con ciclos sin control de repetidos.","Cuando el factor de ramificación es muy pequeño.","Cuando todas las acciones tienen el mismo coste.","Cuando el objetivo está a poca profundidad en la rama inicial.","Cuando se aplica a un árbol finito sin ciclos."],"e":["Puede quedar atrapada en una rama infinita aunque haya solución cerca.","El tamaño de b no es la causa.","El coste no afecta a la completitud de DFS.","En ese caso la encontraría.","En un árbol finito acaba explorándolo todo."]},{"s":"dfs","c":"completitud","q":"¿Qué medida propone el tema para que DFS no quede atrapada en espacios finitos con ciclos?","o":["Un control de estados repetidos (lista de cerrados).","Sustituir la pila LIFO por una cola FIFO manteniendo el resto del algoritmo.","Ordenar los sucesores de cada nodo por su coste acumulado antes de insertarlos.","Aumentar el factor de ramificación para que haya más ramas alternativas.","Aplicar el test de objetivo al generar cada sucesor en lugar de al extraerlo."],"e":["Es la variante de búsqueda en grafos que garantiza completitud en espacios finitos con ciclos.","Eso convertiría el algoritmo en BFS, no en una DFS completa.","Ordenar por coste no evita volver a estados ya visitados.","Más ramas no evitan los ciclos.","No impide los ciclos."]},{"s":"dfs","c":"optimalidad","q":"¿Por qué DFS no es óptima según el tema?","o":["Devuelve la primera solución que halla, aunque sea profunda.","Porque su memoria crece de forma exponencial.","Porque explora por niveles y se queda sin memoria.","Porque necesita una heurística admisible.","Porque expande nodos en círculos de coste creciente."],"e":["Ignora soluciones más cercanas a la raíz en ramas aún no exploradas.","Su memoria es lineal.","Eso describe a BFS.","DFS es una búsqueda ciega.","Eso es UCS, que sí es óptima."]},{"s":"dfs","c":"optimalidad","q":"Un árbol tiene una solución a profundidad 2 en la rama derecha y otra a profundidad 9 en la rama izquierda, que DFS explora primero. ¿Qué devuelve DFS?","o":["La de profundidad 9.","La de profundidad 2, porque al final DFS siempre compara todas las soluciones halladas.","La de profundidad 2, porque la pila LIFO prioriza los nodos menos profundos.","Ninguna, porque DFS no es completa en árboles finitos.","Ambas, ordenadas por profundidad."],"e":["DFS devuelve la primera solución de su descenso; por eso no es óptima.","DFS no compara soluciones: se detiene en la primera.","La pila prioriza los nodos más profundos.","En un árbol finito DFS es completa.","DFS devuelve una única solución."]},{"s":"iddfs","c":"mecanismo","q":"¿Cómo funciona la búsqueda en profundidad iterativa (IDDFS)?","o":["Repite DFS limitada con límites L = 0, 1, 2, … hasta hallar la solución.","Alterna una expansión en anchura y otra en profundidad por nivel.","Expande en profundidad solo los nodos cuyo f(n) no supera un umbral.","Ejecuta una única DFS con un límite de profundidad prefijado.","Expande en profundidad ordenando los sucesores por coste."],"e":["En cada iteración regenera el árbol desde la raíz.","No alterna estrategias; repite DFS limitada.","Eso es IDA* (Tema 3).","Eso es la profundidad limitada simple; IDDFS incrementa el límite.","No es el mecanismo del tema."]},{"s":"iddfs","c":"mecanismo","q":"¿Qué combina IDDFS según el tema?","o":["La memoria de DFS con la completitud y optimalidad de BFS.","La heurística de la búsqueda ávida con el coste acumulado de UCS.","La aleatoriedad del recocido simulado con la sistematicidad de la anchura.","La rapidez de BFS con la optimalidad de DFS.","La memoria de BFS con la completitud de DFS."],"e":["Es la motivación de §2.3.3.","Eso describe A* (Tema 3).","No guarda relación.","DFS no es óptima.","Es justo al revés."]},{"s":"iddfs","c":"formula","q":"Según la ecuación 2.5, ¿cuántas veces se generan los nodos del nivel 1 en IDDFS con solución a profundidad d?","o":["d veces.","d + 1 veces.","Una sola vez, como en BFS.","b veces.","d − 1 veces."],"e":["N<sub>IDDFS</sub> = (d + 1)b<sup>0</sup> + d·b<sup>1</sup> + (d − 1)b<sup>2</sup> + … + 1·b<sup>d</sup>.","Ese es el número de veces que se genera la raíz (nivel 0).","Solo el último nivel se genera una vez.","El número de repeticiones no depende de b.","Corresponde al nivel 2."]},{"s":"iddfs","c":"formula","q":"Con b = 2 y solución a profundidad d = 2, ¿cuántos nodos genera IDDFS frente a BFS?","o":["11 frente a 7.","7 frente a 7.","14 frente a 7.","11 frente a 4.","9 frente a 7."],"e":["IDDFS: 3·1 + 2·2 + 1·4 = 11; BFS: 1 + 2 + 4 = 7.","IDDFS regenera los niveles superiores, así que genera más.","No corresponde a la ecuación 2.5.","BFS genera también la raíz y el nivel 1.","Infravalora las repeticiones de la raíz."]},{"s":"iddfs","c":"complejidad","q":"¿Cuáles son la complejidad temporal y espacial de IDDFS según el tema?","o":["Temporal O(b<sup>d</sup>) y espacial O(b·d).","Temporal O(b<sup>d</sup>) y espacial O(b<sup>d</sup>).","Temporal O(d·b<sup>d</sup>) y espacial O(b<sup>d</sup>).","Temporal O(b<sup>m</sup>) y espacial O(b·m).","Temporal O(b·d) y espacial O(1)."],"e":["Mismo orden temporal que BFS con memoria lineal.","Esa es la combinación de BFS.","El tema concluye que el tiempo sigue siendo O(b<sup>d</sup>) y la memoria es lineal.","Es DFS con profundidad máxima m.","El tiempo es exponencial."]},{"s":"iddfs","c":"complejidad","q":"¿Por qué la regeneración de niveles en IDDFS no cambia el orden asintótico del tiempo?","o":["Porque la mayoría de los nodos de un árbol exponencial están en el último nivel.","Porque IDDFS almacena los niveles superiores y no los vuelve a generar.","Porque IDDFS solo genera los nodos del último nivel.","Porque el factor de ramificación disminuye en cada iteración.","Porque usa una cola de prioridad que evita duplicados."],"e":["Repetir los niveles superiores apenas añade coste cuando b > 1.","Sí los vuelve a generar en cada iteración.","Genera todos los niveles hasta el límite.","b no cambia.","IDDFS no usa cola de prioridad."]},{"s":"iddfs","c":"sobrecoste","q":"Según la demostración del tema, el sobrecoste de IDDFS respecto a BFS para b = 10 es aproximadamente…","o":["un 11 % más de nodos.","el doble de nodos.","d veces más nodos.","un 1 % más de nodos.","un 90 % más de nodos."],"e":["El factor es b/(b − 1) ≈ 1,11.","Sería así con b = 2, no con b = 10.","El sobrecoste es un factor constante, no proporcional a d.","Infravalora el factor b/(b − 1).","No corresponde al cálculo del tema."]},{"s":"iddfs","c":"sobrecoste","q":"El tema demuestra que el número de nodos generados por IDDFS respecto a BFS crece en un factor aproximadamente igual a…","o":["b/(b − 1).","d + 1.","b<sup>d</sup>.","log b.","(b − 1)/b."],"e":["Es un factor constante pequeño cuando b es grande.","Sería el caso si todos los niveles tuvieran el mismo número de nodos.","No es un factor constante.","No aparece en la demostración.","Es menor que 1: IDDFS no puede generar menos nodos que BFS."]},{"s":"iddfs","c":"props","q":"¿Cuándo es óptima la búsqueda en profundidad iterativa según el tema?","o":["Cuando el coste de las acciones es uniforme.","Siempre que el factor de ramificación sea finito, sean cuales sean los costes.","Solo si se dispone de una heurística admisible.","Nunca, porque hereda los defectos de DFS.","Solo si el espacio de estados no tiene ciclos."],"e":["Encuentra la solución en el nivel d más bajo antes de probar niveles más profundos.","b finito garantiza completitud, no optimalidad con costes distintos.","Es una búsqueda ciega.","Hereda la optimalidad de BFS con costes uniformes.","No es la condición del tema."]},{"s":"iddfs","c":"props","q":"¿Cuándo es preferible IDDFS según la conclusión de §2.3.3?","o":["Con espacios grandes y profundidad de la solución desconocida.","Cuando las acciones tienen costes reales muy distintos entre sí y conviene ordenarlas.","Cuando la memoria disponible es ilimitada.","Cuando la solución está siempre a profundidad 1.","Cuando hay un adversario que juega en contra."],"e":["Une la optimalidad de BFS y la memoria lineal de DFS.","Con costes distintos el tema recomienda UCS.","Entonces BFS no tendría inconveniente.","No es la recomendación del tema.","Eso requiere búsqueda adversaria."]},{"s":"ucs","c":"mecanismo","q":"¿Según qué criterio expande los nodos la búsqueda de coste uniforme?","o":["Según su coste acumulado desde la raíz, g(n).","Según su profundidad en el árbol.","Según la estimación heurística h(n).","Según g(n) + h(n).","Según el número de sucesores de cada nodo."],"e":["La frontera es una cola de prioridad ordenada por g(n); variante de Dijkstra.","Eso hace BFS.","Eso hace la búsqueda ávida.","Eso hace A* (Tema 3).","No es el criterio de UCS."]},{"s":"ucs","c":"mecanismo","q":"En el pseudocódigo de UCS, si un sucesor ya está en la frontera con una prioridad <b>mayor</b> que el nuevo coste…","o":["se actualiza su prioridad con el nuevo coste, menor.","se descarta el nuevo camino porque el estado ya estaba en la frontera.","se inserta un duplicado al final de la cola.","se marca el estado como explorado.","se detiene la búsqueda y se devuelve ese sucesor."],"e":["Así la frontera conserva el mejor camino conocido a ese estado.","Se perdería un camino mejor.","UCS no inserta al final; ordena por prioridad.","Se marca como explorado al extraerlo.","El test de objetivo se hace al extraer."]},{"s":"ucs","c":"complejidad","q":"Con C* el coste óptimo y ε el coste mínimo por acción, la complejidad temporal y espacial de UCS es…","o":["O(b<sup>1+⌊C*/ε⌋</sup>).","O(b<sup>d</sup>).","O(b·C*).","O(b<sup>C*·ε</sup>).","O(b<sup>⌊ε/C*⌋</sup>)."],"e":["⌊C*/ε⌋ aproxima los niveles efectivos; se suma 1 por expandir el nivel de la solución.","Con costes variables no puede usarse solo la profundidad d.","No es una complejidad lineal.","El exponente es un cociente, no un producto.","El cociente está invertido."]},{"s":"ucs","c":"complejidad","q":"Si C* = 12 y el coste mínimo de una acción es ε = 3, la complejidad de UCS según el tema es…","o":["O(b<sup>5</sup>).","O(b<sup>4</sup>).","O(b<sup>36</sup>).","O(b<sup>12</sup>).","O(b<sup>3</sup>)."],"e":["1 + ⌊12/3⌋ = 5.","Falta sumar 1 al exponente.","No se multiplica C* por ε.","El exponente no es C* directamente.","Es el valor de ε, no el exponente."]},{"s":"ucs","c":"completitud","q":"¿Bajo qué condición es completa UCS?","o":["Si cada paso cuesta al menos una constante ε > 0.","Si todas las acciones tienen coste exactamente 1, como en la anchura.","Si se usa una heurística admisible.","Si la profundidad máxima del árbol es finita.","Si se permiten acciones de coste cero."],"e":["Evita bucles infinitos de coste cero.","Basta con costes acotados inferiormente por ε > 0.","UCS no usa heurísticas.","No es la condición del tema.","Los costes cero podrían provocar bucles infinitos."]},{"s":"ucs","c":"completitud","q":"¿Qué riesgo evita el tema al exigir en UCS que cada acción cueste al menos ε > 0?","o":["Los bucles infinitos de coste cero.","Que la frontera crezca exponencialmente con la profundidad de la solución.","Que la heurística sobreestime el coste restante.","Que el algoritmo expanda nodos en orden de profundidad.","Que el test de objetivo se aplique al generar los nodos."],"e":["Sin ese límite podría expandirse indefinidamente un ciclo que no incrementa g(n).","La frontera puede seguir siendo exponencial; no es lo que evita ε.","UCS no usa heurísticas.","El orden lo fija g(n), no ε.","No guarda relación con ε."]},{"s":"ucs","c":"optimo","q":"Para que UCS mantenga la optimalidad, ¿cuándo debe aplicarse el test de objetivo?","o":["Al extraer el nodo de la cola de prioridad.","Al generar el nodo como sucesor.","Al insertarlo en el conjunto de explorados.","Solo cuando la frontera queda vacía.","Al actualizar la prioridad del nodo."],"e":["Así el primer objetivo extraído es el de menor coste total.","Podría devolverse un objetivo generado antes de descubrir uno más barato.","El pseudocódigo lo hace antes, al extraer.","Entonces ya no habría nada que comparar.","No es el momento indicado."]},{"s":"ucs","c":"optimo","q":"¿Qué estrategia ciega del tema garantiza la solución óptima en grafos con acciones de costes distintos?","o":["La búsqueda de coste uniforme.","La búsqueda en anchura.","La búsqueda en profundidad iterativa.","La búsqueda en profundidad con lista de cerrados.","La generación y prueba."],"e":["Expande por g(n) y aplica el test de objetivo al extraer.","Solo es óptima con costes uniformes.","Solo es óptima con costes uniformes.","DFS no es óptima.","Es un método de CSP y no optimiza coste."]},{"s":"robot","c":"formal","q":"En el problema del robot en la habitación de 3 × 3, ¿cómo se representa un estado?","o":["Por el par (i, j) de fila y columna, con i, j ∈ {1, 2, 3}.","Por la secuencia de acciones realizadas desde la puerta de entrada hasta la casilla actual.","Por el número de casillas que quedan hasta la salida.","Por la terna (fila, columna, orientación del robot).","Por el conjunto de casillas ya visitadas."],"e":["Hay 9 estados posibles; el inicial es (1,1) y el objetivo (3,3).","Eso sería un camino, no un estado.","Eso se parece a una heurística, no al estado.","El tema no incluye orientación.","No es la representación del tema."]},{"s":"robot","c":"formal","q":"En el caso del robot del tema, ¿qué coste tiene cada desplazamiento entre casillas contiguas?","o":["Un coste uniforme de 1 unidad.","Un coste igual a la distancia euclídea entre centros.","Coste 1 en horizontal y 2 en vertical.","Un coste que depende del número de sucesores.","Coste cero, porque solo importa alcanzar la meta."],"e":["c(s, a, s') = 1; por eso BFS es óptima en este problema.","El tema fija coste unitario.","Esos costes asimétricos son del robot ROBI de las fichas 2 y 3.","No es la función de coste del tema.","Cada paso cuesta 1."]},{"s":"robot","c":"b275","q":"En la habitación de 3 × 3 con movimientos en cuatro direcciones, el factor de ramificación efectivo vale…","o":["2,75.","3.","4.","2,44.","2."],"e":["(2 + 3 + 2 + 3 + 4 + 3 + 2 + 3)/8 = 22/8 = 2,75, sin expandir el objetivo.","Sería la media si se dividiera 27 entre 9.","Es el número de sucesores de la casilla central.","Resulta de dividir 22 entre 9; el objetivo no se expande.","Es el número de sucesores de una esquina."]},{"s":"robot","c":"b275","q":"¿Cuántos sucesores tiene la casilla central (2,2) del robot con cuatro direcciones, y por qué no se cuentan los de (3,3) en la media?","o":["4; el objetivo no se expande porque la búsqueda termina al alcanzarlo.","8; porque el robot puede moverse también en diagonal.","3; porque una de las cuatro acciones devuelve siempre al estado anterior del camino.","4; porque (3,3) no tiene ningún sucesor posible.","2; porque el centro solo conecta con dos casillas."],"e":["Tabla 2.1 y cálculo de b efectivo del tema.","En §2.4 solo hay cuatro direcciones; las diagonales son de la ficha 1.","Desde el centro las cuatro acciones son aplicables.","(3,3) tendría sucesores, pero no se expande al ser el objetivo.","Conecta con cuatro."]},{"s":"robot","c":"bfsrobot","q":"En el árbol BFS del robot, ¿qué camino óptimo se obtiene y a qué profundidad?","o":["(1,1) → (1,2) → (1,3) → (2,3) → (3,3), a profundidad 4.","(1,1) → (2,2) → (3,3), a profundidad 2.","(1,1) → (2,1) → (3,1) → (3,2) → (3,3), a profundidad 3.","(1,1) → (1,2) → (2,2) → (3,3), a profundidad 3, con un movimiento diagonal.","(1,1) → (1,2) → (1,3) → (2,3) → (3,3), a profundidad 5."],"e":["Acciones: derecha, derecha, abajo, abajo.","Ese atajo requiere diagonales, que no existen en §2.4.","Ese camino tiene 4 acciones, no 3.","(2,2) → (3,3) no es un movimiento ortogonal.","El camino tiene 4 aristas."]},{"s":"robot","c":"bfsrobot","q":"Según el tema, ¿cuántos estados contiene el árbol BFS del robot y cuántos explora antes de descubrir la meta?","o":["92 en el árbol y 37 explorados.","89 estados y 37 explorados.","9 estados y 4 explorados.","37 estados y 92 explorados.","22 estados y 8 explorados."],"e":["§2.4.3.","89,3 es la estimación teórica con b = 2,75, no el árbol real.","9 son los estados del espacio, no los nodos del árbol.","Las cifras están intercambiadas.","22 es la suma de sucesores y 8 los estados expandibles."]},{"s":"robot","c":"nteorico","q":"Con b = 2,75 y d = 4, ¿qué tamaño teórico estima el tema para el árbol del robot?","o":["≈ 89,3 nodos.","≈ 57,2 nodos.","≈ 11 nodos.","≈ 92 nodos exactos.","≈ 245,6 nodos."],"e":["Σ<sub>i=0..4</sub> 2,75<sup>i</sup> ≈ 89,3; difiere algo de los 92 reales por la asimetría de la cuadrícula.","Es solo el último nivel (2,75<sup>4</sup>).","Es b·d, no el tamaño del árbol.","92 es el árbol real; la estimación teórica es menor.","Correspondería a un nivel más de profundidad."]},{"s":"robot","c":"nteorico","q":"¿A qué atribuye el tema la diferencia entre la estimación teórica (≈ 89,3) y el árbol BFS real del robot (92)?","o":["A las asimetrías de la cuadrícula, que hacen variar los sucesores.","A que BFS no aplica el test de objetivo.","A errores de redondeo en el cálculo del factor de ramificación y de la complejidad espacial.","A que BFS explora estados repetidos infinitamente.","A que la solución está a profundidad 5."],"e":["La estimación supone b uniforme.","BFS sí aplica el test.","No es la explicación del tema.","Con control de repetidos no ocurre.","La solución está a profundidad 4."]},{"s":"robot","c":"dfsrobot","q":"Según el tema, ¿qué le ocurre a la versión estándar de DFS, sin control de estados repetidos, en el problema del robot?","o":["Queda atrapada en un ciclo infinito entre acciones opuestas.","Encuentra el camino óptimo de profundidad 4 más rápido que la búsqueda en anchura.","Agota la memoria por almacenar toda la frontera de un nivel.","Devuelve una solución subóptima de profundidad 6.","Termina al comprobar que no existe solución."],"e":["Por eso se necesita la variante en grafos con conjunto de cerrados.","El tema dice que es incapaz de resolverlo con esa secuencia de acciones.","Eso le ocurre a BFS en problemas grandes.","No llega a devolver solución.","La solución existe; DFS no termina."]},{"s":"robot","c":"dfsrobot","q":"Desde (1,1) el robot puede aplicar «derecha» → (1,2) y «abajo» → (2,1), en ese orden. Si DFS inserta cada sucesor al inicio de la pila, ¿qué estado expande a continuación?","o":["(2,1), porque fue el último sucesor insertado.","(1,2), porque «derecha» es la primera acción aplicable.","(2,2), por estar más cerca de la salida.","(1,1) de nuevo, por no controlar repetidos.","(3,3), porque DFS salta al nodo más profundo del espacio."],"e":["Coincide con la figura 2.5: DFS baja primero por «abajo».","Con inserción al inicio, el primero generado queda debajo en la pila.","DFS no usa ninguna estimación de cercanía.","(1,1) no es sucesor directo de sí mismo.","Solo puede expandir sucesores generados."]},{"s":"robot","c":"ficha1","q":"En la Ficha 1, el robot de 3 × 3 puede moverse también en diagonal (8 operadores). Con el objetivo en una esquina, ¿cuál es el factor de ramificación efectivo?","o":["37/8 ≈ 4,63.","8.","2,75.","40/9 ≈ 4,44.","5."],"e":["3 esquinas no objetivo × 3 + 4 bordes × 5 + centro 8 = 37, entre 8 estados expandibles.","Es el número de sucesores solo de la casilla central.","Es el valor con solo cuatro direcciones.","Cuenta también los sucesores del objetivo y divide entre 9.","Es el número de sucesores de una casilla de borde."]},{"s":"robot","c":"ficha1","q":"En la Ficha 1 (granjero, lobo, oveja y col), si cada estado indica la orilla de los cuatro elementos, ¿cuántos estados teóricos hay y cuántos son válidos?","o":["16 teóricos y 10 válidos.","16 teóricos y todos válidos.","8 teóricos y 6 válidos.","24 teóricos y 10 válidos.","16 teóricos y 12 válidos."],"e":["2<sup>4</sup> = 16; 6 dejan solos lobo-oveja u oveja-col sin el granjero.","Hay configuraciones donde se pierde la mercancía.","Son 4 elementos binarios: 2<sup>4</sup> = 16.","24 son los estados de las jarras (6 × 4), no los del granjero.","Son 6 los estados no válidos, 3 por cada posición del granjero."]},{"s":"csp","c":"terna","q":"Un CSP se define formalmente como la terna (V, D, R), donde…","o":["V variables, D sus dominios finitos y R restricciones sobre ellas.","V son valores, D decisiones y R recompensas del agente.","V son vértices, D distancias y R rutas del grafo.","V es el estado inicial, D el estado objetivo y R el conjunto de acciones aplicables.","V son variables, D sus derivadas y R las raíces de la función objetivo."],"e":["§2.5.1.","No es la terminología del tema.","Se parece a un problema de rutas, no a un CSP.","Es la formalización de un problema de búsqueda clásico.","No es un CSP."]},{"s":"csp","c":"terna","q":"¿Qué ventaja fundamental atribuye el tema a formalizar un problema como CSP?","o":["Su carácter declarativo: se dice qué cumplir y el cómo queda a algoritmos generales.","Que garantiza encontrar la solución óptima en tiempo lineal para cualquier grafo de restricciones.","Que evita la explosión combinatoria en cualquier caso.","Que permite prescindir de los dominios de las variables.","Que convierte el problema en uno de juegos de suma cero."],"e":["Los algoritmos son independientes del dominio.","Solo con grafo en árbol se resuelve en tiempo lineal.","El peor caso sigue siendo exponencial.","Los dominios son parte de la definición.","No guarda relación."]},{"s":"csp","c":"restriccion","q":"Formalmente, una restricción sobre las variables (X<sub>i1</sub>, …, X<sub>ik</sub>) es…","o":["el subconjunto del producto cartesiano de sus dominios con las tuplas permitidas.","una función que asigna un coste a cada combinación de valores.","el dominio común a todas las variables implicadas.","una variable adicional que toma valores verdadero o falso.","la unión de los dominios de las variables implicadas."],"e":["Define qué combinaciones de asignaciones están permitidas.","Eso sería una función de coste.","Los dominios son D, no R.","No es la definición del tema.","Es un subconjunto del producto cartesiano, no una unión."]},{"s":"csp","c":"restriccion","q":"En la 3-coloración del triángulo, ¿cuántas tuplas contiene la restricción R<sub>12</sub>?","o":["6.","9.","3.","27.","2."],"e":["Las 3 × 3 = 9 combinaciones menos las 3 con el mismo color.","Incluiría las combinaciones con colores iguales, que no se permiten.","Son las combinaciones prohibidas, no las permitidas.","Es el número de asignaciones completas de las tres variables.","No corresponde a ninguna cuenta del tema."]},{"s":"csp","c":"tipos","q":"La restricción <code>Alldiff</code> sobre tres o más variables es un ejemplo de restricción…","o":["global (orden superior).","unaria.","binaria.","de dominio.","blanda o de preferencia."],"e":["Exige que todas las variables del conjunto tomen valores distintos.","Una restricción unaria afecta a una sola variable.","Involucra a más de dos variables.","No es una categoría del tema.","El tema no trata restricciones blandas."]},{"s":"csp","c":"tipos","q":"La restricción «X<sub>1</sub> ≠ rojo» es, según el tema, una restricción…","o":["unaria.","binaria.","global.","de orden superior.","inconsistente."],"e":["Afecta a una única variable.","Una binaria relaciona dos variables, como X<sub>i</sub> ≠ X<sub>j</sub>.","Una global implica tres o más variables.","Es sinónimo de global.","No es una categoría por número de variables."]},{"s":"csp","c":"binarizacion","q":"Según el tema, ¿por qué gran parte de las técnicas clásicas se centran en CSP binarios con dominios finitos?","o":["Porque cualquier CSP de orden superior es binarizable en tiempo polinomial.","Porque los CSP de orden superior no tienen solución.","Porque las restricciones globales no pueden representarse en ningún grafo de restricciones.","Porque los CSP binarios se resuelven siempre en tiempo lineal.","Porque los dominios infinitos son los más frecuentes."],"e":["§2.5.1.","Sí pueden tenerla.","No es el motivo que da el tema.","Solo con grafo en árbol.","Al contrario: se estudian dominios finitos."]},{"s":"csp","c":"binarizacion","q":"Un CSP tiene una restricción global sobre cuatro variables. Según el tema, ¿qué puede afirmarse?","o":["Que puede transformarse en un CSP binario equivalente en tiempo polinomial.","Que no puede representarse con ningún grafo, por lo que solo cabe Generación y Prueba.","Que debe descomponerse en cuatro restricciones unarias independientes.","Que su resolución pasa a ser lineal, porque el grafo resultante es un árbol.","Que convertirlo a binario exige un tiempo exponencial en el número de variables."],"e":["§2.5.1: cualquier CSP de orden superior es binarizable en tiempo polinomial.","Puede binarizarse y representarse en un grafo de restricciones.","Las unarias no capturan la relación entre variables.","Binarizar no convierte el grafo en un árbol.","El tema dice que la conversión es polinomial."]},{"s":"csp","c":"solucion","q":"Resolver un CSP consiste en encontrar una asignación…","o":["completa y consistente.","parcial y consistente, que satisfaga las restricciones ya evaluadas.","completa y de coste mínimo según la función objetivo.","consistente, aunque deje algunas variables sin valor.","completa, aunque viole alguna restricción unaria."],"e":["Todas las variables con valor y ninguna restricción violada.","Debe ser completa.","La optimización no forma parte de la definición de solución CSP.","Debe ser completa.","Debe ser consistente con todas las restricciones."]},{"s":"csp","c":"solucion","q":"¿Qué diferencia estructural destaca el tema entre el estado de un CSP y el de la búsqueda clásica?","o":["En un CSP el estado son variables y restricciones, lo que permite podar.","En un CSP el estado es atómico y solo puede compararse con el estado objetivo final.","En un CSP no existe estado inicial.","En un CSP el estado incluye siempre un coste acumulado g(n).","En un CSP los estados no tienen sucesores."],"e":["En la búsqueda clásica el estado es atómico.","Eso describe la búsqueda clásica.","El estado inicial es la asignación vacía.","No es lo que destaca el tema.","Sí los tienen: asignar una variable más."]},{"s":"grafo","c":"arcos","q":"En un grafo de restricciones, una arista que conecta X<sub>i</sub> y X<sub>j</sub> representa conceptualmente…","o":["dos arcos: (X<sub>i</sub>, X<sub>j</sub>) y (X<sub>j</sub>, X<sub>i</sub>).","un único arco dirigido de la variable de menor a la de mayor índice.","una acción que transforma un estado en otro.","el dominio común a ambas variables.","una restricción unaria duplicada."],"e":["§2.5.2.","El tema habla de dos arcos.","Eso es un arco del grafo de estados.","Los dominios se anotan junto a los nodos.","Una arista es una restricción binaria."]},{"s":"grafo","c":"arcos","q":"En el grafo de restricciones de un CSP binario, ¿qué representa cada nodo?","o":["Una variable X<sub>i</sub>, con su dominio D<sub>i</sub> indicado al lado.","Un estado completo del problema con todas las variables asignadas.","Una restricción binaria entre dos variables.","Un valor posible del dominio.","Una acción del agente."],"e":["§2.5.2.","Eso serían los nodos del árbol de búsqueda.","Las restricciones son las aristas.","Los valores se indican junto a cada variable.","No aplica a un grafo de restricciones."]},{"s":"grafo","c":"topologia","q":"Según el tema, si el grafo de restricciones tiene estructura de <b>árbol</b>, el CSP puede resolverse en…","o":["tiempo lineal.","tiempo logarítmico, porque cada variable tiene un solo padre.","tiempo polinomial de grado n, como la binarización.","tiempo exponencial, como cualquier CSP.","tiempo constante O(1)."],"e":["Mejora drástica frente al tiempo exponencial general.","El tema habla de tiempo lineal.","La binarización es polinomial; el árbol se resuelve en tiempo lineal.","Es precisamente el caso que mejora.","No es lo que afirma el tema."]},{"s":"grafo","c":"topologia","q":"Si el grafo de restricciones se descompone en varias componentes aisladas, el tema indica que…","o":["puede resolverse como varios subproblemas independientes.","el CSP no tiene solución.","hay que añadir restricciones globales para conectarlas.","se debe aplicar generación y prueba sobre cada componente por separado.","cada componente debe tener estructura de árbol."],"e":["La topología del grafo es clave para la eficiencia.","Las componentes aisladas no implican inconsistencia.","No es necesario.","No es lo que dice el tema.","No es una condición."]},{"s":"grafo","c":"kcolor","q":"¿Qué forma adopta el grafo de restricciones de la 3-coloración del triángulo del tema?","o":["La de un grafo completo K<sub>3</sub>.","La de un árbol de tres nodos.","La de tres componentes aisladas.","La de un grafo bipartito.","La de un único nodo con restricción global."],"e":["Todas las variables están conectadas por restricciones de desigualdad.","Un árbol de tres nodos tiene solo dos aristas.","Las tres variables son adyacentes entre sí.","Un triángulo no es bipartito.","Se representa con tres nodos y tres aristas."]},{"s":"grafo","c":"kcolor","q":"En el problema de k-coloración, ¿qué condición deben cumplir los nodos adyacentes?","o":["No compartir el mismo color.","Usar todos los colores disponibles al menos una vez.","Tener colores consecutivos en el orden del dominio.","Compartir el mismo color si están a distancia dos.","Tener dominios distintos entre sí."],"e":["Se traduce a restricciones binarias de desigualdad.","El tema lo menciona como posible restricción global adicional, no como definición.","No forma parte del problema.","No es una condición del problema.","Todos los dominios son {azul, rojo, verde}."]},{"s":"alg","c":"gyp","q":"¿Cómo trata las restricciones el algoritmo de <b>Generación y Prueba</b>?","o":["Como un filtro a posteriori sobre asignaciones completas.","Las comprueba en cada nodo interno, al asignar cada variable.","Las usa para ordenar las variables por número de valores restantes.","Las elimina transformando el CSP en un problema de optimización sin restricciones.","Las propaga a las variables vecinas antes de asignar."],"e":["Desaprovecha la información para reducir el factor de ramificación.","Eso hace la vuelta atrás.","Eso es MRV.","No es su funcionamiento.","No hay propagación en generación y prueba."]},{"s":"alg","c":"gyp","q":"¿Qué complejidad temporal y espacial asigna el tema a Generación y Prueba con n variables y dominio máximo d?","o":["Temporal O(d<sup>n</sup>) y espacial O(n).","Temporal O(n<sup>d</sup>) y espacial O(d).","Temporal O(d·n) y espacial O(1).","Temporal O(d<sup>n</sup>) y espacial O(d<sup>n</sup>).","Temporal O(2<sup>n</sup>) y espacial O(n²)."],"e":["Genera todas las combinaciones y solo guarda la asignación actual.","Base y exponente están intercambiados.","El tiempo es exponencial.","La memoria es lineal en n.","No corresponde al tema."]},{"s":"alg","c":"gypprops","q":"¿Por qué Generación y Prueba no es óptima según el tema?","o":["Porque genera las combinaciones en un orden arbitrario, sin función de coste.","Porque no es completa en dominios finitos.","Porque poda ramas que contienen la mejor solución sin evaluarlas.","Porque su memoria crece exponencialmente.","Porque solo explora asignaciones parciales."],"e":["Solo sería óptima explorando todo y comparando con una función objetivo.","Sí es completa en dominios finitos.","No poda nada.","Su memoria es lineal.","Explora asignaciones completas."]},{"s":"alg","c":"gypprops","q":"¿Es completa la Generación y Prueba según el tema?","o":["Sí, en dominios finitos, porque lo explora todo.","No, porque se detiene en la primera asignación inconsistente que encuentra.","Solo si el grafo de restricciones es un árbol.","Solo si se aplica MRV.","No, porque no utiliza ninguna pila."],"e":["§2.5.4.","No se detiene: descarta y sigue.","No es la condición.","MRV es una mejora del backtracking.","El algoritmo sí usa una pila LIFO."]},{"s":"alg","c":"bt","q":"¿Qué hace la Búsqueda con Vuelta Atrás cuando una asignación parcial viola una restricción?","o":["Descarta el subárbol: ninguna extensión puede ser solución.","Continúa asignando las variables restantes y comprueba la consistencia al final.","Cambia aleatoriamente el valor de la variable conflictiva.","Relaja la restricción violada y continúa.","Reinicia desde la asignación vacía."],"e":["Integra la validación en la generación.","Eso hace Generación y Prueba.","No es el mecanismo del tema.","No se relajan restricciones.","Retrocede, no reinicia."]},{"s":"alg","c":"bt","q":"En el pseudocódigo de backtracking, la función <code>CONSISTENTE</code> solo evalúa una restricción r si…","o":["todas las variables de r ya están asignadas.","la asignación es completa.","r es unaria.","r implica a la última variable asignada y a ninguna otra.","r es la más restrictiva del problema."],"e":["Así puede comprobar asignaciones parciales.","Eso haría que fuera igual que Generación y Prueba.","Evalúa restricciones de cualquier aridad si están asignadas.","No es la condición del pseudocódigo.","No hay tal criterio."]},{"s":"alg","c":"btprops","q":"¿Qué complejidades tiene la Búsqueda con Vuelta Atrás según el tema?","o":["Temporal O(d<sup>n</sup>) en el peor caso y espacial O(n).","Temporal O(n) y espacial O(n), gracias a la poda.","Temporal O(d<sup>n</sup>) y espacial O(d<sup>n</sup>), como BFS.","Temporal O(d<sup>n/2</sup>), como alfa-beta con ordenamiento ideal, y espacial O(n).","Temporal O(n·d) y espacial O(1)."],"e":["La poda reduce drásticamente el espacio explorado en la práctica.","El peor caso sigue siendo exponencial.","Hereda la memoria lineal de DFS.","No es lo que dice el tema.","El peor caso es exponencial."]},{"s":"alg","c":"btprops","q":"¿Es óptima la Búsqueda con Vuelta Atrás según el tema?","o":["No: satisface restricciones, no optimiza.","Sí, porque poda las ramas peores antes de que se lleguen a explorar.","Sí, si el dominio es finito.","Sí, si se usa LCV.","No, porque no es completa."],"e":["La primera solución hallada no tiene por qué ser la mejor.","Poda las inconsistentes, no las peores.","El dominio finito garantiza completitud, no optimalidad.","LCV mejora la eficiencia, no garantiza optimalidad.","Sí es completa en dominios finitos."]},{"s":"alg","c":"comparativa","q":"Para colorear un grafo de 7 nodos con 3 colores, ¿cuántas asignaciones completas explora Generación y Prueba y cuántos nodos estima el tema para el backtracking?","o":["3<sup>7</sup> = 2.187 frente a unos 25–100 nodos.","7<sup>3</sup> = 343 frente a unos 7 nodos.","2.187 frente a 2.187, porque ambos son O(d<sup>n</sup>).","21 frente a 7.","2.187 frente a 729."],"e":["Tabla 2.2.","Base y exponente intercambiados; y la cifra de backtracking no es esa.","La poda reduce mucho los nodos del backtracking.","No corresponde a la tabla.","No es la estimación del tema."]},{"s":"alg","c":"comparativa","q":"Según la Tabla 2.2, ¿dónde se realizan las pruebas de consistencia en cada método?","o":["GyP: solo en las hojas; Vuelta Atrás: en cada nodo interno.","Ambos en cada nodo interno.","Generación y Prueba: en cada nodo; Vuelta Atrás: solo en las hojas del árbol.","Ambos solo en las hojas.","Ninguno: la consistencia se comprueba antes de empezar."],"e":["Por eso la vuelta atrás poda y la otra no.","Generación y Prueba solo prueba asignaciones completas.","Está al revés.","La vuelta atrás valida durante la generación.","No es lo que dice la tabla."]},{"s":"heurcsp","c":"mrv","q":"La heurística <b>MRV</b> (Minimum Remaining Values) elige la variable…","o":["con menos valores restantes en su dominio.","con el dominio más grande, para conservar más opciones abiertas.","que participa en menos restricciones.","cuyo valor deja más opciones a las vecinas.","elegida al azar entre las no asignadas."],"e":["Permite detectar inconsistencias antes y podar cuanto antes.","Es justo lo contrario.","El desempate prefiere la que participa en más.","Eso es LCV, que ordena valores.","No es MRV."]},{"s":"heurcsp","c":"mrv","q":"¿Qué filosofía resume MRV frente a LCV, según el tema?","o":["MRV busca fallar rápido; LCV busca maximizar el éxito.","MRV busca maximizar el éxito; LCV busca fallar rápido.","Ambas buscan fallar rápido.","Ambas ordenan valores, no variables.","MRV ordena valores y LCV selecciona variables."],"e":["§2.5.5.","Está al revés.","LCV deja abiertas más opciones.","MRV elige variables.","Es al revés."]},{"s":"heurcsp","c":"grado","q":"Si hay empate según MRV, el tema propone seleccionar la variable que…","o":["participa en más restricciones con variables no asignadas.","tiene el menor índice en el orden de las variables.","participa en menos restricciones, para no bloquear a las variables restantes.","tiene el valor menos restrictivo.","se asignó en último lugar en la rama anterior."],"e":["Reduce el factor de ramificación en pasos futuros.","No es el criterio del tema.","Es lo contrario.","Eso es LCV, que ordena valores.","No es un criterio del tema."]},{"s":"heurcsp","c":"grado","q":"¿Qué objetivo persigue, según el tema, elegir en caso de empate la variable con más restricciones sobre las no asignadas?","o":["Reducir el factor de ramificación futuro.","Maximizar el número de soluciones distintas que se encuentran.","Garantizar que la solución sea óptima.","Eliminar la necesidad de retroceder.","Convertir el grafo en un árbol."],"e":["Es la justificación de la segunda estrategia de §2.5.5.","No es el objetivo.","No garantiza optimalidad.","Reduce, pero no elimina, el retroceso.","No modifica el grafo."]},{"s":"heurcsp","c":"lcv","q":"Una vez seleccionada la variable, la heurística <b>LCV</b> elige…","o":["el valor menos restrictivo para las vecinas.","el valor que más reduce los dominios de las variables vecinas.","el primer valor del dominio en orden alfabético.","la variable con menos valores restantes.","el valor que aparece en más restricciones unarias."],"e":["Maximiza las opciones futuras de las no asignadas.","Sería el más restrictivo.","No es LCV.","Eso es MRV, y elige variables.","No es el criterio."]},{"s":"heurcsp","c":"lcv","q":"Al colorear X, quedan rojo y verde. Si X = rojo eliminaría opciones a dos vecinas y X = verde a ninguna, LCV elige…","o":["verde, por ser el valor menos restrictivo.","rojo, para detectar antes una posible inconsistencia.","el que aparezca primero en el dominio.","cualquiera, porque LCV solo ordena variables.","ninguno: LCV obliga a retroceder."],"e":["Deja más opciones abiertas a las vecinas.","Esa lógica de «fallar rápido» corresponde a MRV.","LCV no usa el orden del dominio.","LCV ordena valores.","No hay inconsistencia que obligue a retroceder."]}]},"3":{"n":3,"nombre":"Búsqueda informada","secs":{"expl":["El problema de la explosión combinatoria","Tema 3 §3.1"],"heur":["Definición de función heurística","Tema 3 §3.2.1"],"prop":["Admisibilidad y consistencia","Tema 3 §3.2.2 y Fichas de trabajo 2–3"],"dis":["Diseño de heurísticas: relajación, dominancia y combinación","Tema 3 §3.2.3"],"greedy":["Búsqueda ávida (Greedy Best-First Search)","Tema 3 §3.3.1 y Ficha de trabajo 2"],"astar":["Algoritmo A*","Tema 3 §3.3.2 y Ficha de trabajo 3"],"ida":["IDA* (A* con profundización iterativa)","Tema 3 §3.3.3"],"juego":["Fundamentos de la búsqueda adversaria","Tema 3 §3.4.1"],"minimax":["Algoritmo Minimax","Tema 3 §3.4.2"],"ab":["Poda alfa-beta","Tema 3 §3.4.3"]},"qs":[{"s":"expl","c":"tabla","q":"Según la Tabla 3.1 (b = 10, 10⁶ nodos/s), ¿cuánto tardaría una búsqueda ciega hasta profundidad d = 8?","o":["Unos 1,85 minutos.","Unos 11,11 milisegundos, igual que a profundidad 4 porque el tiempo crece linealmente.","Unos 12,86 días de cómputo continuo sin interrupciones.","Unos 3.522 años, lo que la convierte en una búsqueda completamente inasumible.","Unos 0,11 milisegundos, lo mismo que con profundidad 2."],"e":["Genera 111.111.111 nodos: unos 111 s.","11,11 ms corresponde a d = 4; el tiempo crece exponencialmente.","Corresponde a d = 12.","Corresponde a d = 16.","Corresponde a d = 2."]},{"s":"expl","c":"tabla","q":"Con b = 10, ¿cuántos nodos genera una búsqueda ciega completa hasta profundidad d = 4 según la Tabla 3.1?","o":["11.111.","10.000, que son únicamente los nodos situados en el último nivel del árbol.","40, el producto del factor de ramificación por la profundidad.","111.111.111, la cifra asociada a un árbol de profundidad 8.","1.111, la suma de los niveles 0 a 3."],"e":["1 + 10 + 100 + 1.000 + 10.000 = 11.111.","Faltan los niveles superiores.","Es b·d, la memoria lineal de DFS.","Corresponde a d = 8.","Falta el nivel 4."]},{"s":"expl","c":"limitante","q":"Del análisis de la Tabla 3.1 el tema concluye que el factor limitante de la búsqueda no informada es, además del tiempo…","o":["el almacenamiento en memoria de la frontera.","la imposibilidad de definir correctamente la función de coste de las acciones del problema.","la falta de completitud de todas las estrategias ciegas en espacios finitos.","el número de acciones distintas que puede ejecutar el agente en cada estado.","la necesidad de disponer de un adversario racional."],"e":["Especialmente en algoritmos como la búsqueda en anchura.","No es la conclusión del tema.","BFS e IDDFS son completas con b finito.","No es lo que señala el tema.","No guarda relación."]},{"s":"expl","c":"limitante","q":"¿Qué propone el tema para corregir la ineficiencia de la búsqueda ciega ante la explosión combinatoria?","o":["Incorporar conocimiento del problema para estimar qué rutas prometen más.","Aumentar la velocidad de cómputo hasta 10⁹ nodos por segundo.","Sustituir la cola FIFO por una pila LIFO en todos los algoritmos.","Limitar siempre la profundidad a d = 4.","Eliminar la función de coste del problema."],"e":["Es la motivación de la búsqueda heurística.","La tabla muestra que el crecimiento exponencial supera cualquier mejora de hardware.","Reduce la memoria, pero no evita la explosión.","Eso podría dejar el problema sin solución.","No resuelve la explosión."]},{"s":"heur","c":"etimologia","q":"¿Qué significa el verbo griego <i>heuriskein</i> del que procede «heurística»?","o":["Encontrar o descubrir.","Estimar o aproximar un valor numérico a partir de observaciones parciales.","Ordenar o clasificar los elementos de un conjunto según su prioridad.","Recorrer o explorar un camino de forma sistemática.","Podar o recortar las ramas inútiles de un árbol."],"e":["§3.2.1.","No es su significado etimológico.","No es el significado.","No es el significado.","No es el significado."]},{"s":"heur","c":"etimologia","q":"¿Cómo describieron la heurística pioneros como Pólya, Simon y Newell, según el tema?","o":["Como reglas prácticas que cambian exhaustividad por viabilidad.","Como un algoritmo exacto que garantiza la solución óptima en tiempo polinómico.","Como una función que sobreestima el coste para acelerar la búsqueda.","Como un método de búsqueda exhaustiva y sistemática basado en la fuerza bruta.","Como una técnica de aprendizaje a partir de datos masivos."],"e":["Experiencia, juicio intuitivo o rules of thumb.","La heurística renuncia a la exhaustividad; no garantiza óptimo por sí sola.","Eso no es la descripción del tema.","Es justo lo opuesto.","No es la descripción del tema."]},{"s":"heur","c":"estadonodo","q":"¿Qué diferencia establece el tema entre <b>estado</b> y <b>nodo</b>?","o":["El nodo es un camino concreto hasta un estado, con su coste g(n).","Son sinónimos: un nodo es la configuración física del problema.","El estado lleva asociado el coste acumulado y el nodo no.","El nodo es la configuración y el estado el camino recorrido desde la raíz.","El estado solo existe en el árbol de búsqueda y el nodo en el espacio de estados."],"e":["Un mismo estado puede corresponder a varios nodos.","El tema los distingue expresamente.","Es al revés: g(n) se asocia al nodo.","Está invertido.","Está invertido."]},{"s":"heur","c":"estadonodo","q":"Dos caminos distintos llevan al robot a la casilla (2,3), con costes 3 y 5. Según el tema, son…","o":["dos nodos distintos con el mismo estado subyacente.","el mismo nodo, porque representan la misma casilla.","dos estados distintos con el mismo nodo.","dos heurísticas distintas para el mismo estado.","un estado objetivo y uno intermedio."],"e":["El nodo representa la trayectoria; g vale 3 en uno y 5 en el otro.","La misma casilla es el mismo estado, pero no el mismo nodo.","La relación es la inversa.","La heurística depende del estado, no del camino.","Nada indica que (2,3) sea objetivo."]},{"s":"heur","c":"def","q":"Según la Definición 3.2.1, una función heurística h(n) debe cumplir…","o":["h(n) ≥ 0 siempre y h(n) = 0 en los estados objetivo.","h(n) ≤ c(n, a, n') + h(n') para todo nodo y sucesor.","h(n) ≤ h*(n) para todo nodo.","h(n) > 0 en todos los nodos, incluidos los estados objetivo del problema.","h(n) = g(n) para el nodo raíz."],"e":["h : N → ℝ⁺ ∪ {0}.","Esa es la condición de consistencia, no la definición.","Esa es la admisibilidad, que no todas las heurísticas cumplen.","En un estado objetivo h vale 0.","No forma parte de la definición."]},{"s":"heur","c":"def","q":"¿Qué estima h(n) en un nodo n?","o":["El coste mínimo que resta desde n hasta un objetivo.","El coste real acumulado por el camino desde la raíz hasta el nodo n.","El número de nodos generados hasta alcanzar n.","La profundidad a la que se encuentra n.","La probabilidad de que n pertenezca al camino óptimo."],"e":["Aporta información sobre el futuro, frente a g(n), que mide el pasado.","Eso es g(n).","No es lo que estima la heurística.","No es la definición.","La heurística estima costes, no probabilidades."]},{"s":"heur","c":"hstar","q":"¿De qué depende directamente la eficiencia de la búsqueda informada según el tema?","o":["De la precisión con la que h(n) aproxima a h*(n).","De que h(n) sea siempre igual a cero en todos los nodos.","Del número de estados objetivo que tenga el problema.","De que h(n) sobreestime sistemáticamente el coste restante.","De que el factor de ramificación sea constante."],"e":["h*(n) es el coste real exacto del camino restante.","Con h = 0 no se aporta información.","No es lo que señala el tema.","Sobreestimar compromete la admisibilidad.","No es la dependencia que destaca el tema."]},{"s":"heur","c":"hstar","q":"En el extremo ideal, una heurística que calculara exactamente h*(n)…","o":["evitaría explorar alternativas, pero calcularla suele costar tanto como resolver el problema.","sería inadmisible por definición.","haría que A* se comportara exactamente como una búsqueda de coste uniforme en todo el árbol.","solo sería útil en problemas con costes uniformes.","impediría detectar el estado objetivo."],"e":["§3.2.3.","h = h* es admisible, pues no sobreestima.","Eso ocurre con h = 0.","No es lo que dice el tema.","En el objetivo valdría 0."]},{"s":"prop","c":"admisible","q":"Una heurística es <b>admisible</b> si…","o":["nunca sobreestima el coste real: 0 ≤ h(n) ≤ h*(n).","nunca subestima el coste real restante hasta el objetivo: h(n) ≥ h*(n).","cumple h(n) ≤ c(n, a, n') + h(n') para todo sucesor.","devuelve valores mayores que cualquier otra heurística del problema.","se calcula en tiempo constante O(1)."],"e":["Es una estimación optimista.","Es la condición contraria.","Eso es la consistencia.","Eso es la dominancia.","El coste de cálculo no define la admisibilidad."]},{"s":"prop","c":"admisible","q":"Desde un nodo n el coste real mínimo hasta la meta es 10. ¿Qué valor de h(n) violaría la admisibilidad?","o":["12.","10, ya que coincide exactamente con el coste real mínimo restante.","0, el valor mínimo que puede devolver una heurística.","7, una estimación optimista algo alejada del coste real.","9,5, muy próxima al coste real sin llegar a alcanzarlo."],"e":["Sobreestima el coste real: 12 > 10.","h = h* sigue siendo admisible.","0 ≤ h* siempre: es admisible.","Subestima: es admisible.","Subestima: es admisible."]},{"s":"prop","c":"consistente","q":"Una heurística es <b>consistente</b> (monótona) si para todo nodo n y sucesor n' se cumple…","o":["h(n) ≤ c(n, a, n') + h(n').","h(n) ≥ c(n, a, n') + h(n').","h(n) ≤ h*(n), sin referencia a los sucesores.","h(n') ≤ c(n, a, n') + h(n).","h(n) = h(n') para todo sucesor."],"e":["Ecuación 3.3.","La desigualdad está invertida.","Eso es la admisibilidad.","Los papeles de n y n' están intercambiados.","No es la condición."]},{"s":"prop","c":"consistente","q":"En un nodo n con h(n) = 9 se aplica una acción de coste 2 que lleva a n' con h(n') = 5. ¿Qué puede afirmarse?","o":["Que se viola la consistencia en esa arista: 9 > 2 + 5.","Que la heurística es consistente en esa arista, porque h decrece al avanzar hacia la meta.","Que la heurística es necesariamente inadmisible en n.","Que el coste de la acción está mal definido.","Que n' debe ser un estado objetivo."],"e":["La consistencia exige h(n) ≤ c + h(n').","Decrecer no basta: debe cumplirse h(n) ≤ c + h(n').","La inconsistencia no implica, por sí sola, inadmisibilidad.","No se deduce de los datos.","En un objetivo h valdría 0."]},{"s":"prop","c":"consadm","q":"¿Qué relación establece el tema entre consistencia y admisibilidad?","o":["Toda heurística consistente es admisible.","Toda heurística admisible es consistente, pero no al revés.","Son propiedades equivalentes en cualquier problema.","Son incompatibles: una heurística no puede cumplir ambas a la vez.","La consistencia solo tiene sentido si la heurística es inadmisible."],"e":["La consistencia es una condición más fuerte.","Es justo la implicación contraria.","No son equivalentes.","Muchas cumplen ambas, como Manhattan.","No es así."]},{"s":"prop","c":"consadm","q":"¿Qué garantiza la consistencia sobre f(n) = g(n) + h(n) a lo largo de un camino?","o":["Que f(n) sea monótonamente no decreciente al profundizar.","Que f(n) sea estrictamente decreciente hasta llegar al objetivo.","Que f(n) permanezca constante e igual al coste óptimo en todo el camino.","Que f(n) sea siempre igual a h*(n).","Que f(n) no dependa del coste acumulado."],"e":["Mejora el comportamiento de los algoritmos.","No decrece.","Solo ocurriría con h = h*.","No es lo que garantiza.","f incluye g(n)."]},{"s":"prop","c":"robi","q":"En la Ficha 3, ROBI usa h<sub>M</sub>(f,c) = 2·|3 − f| + 1·|2 − c|, con coste 1 en horizontal y 2 en vertical. ¿Es consistente?","o":["Sí: cada paso varía h como máximo en lo que cuesta (1 en horizontal, 2 en vertical).","No, porque ignora los derrumbes y sobreestima el coste en algunas casillas.","No, porque pondera de forma distinta los movimientos horizontales y verticales.","Solo en las casillas que no son adyacentes a un derrumbe.","Sí, pero solo porque vale 0 en la casilla del minero."],"e":["h(n) ≤ c + h(n') se cumple en ambos casos.","Ignorar obstáculos hace subestimar, no sobreestimar.","La ponderación coincide con los costes reales.","La propiedad se cumple en todas las aristas.","Valer 0 en el objetivo es la definición de heurística, no prueba la consistencia."]},{"s":"prop","c":"robi","q":"Si la heurística de ROBI es consistente, ¿necesita A* la «reapertura» de nodos ya explorados?","o":["No: con consistencia puede omitirse de forma segura.","Sí, siempre que haya obstáculos en la cuadrícula.","Sí, porque los costes verticales y horizontales son distintos.","Solo si la heurística es además inadmisible.","No, porque A* nunca reabre nodos sea cual sea la heurística."],"e":["f es no decreciente; la primera vez que se expande un estado se ha llegado por el mejor camino.","Los obstáculos no obligan a reabrir si h es consistente.","La asimetría está recogida en la heurística.","Una consistente es admisible.","Con heurísticas solo admisibles podría necesitarse."]},{"s":"prop","c":"fichas","q":"En la Ficha 2, para el granjero se propone h(s) = número de mercancías aún en la orilla de origen. ¿Por qué es admisible?","o":["Porque cada mercancía exige al menos un cruce para llegar al destino.","Porque coincide exactamente con el número mínimo de cruces en todos los estados.","Porque cuenta también al granjero, que siempre debe cruzar.","Porque vale 3 en el estado inicial y el óptimo tiene 3 cruces.","Porque es consistente y toda consistente es admisible por definición."],"e":["El número de cruces nunca es menor que h(s).","Normalmente se necesitan más cruces que mercancías.","La heurística no cuenta al granjero.","La solución óptima tiene 7 cruces.","El enunciado pide justificar la admisibilidad directamente."]},{"s":"prop","c":"fichas","q":"En la Ficha 3 (jarras de 5 y 3 litros) se usa h₀(s) = 0 si a = 4 y 1 en otro caso. ¿Qué puede decirse?","o":["Es admisible y A* encuentra el óptimo, aunque la guía sea muy pobre.","Es inadmisible porque toma solo los valores 0 y 1.","Hace que A* sea óptimo y expanda menos nodos que con cualquier otra heurística.","Hace que la búsqueda ávida encuentre siempre la solución óptima.","Es consistente pero no admisible."],"e":["Si a ≠ 4 hace falta al menos una acción; la heurística apenas discrimina.","Ser binaria no la hace inadmisible.","Por ser plana guía mal la búsqueda.","La ávida no garantiza el óptimo.","Toda consistente es admisible."]},{"s":"dis","c":"compromiso","q":"¿Qué compromiso exige el diseño de una heurística según el tema?","o":["Entre su precisión predictiva y el coste computacional de evaluarla.","Entre su admisibilidad y su consistencia, que no pueden cumplirse simultáneamente.","Entre la memoria de la frontera y el número de estados objetivo del problema.","Entre exploración y explotación del paisaje de soluciones.","Entre el coste de las acciones y la profundidad máxima del árbol."],"e":["Si es demasiado simple informa poco; si es demasiado compleja anula el ahorro de nodos.","Pueden cumplirse a la vez.","No es el compromiso que señala el tema.","Ese equilibrio es propio de las metaheurísticas (Tema 4).","No es el compromiso de diseño."]},{"s":"dis","c":
